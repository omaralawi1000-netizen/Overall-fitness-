<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0C0F">
<meta name="robots" content="noindex">
<title>Aven 2 · final round</title>
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/archivo-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/unbounded-hollow.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="dayline.css">
<link rel="stylesheet" href="rooms.css">
<link rel="stylesheet" href="plain.css">
</head>
<body>
<div id="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants" data-position="top">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Day line</button>
  <button class="proto-picker-item">Rooms</button>
  <button class="proto-picker-item">Ordinary</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script type="module">
import { dayline } from './dayline.js';
import { rooms } from './rooms.js';
import { plain } from './plain.js';

// Each variant mounts into the stage and returns a cleanup function. Nothing is stored on the phone: the day shown
// (training or rest) lives only in the address (?day=rest).
const variants = [dayline, rooms, plain];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
let cleanup = null;
let day = new URLSearchParams(location.search).get('day') === 'rest' ? 'rest' : 'train';

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function setDay(k) {
  day = k;
  const url = new URL(location);
  k === 'rest' ? url.searchParams.set('day', 'rest') : url.searchParams.delete('day');
  history.replaceState(null, '', url);
  mount(current);
}
function mount(i) {
  cleanup?.(); cleanup = null;
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { cleanup = variants[i](stage, { day, setDay }); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

document.fonts.ready.then(() => setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1));
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
