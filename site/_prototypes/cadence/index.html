<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aven Cadence</title>
<meta name="theme-color" content="#F3F0EA">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap">
<style>
/* Cadence: the type is the animation. One family (Mona Sans, width and weight axes).
   Today is paper with pigment letters seen through frost; the workout is a pigment field
   where the set itself is the poster. Numbers never cross-fade: digits roll, travel and lock in.
   Everything that moves is transform or opacity, driven by the browser (WAAPI + sampled springs). */
:root {
  --paper: #f3f0ea;
  --ink: #17153b;
  --ink-2: rgba(23, 21, 59, .62);
  --ink-3: rgba(23, 21, 59, .40);
  --hair: rgba(23, 21, 59, .10);
  --pig: linear-gradient(100deg, #2f3be6 0%, #6b46f0 30%, #b84fd6 56%, #ee6f9f 80%, #ffb8a0 100%);
  --lime: #dcff5c;
  --mint: #9ff5d2;
  --f: "Mona Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --noise: none;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--paper); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .16s cubic-bezier(.2,.8,.2,1); }
/* instant: every press dips on the very next frame */
button:active { transform: scale(.965); transition-duration: .05s; }
.row:active { transform: scale(.985); }
input { font: inherit; }
.num { font-variant-numeric: proportional-nums; }
.pig { background: var(--noise), var(--pig); -webkit-background-clip: text; background-clip: text; color: transparent; font-style: normal; }

/* rolling characters: the container clips vertically, slots hold one character each */
.roll { display: inline-flex; overflow-x: visible; overflow-y: clip; padding-block: .1em; margin-block: -.1em; white-space: pre; }
.roll .s { position: relative; display: inline-block; }
.roll .c { display: inline-block; }
.roll .x { position: absolute; left: 0; top: 0; }
/* written words: each word rises out of its own mask */
.wm { display: inline-block; overflow-y: clip; overflow-x: visible; padding-bottom: .14em; margin-bottom: -.14em; vertical-align: top; }
.wi { display: inline-block; }

.screen { position: fixed; top: 0; bottom: 0; left: 0; right: 0; width: min(100%, 440px); margin-inline: auto; overflow: hidden; }
.grain { position: absolute; inset: 0; background-image: var(--noise); pointer-events: none; }

/* ---------- Today ---------- */
#today { background: var(--paper); }
#today .grain { opacity: .55; }
.t-wrap { position: relative; height: 100%; display: flex; flex-direction: column; padding: calc(var(--st) + 18px) 20px calc(var(--sb) + 20px); }
.t-top { display: flex; justify-content: space-between; align-items: center; height: 36px; }
.t-date { font-size: 14px; font-weight: 560; letter-spacing: .01em; color: var(--ink-2); }
.lang { height: 36px; padding: 0 14px; border-radius: 18px; font-size: 13px; font-weight: 600; color: var(--ink-3); border: 1px solid var(--hair); }
.lang b { color: var(--ink); font-weight: 700; }
.t-greet { margin-top: 26px; font-size: 22px; font-weight: 500; font-stretch: 110%; letter-spacing: -.01em; color: var(--ink-2); }
.t-hero { position: relative; z-index: 1; margin-top: 2px; margin-left: -4px; line-height: .8; font-weight: 820; font-stretch: 100%; letter-spacing: -.045em; white-space: nowrap; }
.t-hero .roll { padding-block: .06em .04em; }
.t-pane { position: relative; z-index: 2; margin-top: -40px; padding: 20px 20px 20px; border-radius: 30px;
  background: rgba(255, 255, 255, .36); border: 1px solid rgba(255, 255, 255, .8);
  -webkit-backdrop-filter: blur(18px) saturate(1.8); backdrop-filter: blur(18px) saturate(1.8);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 24px 48px -30px rgba(47, 40, 140, .45); }
.t-plan { font-size: 15px; font-weight: 560; color: var(--ink-2); }
.t-beat { margin-top: 6px; font-size: 21px; line-height: 1.22; font-weight: 640; font-stretch: 105%; letter-spacing: -.015em; }
.btn-ink { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 60px; margin-top: 18px;
  border-radius: 30px; background: var(--ink); color: var(--paper); font-size: 18px; font-weight: 680; font-stretch: 108%; letter-spacing: .005em; }
.t-rows { margin-top: 20px; }
.row { display: flex; width: 100%; align-items: baseline; justify-content: space-between; height: 62px; padding: 0 2px; border-bottom: 1px solid var(--hair); text-align: left; }
.row:last-child { border-bottom: 0; }
.row-l { font-size: 15px; font-weight: 600; color: var(--ink-2); align-self: center; }
.row-l small { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-3); margin-top: 2px; }
.row-n { font-size: 38px; font-weight: 720; font-stretch: 85%; letter-spacing: -.02em; align-self: center; display: flex; align-items: baseline; gap: 5px; }
.row-n small { font-size: 15px; font-weight: 600; font-stretch: 100%; letter-spacing: 0; color: var(--ink-3); }
.t-coach { margin-top: auto; padding-top: 14px; }
.kick { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.t-coach p { margin-top: 8px; font-size: 19px; line-height: 1.28; font-weight: 560; letter-spacing: -.01em; }
.ask { display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; margin-top: 14px; padding: 0 18px; border-radius: 26px;
  border: 1px solid var(--hair); background: rgba(255, 255, 255, .45); font-size: 15.5px; font-weight: 560; color: var(--ink-2); }
.ask i { width: 9px; height: 9px; border-radius: 50%; background: var(--pig); }
.live { position: absolute; left: 20px; right: 20px; bottom: calc(var(--sb) + 18px); height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; background: rgba(28, 22, 96, .82); color: #fff; font-size: 16px; font-weight: 640;
  -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
  opacity: 0; transform: translateY(24px); pointer-events: none; }
.live.on { pointer-events: auto; }
.live span:last-child { font-stretch: 85%; font-size: 20px; }

/* ---------- Workout ---------- */
#work { color: #fff; visibility: hidden; opacity: 0;
  background:
    radial-gradient(120% 70% at 100% 0%, rgba(214, 92, 205, .78) 0%, rgba(214, 92, 205, 0) 60%),
    radial-gradient(90% 60% at 0% 38%, rgba(36, 44, 206, .9) 0%, rgba(36, 44, 206, 0) 70%),
    radial-gradient(110% 55% at 85% 82%, rgba(240, 112, 156, .62) 0%, rgba(240, 112, 156, 0) 62%),
    radial-gradient(90% 50% at 10% 100%, rgba(122, 74, 240, .9) 0%, rgba(122, 74, 240, 0) 70%),
    #3d35dc; }
#work .grain { opacity: .9; mix-blend-mode: soft-light; }
.w-wrap { position: relative; height: 100%; display: flex; flex-direction: column; padding: calc(var(--st) + 12px) 16px calc(var(--sb) + 14px); }
.w-top { display: flex; justify-content: space-between; align-items: center; height: 48px; }
.chip { height: 44px; padding: 0 16px; border-radius: 22px; font-size: 15px; font-weight: 620; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .2); }
.w-clock { font-size: 17px; font-weight: 650; font-stretch: 85%; letter-spacing: .02em; opacity: .85; }
.w-ex { margin-top: 18px; padding: 0 4px; }
.w-name { font-size: 27px; font-weight: 700; font-stretch: 108%; letter-spacing: -.02em; line-height: 1.05; }
.w-meta { margin-top: 6px; font-size: 14.5px; font-weight: 560; color: rgba(255, 255, 255, .72); }
.w-stage { position: relative; height: 318px; margin-top: 4px; }
.w-view { position: absolute; inset: 0; padding: 0 4px; }
.big { font-size: 212px; line-height: .86; font-weight: 760; font-stretch: 75%; letter-spacing: -.035em; }
.w-wrow { display: flex; align-items: flex-start; height: 200px; }
.w-unit { margin: 26px 0 0 6px; font-size: 22px; font-weight: 640; opacity: .75; }
.steps { margin-left: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 18px; }
.step { width: 66px; height: 66px; border-radius: 33px; font-size: 17px; font-weight: 680; font-stretch: 90%;
  background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .22);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.w-rrow { display: flex; align-items: center; height: 108px; }
.w-x { font-size: 56px; font-weight: 400; font-stretch: 75%; opacity: .55; margin-right: 6px; }
.w-reps { font-size: 108px; line-height: .9; font-weight: 760; font-stretch: 75%; letter-spacing: -.03em; }
.w-rl { margin: 0 0 0 8px; font-size: 18px; font-weight: 600; opacity: .7; align-self: flex-end; padding-bottom: 18px; }
.steps.h { flex-direction: row; padding-top: 0; }
.w-hint { height: 30px; padding: 0 4px; font-size: 16px; font-weight: 620; display: flex; align-items: center; gap: 8px; }
.w-hint i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.w-hint.pr { color: var(--lime); }
.w-hint.up { color: var(--mint); }
.w-pane { margin-top: auto; padding: 8px 10px 10px; border-radius: 30px;
  background: rgba(24, 16, 110, .2); border: 1px solid rgba(255, 255, 255, .2);
  -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22); }
.set { display: flex; align-items: center; height: 46px; padding: 0 12px; border-radius: 16px; font-size: 22px; font-weight: 700; font-stretch: 80%; }
.set.cur { background: rgba(255, 255, 255, .14); }
.set .i { width: 30px; font-size: 14px; font-weight: 650; font-stretch: 100%; opacity: .6; }
.set .v { display: flex; align-items: baseline; gap: 6px; }
.set .v em { font-style: normal; opacity: .55; font-weight: 500; }
.set.todo .v { opacity: .45; font-weight: 520; }
.set .st { margin-left: auto; min-width: 44px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; font-stretch: 100%; border-radius: 15px; }
.set .st.undo { padding: 0 14px; background: rgba(255, 255, 255, .18); }
.set .st.best { padding: 0 12px; background: var(--lime); color: #20184a; }
.set .st.ok { opacity: .8; font-size: 17px; }
.btn-white { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 64px; margin-top: 8px; border-radius: 32px; overflow: hidden;
  background: #fff; color: #231a6e; font-size: 19px; font-weight: 720; font-stretch: 108%; }
.btn-white .tint { position: absolute; inset: 0; background: var(--lime); opacity: 0; }
.btn-white .lbl { position: relative; }

/* rest */
#restView { opacity: 0; visibility: hidden; }
.r-digits { position: relative; height: 200px; }
.r-dim, .r-bright { position: absolute; left: 0; top: 0; white-space: nowrap; }
.r-dim { color: rgba(255, 255, 255, .2); }
.r-bright { color: var(--mint); }
.r-fill { position: absolute; inset: -20px -20px 0 -20px; overflow: hidden; will-change: transform; }
.r-fill .r-bright { left: 20px; top: 20px; will-change: transform; }
.r-row { display: flex; align-items: center; gap: 10px; height: 52px; }
.r-row .step { width: 74px; height: 44px; border-radius: 22px; font-size: 15px; }
.r-next { flex: 1; text-align: center; font-size: 16px; font-weight: 620; color: rgba(255, 255, 255, .78); }
.r-next b { font-weight: 760; font-stretch: 85%; font-size: 19px; color: #fff; }
.coachw { margin-top: 10px; padding: 14px 16px; border-radius: 22px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .16); min-height: 58px; }
.coachw .kick { color: rgba(255, 255, 255, .55); font-size: 11px; }
.coachw p { margin-top: 5px; font-size: 16.5px; line-height: 1.3; font-weight: 560; }
.coachw .acts { display: flex; gap: 8px; margin-top: 10px; }
.coachw .acts button { height: 42px; padding: 0 16px; border-radius: 21px; font-size: 15px; font-weight: 680; background: rgba(255, 255, 255, .16); }
.coachw .acts button.go { background: #fff; color: #231a6e; }

/* overlays inside the workout */
.ov { position: absolute; inset: 0; opacity: 0; visibility: hidden; display: flex; flex-direction: column; padding: calc(var(--st) + 60px) 24px calc(var(--sb) + 24px); }
#pr { background: rgba(26, 18, 96, .34); -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5); }
.pr-kick { font-size: 15px; font-weight: 760; letter-spacing: .3em; text-transform: uppercase; color: var(--lime); }
.medal { position: relative; margin-top: 18px; height: 240px; perspective: 900px; }
.face { position: absolute; left: 0; top: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-size: 230px; line-height: .86; font-weight: 800; font-stretch: 75%; letter-spacing: -.04em; white-space: nowrap; }
.face.old { color: rgba(255, 255, 255, .5); }
.face.new { left: auto; right: 0; transform: rotateY(180deg); background: var(--noise), linear-gradient(160deg, #ffffff 0%, var(--lime) 42%, var(--mint) 70%, #ffffff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.pr-unit { font-size: 26px; font-weight: 680; }
.pr-sub { margin-top: 18px; font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
.pr-sub em, #work .pig { font-style: normal; color: var(--lime); background: none; -webkit-background-clip: border-box; background-clip: border-box; }
.ov .foot { margin-top: auto; }
#done { background: rgba(26, 18, 96, .3); -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5); }
.done-h { font-size: 150px; line-height: .86; font-weight: 820; font-stretch: 75%; letter-spacing: -.04em; }
.stats { margin-top: 26px; }
.stat { display: flex; justify-content: space-between; align-items: baseline; height: 64px; border-bottom: 1px solid rgba(255, 255, 255, .16); }
.stat > span:first-child { font-size: 16px; font-weight: 600; opacity: .72; }
.stat .num { font-size: 44px; font-weight: 740; font-stretch: 80%; letter-spacing: -.02em; }
.stat .num small { font-size: 16px; font-weight: 600; opacity: .7; margin-left: 4px; }

/* sheet (shared by both screens) */
#scrim { position: fixed; inset: 0; background: rgba(20, 16, 60, .32); opacity: 0; visibility: hidden; z-index: 30; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; width: min(100%, 440px); margin-inline: auto; z-index: 31; visibility: hidden;
  padding: 10px 20px calc(var(--sb) + 22px); border-radius: 32px 32px 0 0;
  background: rgba(248, 246, 242, .78); -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8);
  border-top: 1px solid rgba(255, 255, 255, .9); box-shadow: 0 -20px 50px -30px rgba(30, 20, 100, .5); color: var(--ink); touch-action: none; }
#scrim.deep { background: rgba(14, 10, 50, .5); }
#sheet.dark { background: rgba(40, 30, 140, .55); color: #fff; border-top-color: rgba(255, 255, 255, .25); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: currentColor; opacity: .22; margin: 0 auto 16px; }
.sh-h { font-size: 26px; font-weight: 720; font-stretch: 105%; letter-spacing: -.02em; line-height: 1.1; }
.sh-p { margin-top: 8px; font-size: 16px; line-height: 1.35; font-weight: 520; opacity: .72; }
.sh-big { margin: 18px 0 6px; display: flex; align-items: center; justify-content: space-between; }
.sh-big .n { font-size: 96px; line-height: .9; font-weight: 760; font-stretch: 80%; letter-spacing: -.03em; }
.sh-big .n small { font-size: 20px; font-weight: 600; opacity: .55; letter-spacing: 0; margin-left: 6px; }
.round { width: 64px; height: 64px; border-radius: 32px; border: 1px solid var(--hair); background: rgba(255, 255, 255, .6); font-size: 26px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chips button { min-height: 52px; padding: 0 18px; border-radius: 26px; background: rgba(255, 255, 255, .7); border: 1px solid var(--hair); font-size: 15.5px; font-weight: 600; text-align: left; }
.chips button b { font-weight: 760; margin-left: 6px; }
#sheet.dark .chips button { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .2); }
.sh-go { margin-top: 18px; }
.bars { margin-top: 18px; }
.bar { display: grid; grid-template-columns: 64px 1fr 56px; align-items: center; height: 40px; font-size: 15px; font-weight: 600; }
.bar i { display: block; height: 12px; border-radius: 6px; background: var(--pig); transform-origin: 0 50%; }
.bar span:last-child { text-align: right; font-stretch: 85%; font-size: 18px; font-weight: 720; }
.reply { margin-top: 16px; min-height: 0; font-size: 19px; line-height: 1.32; font-weight: 580; letter-spacing: -.01em; }
.reply-act { margin-top: 12px; }
.reply-act button { height: 46px; padding: 0 18px; border-radius: 23px; background: var(--ink); color: var(--paper); font-weight: 680; font-size: 15.5px; }
.askrow { display: flex; gap: 8px; margin-top: 16px; }
.askrow input { flex: 1; height: 52px; padding: 0 18px; border-radius: 26px; border: 1px solid var(--hair); background: rgba(255, 255, 255, .8); font-size: 16px; color: var(--ink); outline: none; -webkit-user-select: text; user-select: text; }
.askrow button { width: 52px; height: 52px; border-radius: 26px; background: var(--ink); color: var(--paper); font-size: 20px; font-weight: 700; }
.hold { position: relative; width: 100%; height: 64px; margin-top: 20px; border-radius: 32px; overflow: hidden; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .26); touch-action: none; }
.hold .lb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 720; font-stretch: 108%; }
.hold .fillw { position: absolute; inset: 0; overflow: hidden; transform: translateX(-100%); will-change: transform; }
.hold .fillw .in { position: absolute; inset: 0; background: #fff; color: #231a6e; transform: translateX(100%); will-change: transform; }

/* toast and flight layers */
#toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 96px); z-index: 40; height: 52px; padding: 0 8px 0 20px; border-radius: 26px; display: flex; align-items: center; gap: 12px;
  background: rgba(23, 21, 59, .9); color: #fff; font-size: 15px; font-weight: 600; white-space: nowrap; opacity: 0; transform: translate(-50%, 20px); pointer-events: none;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
#toast button { height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255, 255, 255, .16); font-weight: 700; }
#toast.on { pointer-events: auto; }
.fly { position: fixed; left: 0; top: 0; z-index: 45; pointer-events: none; opacity: 0; will-change: transform; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
@media (prefers-reduced-motion: reduce) { .wi, .roll .c { transition: none; } }
</style>
</head>
<body>

<section id="today" class="screen" aria-label="Today">
  <div class="grain"></div>
  <div class="t-wrap">
    <div class="t-top">
      <div class="t-date" id="tDate"></div>
      <button class="lang" id="langBtn" aria-label="Language"></button>
    </div>
    <div class="t-greet" id="tGreet"></div>
    <div class="t-hero pig" id="hero"><span id="heroWord"></span></div>
    <div class="t-pane">
      <div class="t-plan" id="tPlan"></div>
      <div class="t-beat" id="tBeat"></div>
      <button class="btn-ink" id="startBtn"><span class="lbl" id="startLbl"></span></button>
    </div>
    <div class="t-rows">
      <button class="row" id="rowSleep"><span class="row-l"><span data-t="sleep"></span><small data-t="sleepSub"></small></span><span class="row-n"><span id="sleepN" class="num"></span><small data-t="h"></small></span></button>
      <button class="row" id="rowProt"><span class="row-l"><span data-t="protein"></span><small data-t="protSub"></small></span><span class="row-n"><span id="protN" class="num"></span><small>/ 160 g</small></span></button>
      <button class="row" id="rowWeight"><span class="row-l"><span data-t="weight"></span><small id="wSub"></small></span><span class="row-n"><span id="weightN" class="num"></span><small>kg</small></span></button>
    </div>
    <div class="t-coach" id="tCoach">
      <div class="kick">Coach</div>
      <p id="coachToday"></p>
      <button class="ask" id="askBtn"><i></i><span data-t="ask"></span></button>
    </div>
  </div>
  <button class="live" id="live"><span id="liveL"></span><span class="num" id="liveT"></span></button>
</section>

<section id="work" class="screen" aria-label="Workout">
  <div class="grain"></div>
  <div class="w-wrap">
    <div class="w-top">
      <button class="chip" id="backBtn">‹ <span data-t="today"></span></button>
      <div class="w-clock num" id="clock">0:00</div>
      <button class="chip" id="finishBtn" data-t="finish"></button>
    </div>
    <div class="w-ex">
      <div class="w-name" id="exName"></div>
      <div class="w-meta" id="exMeta"></div>
    </div>
    <div class="w-stage">
      <div class="w-view" id="workView">
        <div class="w-wrow">
          <div class="big num" id="wKg" aria-label="weight"></div><div class="w-unit">kg</div>

/* ---------- one shared set of springs, sampled into linear() ---------- */
function spring(k, c) {
  const dt = 1 / 600; let x = 0, v = 0, t = 0; const pts = [0];
  while (t < 2.5) { const a = -k * (x - 1) - c * v; v += a * dt; x += v * dt; t += dt; pts.push(x); if (Math.abs(x - 1) < 5e-4 && Math.abs(v) < 5e-3 && t > .05) break; }
  const N = 48, out = [];
  for (let i = 0; i <= N; i++) out.push(+pts[Math.round((pts.length - 1) * i / N)].toFixed(4));
  out[N] = 1;
  return { easing: `linear(${out.join(',')})`, duration: Math.round(t * 1000) };
}
const SP = {
  snap: spring(560, 47),   // digits and letters: fast, no overshoot
  glide: spring(290, 27),  // travel and sheets: a touch of overshoot
  soft: spring(170, 25),   // screens and writing: calm
};
const EASE_OUT = 'cubic-bezier(.2,.8,.2,1)';
function anim(el, kf, sp, extra = {}) {

}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { } };

/* ---------- noise tile: dithers every gradient and gives the paper its tooth ---------- */
(function () {
  const c = document.createElement('canvas'); c.width = c.height = 140; const g = c.getContext('2d');
  const d = g.createImageData(140, 140);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 14; }
  g.putImageData(d, 0, 0);
  document.documentElement.style.setProperty('--noise', `url(${c.toDataURL()})`);
})();

/* ---------- Roll: only the characters that change move; the rest slide aside (FLIP) ---------- */
class Roll {
  constructor(el, align = 'right') { this.el = el; this.align = align; this.text = ''; this.slots = []; el.classList.add('roll'); el.textContent = ''; }
  set(t, dir = 1, instant = false) {
    t = String(t); const old = this.text;
    if (t === old) return;
    const n = Math.max(old.length, t.length), Z = '\u0000';
    const A = this.align === 'right' ? old.padStart(n, Z) : old.padEnd(n, Z);
    const B = this.align === 'right' ? t.padStart(n, Z) : t.padEnd(n, Z);
    const before = this.slots.map((s) => s.getBoundingClientRect().left);
    while (this.slots.length < n) {
      const s = document.createElement('span'); s.className = 's';
      if (this.align === 'right') { this.el.prepend(s); this.slots.unshift(s); before.unshift(null); }
      else { this.el.append(s); this.slots.push(s); before.push(null); }
    }
    for (let i = 0; i < n; i++) if (A[i] !== B[i]) this.swap(this.slots[i], B[i], dir, instant || REDUCED, i);
    this.text = t;
    if (!instant && !REDUCED) {
      this.slots.forEach((s, i) => {
        if (before[i] == null) return;
        const dx = before[i] - s.getBoundingClientRect().left;
        if (Math.abs(dx) > .5) anim(s, [{ transform: `translateX(${dx}px)` }, { transform: 'none' }], SP.snap);
      });
    }
    // drop slots that are now empty
    for (let i = this.slots.length - 1; i >= 0; i--) {
      if (B[i] === Z) { const s = this.slots[i]; this.slots.splice(i, 1); setTimeout(() => s.remove(), instant ? 0 : SP.snap.duration); }
    }
  }
  swap(slot, ch, dir, instant, i) {
    slot.querySelectorAll('.x').forEach((e) => e.remove());
    const cur = slot.querySelector('.c');
    const h = slot.offsetHeight || this.el.offsetHeight || 40;
    const delay = instant ? 0 : Math.min(i, 4) * 0;
    if (cur) {
      if (instant) cur.remove();
      else {
        const m = new DOMMatrixReadOnly(getComputedStyle(cur).transform === 'none' ? undefined : getComputedStyle(cur).transform);
        cur.getAnimations().forEach((a) => a.cancel());
        cur.className = 'x';
        anim(cur, [{ transform: `translateY(${m.m42}px)`, opacity: 1 }, { transform: `translateY(${-dir * h * .9}px)`, opacity: 0 }], SP.snap, { fill: 'forwards' })
          .onfinish = () => cur.remove();
      }
    }
    if (ch !== '\u0000') {
      const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; slot.append(c);
      if (!instant) anim(c, [{ transform: `translateY(${dir * h * .9}px)`, opacity: .15 }, { transform: 'none', opacity: 1 }], SP.snap, { delay });
    }
  }
}
/* Fitness Wrapped lock-in: digits spin, then lock from the left */
async function lockIn(roll, final, steps = 9, every = 60) {
  const digits = [...final].map((ch, i) => (/\d/.test(ch) ? i : -1)).filter((i) => i >= 0);
  for (let s = 0; s < steps; s++) {
    const locked = Math.floor((s / steps) * digits.length);
    const str = [...final].map((ch, i) => { const k = digits.indexOf(i); return k >= 0 && k >= locked ? String((Math.random() * 10) | 0) : ch; }).join('');
    roll.set(str, 1); await wait(every);
  }
  roll.set(final, 1);
}

/* ---------- writing: words (or letters) rise out of their own masks ---------- */
function write(el, text, { by = 'word', stagger = 26, delay = 0, instant = false } = {}) {
  el.textContent = '';
  const parts = by === 'char' ? [...text].map((c) => (c === ' ' ? '\u00a0' : c)) : text.split(' ');
  const inners = []; let hiOn = false;
  parts.forEach((p, i) => {
    const m = document.createElement('span'); m.className = 'wm';
    const w = document.createElement('span'); w.className = 'wi';
    let open = p.startsWith('*'), core = open ? p.slice(1) : p;
    const close = /\*([.,]?)$/.exec(core); let tail = '';
    if (close) { tail = close[1]; core = core.slice(0, close.index); }
    if (open) hiOn = true;
    if (hiOn) { const e = document.createElement('em'); e.className = 'pig'; e.textContent = core; w.append(e, tail); } else w.textContent = core + tail;
    if (close) hiOn = false;
    m.append(w); el.append(m); inners.push(w);
    if (by !== 'char' && i < parts.length - 1) el.append(' ');
  });
  if (instant || REDUCED) return Promise.resolve();
  const as = inners.map((w, i) => anim(w, [{ transform: 'translateY(108%)', opacity: 0 }, { transform: 'none', opacity: 1 }], SP.soft, { delay: delay + i * stagger, fill: 'backwards' }));
  return as.length ? as[as.length - 1].finished.catch(() => { }) : Promise.resolve();
}
/* Family's Continue → Confirm: shared leading letters stay, the rest roll over */
function morph(el, text) {
  const old = el.textContent; if (old === text) return;
  let k = 0; while (k < old.length && k < text.length && old[k] === text[k]) k++;

  el._roll.set(text, 1);
}

/* ---------- flight: the very same number travels from where it was to where it lands ---------- */
function fly(node, fromEl, text, toEl, sp = SP.glide) {
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const cs = getComputedStyle(fromEl), ts = getComputedStyle(toEl);
  const s = parseFloat(ts.fontSize) / parseFloat(cs.fontSize);

  Object.assign(node.style, { fontFamily: cs.fontFamily, fontSize: cs.fontSize, fontWeight: cs.fontWeight, fontStretch: cs.fontStretch, letterSpacing: cs.letterSpacing,
    lineHeight: cs.lineHeight, color: cs.color, width: a.width + 'px', height: a.height + 'px', left: a.left + 'px', top: a.top + 'px', opacity: 1 });
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  fromEl.style.opacity = .14; toEl.style.opacity = 0; // the source stays as a faint ghost, so the screen never shows a hole
  const an = anim(node, [{ transform: 'none' }, { transform: `translate(${dx}px,${dy}px) scale(${s})` }], sp);
  return an.finished.catch(() => { }).then(() => { toEl.style.opacity = ''; node.style.opacity = 0; fromEl.style.opacity = ''; });
}

  if (sheetA) sheetA.cancel();
  sheet.style.transform = 'none';
  sheet.style.visibility = 'visible'; scrim.style.visibility = 'visible';
  sheetOpen = true; sheetSrc = src || null;
  const END = 'inset(0px 0px 0px 0px round 32px 32px 0px 0px)';
  if (clipA) clipA.cancel(); if (bodyA) bodyA.cancel();
  if (src && !REDUCED) {
    const r = src.getBoundingClientRect(), f = sheet.getBoundingClientRect();
    clipA = anim(sheet, [{ clipPath: insetOf(sheet, r, radiusOf(src)) }, { clipPath: END }], SP.glide);
    const dy = (r.top + r.height / 2) - (f.top + f.height / 2);
    bodyA = anim($('sheetBody'), [{ transform: `translateY(${dy * .35}px) scale(.94)`, opacity: 0 }, { opacity: 1, offset: .55 }, { transform: 'none', opacity: 1 }], SP.glide);
    src.style.opacity = 0;
  } else {
    sheetA = anim(sheet, [{ transform: `translateY(${sheet.offsetHeight + 20}px)` }, { transform: 'none' }], SP.glide);
  }
  anim(scrim, [{ opacity: +getComputedStyle(scrim).opacity }, { opacity: 1 }], SP.soft, { fill: 'forwards' });
}
function closeSheet(slide) {
  if (!sheetOpen) return;
  sheetOpen = false;
  const src = sheetSrc; sheetSrc = null;
  if (bodyA) bodyA.cancel();
  const done = () => { if (!sheetOpen) { sheet.style.visibility = 'hidden'; scrim.style.visibility = 'hidden'; sheet.style.transform = 'none'; } if (src) src.style.opacity = ''; };
  const y = sheetY();
  if (src && src.isConnected && !slide && y < 4 && !REDUCED) {
    // morph back into the element it came from
    const cur = getComputedStyle(sheet).clipPath;
    if (clipA) clipA.cancel();
    clipA = anim(sheet, [{ clipPath: cur === 'none' ? 'inset(0px round 32px 32px 0px 0px)' : cur }, { clipPath: insetOf(sheet, src.getBoundingClientRect(), radiusOf(src)) }], SP.snap, { fill: 'forwards' });
    anim($('sheetBody'), [{ opacity: 1 }, { opacity: 0 }], { easing: EASE_OUT, duration: 140 }, { fill: 'forwards' }).onfinish = function () { this.cancel(); };
    clipA.onfinish = () => { done(); if (clipA) clipA.cancel(); };
    setTimeout(() => { if (src) src.style.opacity = ''; }, SP.snap.duration * .7);
  } else {
    if (sheetA) sheetA.cancel();
    const to = sheet.offsetHeight + 20;
    sheet.style.transform = `translateY(${to}px)`;
    sheetA = anim(sheet, [{ transform: `translateY(${y}px)` }, { transform: `translateY(${to}px)` }], SP.glide);
    sheetA.onfinish = done;
  }
  anim(scrim, [{ opacity: +getComputedStyle(scrim).opacity }, { opacity: 0 }], { easing: EASE_OUT, duration: 240 }, { fill: 'forwards' });
}
scrim.addEventListener('click', () => closeSheet());
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
(function drag() {
  let y0 = 0, base = 0, last = 0, lastT = 0, v = 0, on = false;
  sheet.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, input, .hold')) return;
    on = true; y0 = e.clientY; base = sheetY(); last = e.clientY; lastT = performance.now(); v = 0;
    if (sheetA) sheetA.cancel(); sheet.style.transform = `translateY(${base}px)`; sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove', (e) => {
    if (!on) return;
    let dy = base + e.clientY - y0; if (dy < 0) dy = dy / 4;
    const now = performance.now(); v = (e.clientY - last) / Math.max(1, now - lastT); last = e.clientY; lastT = now;
    sheet.style.transform = `translateY(${dy}px)`;
  });
  const up = () => {
    if (!on) return; on = false;
    const y = sheetY();
    if (y > sheet.offsetHeight * .3 || v > .6) closeSheet(true);
    else { sheetA = anim(sheet, [{ transform: `translateY(${y}px)` }, { transform: 'none' }], SP.glide); sheet.style.transform = 'none'; }
  };
  sheet.addEventListener('pointerup', up); sheet.addEventListener('pointercancel', up);
})();

/* ---------- toast with Undo ---------- */
let toastT = 0, toastUndo = null;
function toast(msg, undo) {
  const el = $('toast'); $('toastT').textContent = msg; toastUndo = undo;
  const u = $('toastU'); u.textContent = t('undo'); u.style.display = undo ? '' : 'none'; u.disabled = true; setTimeout(() => { u.disabled = false; }, 400);
  el.classList.add('on');
  anim(el, [{ opacity: 0, transform: 'translate(-50%,20px)' }, { opacity: 1, transform: 'translate(-50%,0)' }], SP.glide, { fill: 'forwards' });
  clearTimeout(toastT); toastT = setTimeout(hideToast, 4200);
}
function hideToast() {
  const el = $('toast'); el.classList.remove('on');
  anim(el, [{ opacity: 1, transform: 'translate(-50%,0)' }, { opacity: 0, transform: 'translate(-50%,20px)' }], SP.glide, { fill: 'forwards' });
}
$('toastU').onclick = () => { if (toastUndo) toastUndo(); toastUndo = null; hideToast(); };

/* ---------- Today's sheets ---------- */
function addProtein(name, g) {
  const before = S.prot; S.prot += g; R.prot.set(String(S.prot), 1);
  toast(t('added', name), () => { S.prot = before; R.prot.set(String(S.prot), -1); });
}
$('rowProt').onclick = (ev) => openSheet('', (b) => {
  b.innerHTML = '<div class="sh-h"></div><div class="sh-p"></div><div class="chips"></div>';
  write(b.querySelector('.sh-h'), t('pH')); b.querySelector('.sh-p').textContent = t('pP');
  const box = b.querySelector('.chips');
  t('foods').forEach(([n, g], i) => {
    const c = document.createElement('button'); c.innerHTML = `${n}<b>+${g} g</b>`;
    c.onclick = () => { closeSheet(); setTimeout(() => addProtein(n, g), 160); };
    box.append(c); anim(c, [{ transform: 'translateY(12px)', opacity: 0 }, { transform: 'none', opacity: 1 }], SP.glide, { delay: 80 + i * 40, fill: 'backwards' });
  });
}, $('rowProt'));
$('rowWeight').onclick = (ev) => openSheet('', (b) => {
  let v = S.weight;
  b.innerHTML = `<div class="sh-h"></div><div class="sh-p"></div><div class="sh-big"><button class="round" id="wDn">−</button><div class="n num"><span id="wBig"></span><small>kg</small></div><button class="round" id="wUp">+</button></div><button class="btn-ink sh-go" id="wSave"></button>`;
  write(b.querySelector('.sh-h'), t('wH')); b.querySelector('.sh-p').textContent = t('wP');
  b.querySelector('#wSave').textContent = t('save');
  const r = new Roll(b.querySelector('#wBig')); r.set(fmt(v), 1, true);
  const step = (d) => { v = Math.round((v + d) * 10) / 10; r.set(fmt(v), d > 0 ? 1 : -1); buzz(3); };
  b.querySelector('#wUp').onclick = () => step(.1); b.querySelector('#wDn').onclick = () => step(-.1);
  b.querySelector('#wSave').onclick = async () => {
    const prev = S.weight, prevW = S.weightWeek; S.weightWeek = Math.round((S.weightWeek + v - S.weight) * 10) / 10; S.weight = v;
    R.weight.set(fmt(v), 1, true);
    await fly($('fly1'), b.querySelector('#wBig'), fmt(v), $('weightN'));
    closeSheet(); $('wSub').textContent = t('wSub', S.weightWeek);
    toast(t('wSaved'), () => { S.weight = prev; S.weightWeek = prevW; R.weight.set(fmt(prev), -1); $('wSub').textContent = t('wSub', prevW); });
  };
}, $('rowWeight'));
$('rowSleep').onclick = (ev) => openSheet('', (b) => {
  b.innerHTML = `<div class="sh-h"></div><div class="sh-p"></div><div class="sh-big"><div class="n num"><span id="sBig"></span><small>${t('h')}</small></div></div><div class="bars"></div><button class="btn-ink sh-go" id="sClose"></button>`;
  write(b.querySelector('.sh-h'), t('sH')); b.querySelector('.sh-p').textContent = t('sP');
  const r = new Roll(b.querySelector('#sBig')); r.set(sleepFmt().replace(/\d/g, '0'), 1, true); setTimeout(() => lockIn(r, sleepFmt()), 120);
  const bars = b.querySelector('.bars');
  [[t('deep'), 110, L === 'da' ? '1.50' : '1:50'], [t('rem'), 96, L === 'da' ? '1.36' : '1:36'], [t('light'), 256, L === 'da' ? '4.16' : '4:16']].forEach(([n, m, s], i) => {
    const row = document.createElement('div'); row.className = 'bar'; row.innerHTML = `<span>${n}</span><i style="width:${(m / 256) * 100}%"></i><span>${s}</span>`;
    bars.append(row);
    anim(row.querySelector('i'), [{ transform: 'scaleX(0)' }, { transform: 'none' }], SP.soft, { delay: 160 + i * 80, fill: 'backwards' });
  });
  b.querySelector('#sClose').textContent = t('close'); b.querySelector('#sClose').onclick = closeSheet;
}, $('rowSleep'));
$('askBtn').onclick = (ev) => openSheet('', (b) => {
  b.innerHTML = `<div class="sh-h"></div><div class="sh-p"></div><div class="chips"><button id="q1"></button><button id="q2"></button></div><div class="reply" id="reply"></div><div class="reply-act" id="replyAct"></div><form class="askrow" id="askF"><input id="askIn" autocomplete="off" enterkeyhint="send"><button aria-label="Send">↑</button></form>`;
  write(b.querySelector('.sh-h'), t('aH')); b.querySelector('.sh-p').textContent = t('aP');
  b.querySelector('#q1').textContent = t('q1'); b.querySelector('#q2').textContent = t('q2'); b.querySelector('#askIn').placeholder = t('askPh');
  const answer = (txt, act) => {
    const ra = b.querySelector('#replyAct'); ra.textContent = '';
    write(b.querySelector('#reply'), txt, { stagger: 30 }).then(() => {
      if (!act) return;
      const btn = document.createElement('button'); btn.textContent = act[0]; btn.onclick = () => { closeSheet(); setTimeout(act[1], 160); };
      ra.append(btn); anim(btn, [{ transform: 'translateY(10px)', opacity: 0 }, { transform: 'none', opacity: 1 }], SP.glide);
    });
  };
  b.querySelector('#q1').onclick = () => answer(t('a1'));
  b.querySelector('#q2').onclick = () => answer(t('a2'), [t('logSkyr'), () => addProtein(t('foods')[0][0], 22)]);
  b.querySelector('#askF').onsubmit = (e) => { e.preventDefault(); const q = b.querySelector('#askIn').value.trim(); if (!q) return; b.querySelector('#askIn').value = ''; b.querySelector('#askIn').blur(); answer(t('aEcho', q)); };
}, $('askBtn'));

/* ---------- clock (one interval; only changed digits redraw) ---------- */
function tickClock() {
  if (!S.started || S.finished) return;
  const s = Math.floor((Date.now() - S.started) / 1000), str = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  if (S.screen === 'work' || $('work').style.visibility === 'visible') R.clock.set(str, 1);
  if ($('live').classList.contains('on')) R.liveT.set(str, 1);
}
setInterval(tickClock, 500);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.resting) restTick(); });

/* ---------- wiring ---------- */
$('startBtn').onclick = () => {
  if (S.finished) { resetWorkout(); S.finished = false; R.hero.set(t('hero'), 1); fitHero(); setStartLabel(false); write($('tPlan'), t('plan')); write($('tBeat'), t('beat')); write($('coachToday'), t('coachToday'), { stagger: 20 }); return; }
  toWork();
};
$('live').onclick = toWork;
$('backBtn').onclick = toToday;
$('finishBtn').onclick = () => openFinish($('finishBtn'));
$('logBtn').onclick = logSet;
$('doneGo').onclick = leaveDone;
$('kgUp').onclick = () => nudge('kg', ex().step); $('kgDn').onclick = () => nudge('kg', -ex().step);
$('repUp').onclick = () => nudge('reps', 1); $('repDn').onclick = () => nudge('reps', -1);
$('rPlus').onclick = () => shiftRest(15); $('rMinus').onclick = () => shiftRest(-15);
$('sets').addEventListener('click', (e) => { const st = e.target.closest('.st.undo'); if (st) undoLast([...$('sets').children].indexOf(st.parentElement)); });
// drag the big weight up or down: one step per 26 px, digits roll with the finger
(function () {
  const el = $('wKg'); let y0 = 0, acc = 0, on = false;
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', (e) => { on = true; y0 = e.clientY; acc = 0; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => { if (!on) return; const d = (y0 - e.clientY) / 26; const k = Math.trunc(d) - acc; if (k) { acc += k; nudge('kg', k * ex().step); } });
  const up = () => { on = false; }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
})();
$('langBtn').onclick = async () => {
  L = L === 'en' ? 'da' : 'en';
  fillStatic();
  R.hero.set(heroText(), 1); fitHero();
  morph($('startLbl'), S.finished ? t('again') : t('start'));
  write($('tDate'), t('date'), { stagger: 20 }); write($('tGreet'), t('greet'), { stagger: 20 });
  write($('tPlan'), S.finished ? t('planDone') : t('plan'), { stagger: 18 });
  write($('tBeat'), S.finished ? t('beatDone', doneKg().toLocaleString(L === 'da' ? 'da-DK' : 'en-GB'), S.bests) : t('beat'), { stagger: 18 });
  R.sleep.set(sleepFmt(), 1); R.weight.set(fmt(S.weight), 1);
  write($('coachToday'), S.finished ? t('coachDone') : t('coachToday'), { stagger: 20 });
  updateLive();
};
addEventListener('resize', fitHero);

(async function boot() {
  await (document.fonts ? document.fonts.ready : Promise.resolve());
  if (Q.get('screen') === 'workout') { await openToday(false); $('today').style.visibility = 'hidden'; S.started = Date.now(); S.screen = 'work';
    $('work').style.visibility = 'visible'; $('work').style.opacity = 1; renderWork(true); document.querySelector('meta[name=theme-color]').content = '#3d35dc'; return; }
  openToday(true);
})();
</script>
