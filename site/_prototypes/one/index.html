<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aven One</title>
<meta name="theme-color" content="#22252c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<style>
/* Aven One: the best of the 15 Nov round in one app (plan: docs/one-app-2026-11-15.md).
   Today = the living Aarhus sky (Summit A). The workout = its own dusk world where your sets build a ridge over
   last week's (Ridge), with the race against Tuesday, the bar with its plates, mist that drains as rest, and the
   sky coming back only for a record and the finish. Everything that moves on its own is transform or opacity. */
:root {
  --hk: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --disp: "Bricolage Grotesque", var(--hk);
  --s: 1; --H: 832px;
  /* the workout's dusk */
  --w-ink: #fff; --w-ink2: rgba(255,255,255,.88); --w-ink3: rgba(236,232,255,.66); --w-hair: rgba(236,232,255,.18);
  --w-key: rgba(236,232,255,.13); --w-keyedge: rgba(236,232,255,.26); --w-chalk: #f6f3ff; --w-chalk-ink: #1d1f3d; --gold: #ffd58a;
}
html, body { margin: 0; height: 100%; background: #1d1e21; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--hk); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; }
button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
p, h1, h2 { margin: 0; }

/* the phone: 384 css px wide, as tall as the viewport allows; scaled to fit */
.app { position: absolute; left: 0; top: 0; width: 384px; height: var(--H); transform-origin: 0 0; overflow: clip;
  isolation: isolate; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; -webkit-user-select: none; user-select: none;
  --ink: #fff; --ink2: rgba(255,255,255,.9); --ink3: rgba(255,255,255,.74); --hair: rgba(255,255,255,.2);
  --tint: 38, 34, 32; --ga: .3; --btn: #fff; --btn-ink: #2a2420; --acc: #ffd7a8; --scrim: 20, 16, 14; --sa: .32;
  --ts: 0 1px 12px rgba(var(--scrim), .45); --spring: cubic-bezier(.2,.9,.25,1); --soft: cubic-bezier(.3,.7,.2,1); }
.app.desk { border-radius: 44px; box-shadow: 0 40px 90px -30px rgba(0,0,0,.6); }
.app .td, .app .td * { transition-property: color, background-color, box-shadow, border-color; transition-duration: .9s; transition-timing-function: ease; }

/* scene palettes: ink, glass tint, button, accent, scrim */
.app[data-scene=fog]    { --tint: 46,40,38;  --ga: .26; --btn-ink: #2c2420; --acc: #f3c79c; --scrim: 30,22,18; }
.app[data-scene=sun]    { --tint: 54,32,18;  --ga: .26; --btn-ink: #3b1f0b; --acc: #ffbe6e; --scrim: 30,18,10; }
.app[data-scene=dusk]   { --tint: 30,28,52;  --ga: .3;  --btn-ink: #24203f; --acc: #ffb489; --scrim: 20,16,36; }
.app[data-scene=night]  { --tint: 8,30,66;   --ga: .32; --btn-ink: #0b2348; --acc: #9fd0ff; --scrim: 2,16,40; }
.app[data-scene=rain]   { --tint: 10,22,40;  --ga: .32; --btn-ink: #10233d; --acc: #ffb07a; --scrim: 4,10,22; }
.app[data-scene=summer] { --tint: 22,40,62;  --ga: .26; --btn-ink: #13304f; --acc: #ff9ec3; --scrim: 10,24,44; }
.app[data-scene=dawn]   { --ink: #1f2440; --ink2: rgba(31,36,64,.92); --ink3: rgba(31,36,64,.8); --hair: rgba(31,36,64,.16);
  --tint: 255,248,244; --ga: .5; --btn: #1f2440; --btn-ink: #fff; --acc: #e06a7a; --scrim: 255,246,240; --sa: .4; --ts: none; }
.app[data-scene=snow]   { --ink: #1b2342; --ink2: rgba(27,35,66,.92); --ink3: rgba(27,35,66,.8); --hair: rgba(27,35,66,.16);
  --tint: 250,250,255; --ga: .5; --btn: #1b2342; --btn-ink: #fff; --acc: #5872d6; --scrim: 240,242,252; --sa: .45; --ts: none; }
.light { --is-light: 1; }

/* wallpaper */
.zoom { position: absolute; inset: -2%; transform: scale(1); }
.par { position: absolute; inset: 0; }
.wall { position: absolute; inset: 0; animation: drift 46s ease-in-out infinite alternate; }
.wall img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; visibility: hidden;
  transition: opacity 1.4s ease, visibility 0s 1.4s; }
.wall img.on { opacity: 1; visibility: visible; transition: opacity 1.4s ease, visibility 0s; }
@keyframes drift { from { transform: scale(1.03) translate3d(-5px, -3px, 0); } to { transform: scale(1.06) translate3d(5px, 4px, 0); } }
.paused .wall, .paused .wx i, .paused .dot::after, .paused .w-mist i, .paused .w-breath span { animation-play-state: paused !important; }
.tint { position: absolute; inset: 0; opacity: 0; background: rgb(var(--tc, 4,12,34)); transition: opacity 1.4s ease, background-color 1.4s ease; }
.wx { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.6s ease; }
.wx.on { opacity: 1; }
.wx.fog i { position: absolute; left: 0; top: 30%; width: 200%; height: 46%; background: url(img/fog-veil.png) 0 0 / 50% 100% repeat-x;
  animation: fogmove 90s linear infinite; opacity: .55; }
.wx.fog i + i { top: 52%; animation-duration: 140s; animation-direction: reverse; opacity: .4; }
@keyframes fogmove { to { transform: translate3d(-50%, 0, 0); } }
.wx.snow i { position: absolute; left: 0; top: -100%; width: 100%; height: 200%; background: url(img/snow.png) 0 0 / 400px 800px repeat;
  animation: fall 26s linear infinite; }
.wx.snow i + i { background-size: 280px 560px; animation-duration: 38s; opacity: .7; }
@keyframes fall { to { transform: translate3d(-30px, 50%, 0); } }
.scrim { position: absolute; left: 0; right: 0; pointer-events: none; }
.scrim.top { top: 0; height: 240px; background: linear-gradient(rgba(var(--scrim), var(--sa)), rgba(var(--scrim), 0)); }
.scrim.bot { bottom: 0; height: 330px; background: linear-gradient(rgba(var(--scrim), 0), rgba(var(--scrim), calc(var(--sa) + .08))); }

/* glass, recipe A: plain live blur, tint from the picture, a top edge highlight */
.frost { -webkit-backdrop-filter: blur(40px) saturate(1.45); backdrop-filter: blur(40px) saturate(1.45);
  background: linear-gradient(rgba(255,255,255,.07), rgba(255,255,255,.04)), rgba(var(--tint), var(--ga));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 0 0 1px rgba(255,255,255,.08), 0 24px 44px -26px rgba(0,0,0,.55); }
.app[data-scene=dawn] .frost, .app[data-scene=snow] .frost { box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(31,36,64,.12), 0 20px 40px -26px rgba(31,36,64,.4); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
.sbar { position: absolute; top: 12px; left: 26px; right: 24px; height: 20px; display: flex; justify-content: space-between; align-items: center;
  font-size: 14px; font-weight: 600; z-index: 40; text-shadow: var(--ts); pointer-events: none; transition: color .4s; }
.sbar svg { height: 11px; width: auto; display: block; }
.app.in-work .sbar { color: #fff; text-shadow: none; }

/* views */
.view { position: absolute; inset: 0; }
.view[hidden] { display: block; visibility: hidden; pointer-events: none; }

/* ---------- Today ---------- */
.top { position: absolute; top: 46px; left: 20px; right: 16px; height: 44px; display: flex; align-items: center; gap: 8px; }
.date { flex: 1; font-size: 15px; font-weight: 600; color: var(--ink2); text-shadow: var(--ts); padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 13px; font-size: 15px; font-weight: 600; white-space: nowrap; }
.chip b { font-weight: 700; }
.chip .ico { width: 20px; height: 20px; }
.me { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; letter-spacing: .02em; }
.dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); flex: none; display: inline-block; }
.dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: var(--acc); opacity: .35; animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.55); opacity: .45; } 50% { transform: scale(1); opacity: .12; } }

.hero { position: absolute; z-index: 1; left: 22px; right: 22px; top: max(112px, calc((var(--H) - 540px) * .42 + 52px)); text-align: center; text-shadow: var(--ts); }
.hero::before { content: ""; position: absolute; z-index: -1; inset: -40px -50px -20px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(var(--scrim), var(--hs, .3)), rgba(var(--scrim), 0)); }
.app[data-scene=dawn], .app[data-scene=snow] { --hs: .55; }
.app[data-scene=sun], .app[data-scene=rain] { --hs: .5; }
.hero { transition: transform .6s var(--spring); }
.app.coach-on .hero { transform: translate3d(0, 34px, 0); }
.hero .lab { font-size: 15px; font-weight: 600; color: var(--ink2); letter-spacing: .005em; }
.hero .num { font-family: var(--disp); font-size: 124px; line-height: 1; font-weight: 500; letter-spacing: -0.05em; margin-top: 6px; height: 126px;
  display: flex; justify-content: center; align-items: baseline; }
.hero .num.long { font-size: 96px; height: 110px; margin-top: 14px; }
.hero .num u { white-space: nowrap; }
.hero .num u { text-decoration: none; font-family: var(--hk); font-size: 24px; font-weight: 600; letter-spacing: 0; color: var(--ink2); margin-left: 6px; }
.hero h1 { font-family: var(--disp); font-size: 29px; line-height: 34px; font-weight: 600; letter-spacing: -0.025em; margin-top: 10px; text-wrap: balance; }
.hero p { font-size: 16.5px; line-height: 24px; font-weight: 500; color: var(--ink2); margin: 8px auto 0; max-width: 316px; text-wrap: balance; }
.start { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; height: 58px; padding: 0 26px 0 28px; border-radius: 29px; background: var(--btn); color: var(--btn-ink);
  font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-shadow: none; box-shadow: 0 16px 30px -16px rgba(0,0,0,.55);
  transition: transform .18s var(--spring), background-color .9s, color .9s; }
.start small { font-size: 14px; font-weight: 600; opacity: .62; }
.start:active, .tile:active, .pill:active, .coachb:active, .tab:active { transform: scale(.955); transition-duration: .08s; }
.hero .ridgemini { display: block; width: 260px; height: 46px; margin: 14px auto 0; overflow: visible; }

.day { position: absolute; left: 12px; right: 12px; bottom: 96px; height: 116px; border-radius: 34px; display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px; gap: 4px; }
.tile { border-radius: 26px; padding: 14px 0 0 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; position: relative;
  transition: transform .2s var(--spring), background-color .2s; }
.tile > span { font-size: 13.5px; font-weight: 600; color: var(--ink3); }
.tile b { font-family: var(--disp); font-size: 25px; line-height: 30px; font-weight: 600; letter-spacing: -0.03em; display: flex; align-items: baseline; }
.tile b u { text-decoration: none; font-family: var(--hk); font-size: 13.5px; font-weight: 600; letter-spacing: 0; margin-left: 3px; color: var(--ink2); }
.tile svg { position: absolute; left: 14px; right: 14px; bottom: 14px; width: calc(100% - 28px); height: 18px; overflow: visible; }
.tile + .tile::before { content: ""; position: absolute; left: -2px; top: 18px; bottom: 18px; width: 1px; background: var(--hair); }

.dock { position: absolute; left: 16px; right: 90px; bottom: 20px; height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(4, 1fr);
  align-items: center; padding: 0 6px; z-index: 5; }
.tab { height: 50px; border-radius: 25px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink2); transition: transform .18s var(--spring); }
.tab.on { background: rgba(255,255,255,.2); color: var(--ink); }
.app[data-scene=dawn] .tab.on, .app[data-scene=snow] .tab.on { background: rgba(31,36,64,.1); }
.coachb { position: absolute; right: 16px; bottom: 20px; width: 64px; height: 64px; border-radius: 50%; z-index: 5; display: grid; place-items: center; transition: transform .18s var(--spring); }
.coachb .dot { width: 12px; height: 12px; }
.coachb .dot::after { inset: -8px; }

/* digit roller: numbers roll, they are never swapped */
.roll { display: inline-flex; align-items: flex-start; }
.roll > span { display: inline-grid; padding: .14em 0; margin: -.14em 0; -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); }
.roll > span > i { grid-area: 1 / 1; font-style: normal; }

/* ---------- pop-ups (all grow out of what caused them) ---------- */
.coach { position: absolute; top: 40px; left: 10px; right: 10px; min-height: 70px; border-radius: 30px; z-index: 30; padding: 14px 18px 14px 16px;
  display: flex; gap: 12px; align-items: flex-start; transform: translate3d(0, calc(-100% - 60px), 0); touch-action: none; cursor: grab; }
.coach .dot { margin-top: 7px; }
.coach .tx { flex: 1; }
.coach .who { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; justify-content: space-between; }
.coach p { font-size: 16px; line-height: 22px; font-weight: 600; margin-top: 2px; text-wrap: pretty; }
.coach .acts { display: flex; gap: 8px; margin-top: 10px; }
.coach .pill { height: 36px; }
.pill { height: 40px; padding: 0 16px; border-radius: 20px; font-size: 15px; font-weight: 700; background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
  transition: transform .18s var(--spring); white-space: nowrap; }
.app[data-scene=dawn] .pill, .app[data-scene=snow] .pill { background: rgba(31,36,64,.07); box-shadow: inset 0 0 0 1px rgba(31,36,64,.2); }
.pill.main { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
.float { position: absolute; z-index: 35; pointer-events: none; height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 700; white-space: nowrap; opacity: 0; }
.veil { position: absolute; inset: 0; z-index: 24; background: rgba(var(--scrim), .3); opacity: 0; pointer-events: none; transition: opacity .35s ease; }
.veil.on { opacity: 1; pointer-events: auto; }
.veil.strong { background: rgba(var(--scrim), .55); }
.card { position: absolute; left: 12px; right: 12px; z-index: 26; border-radius: 34px; padding: 22px 22px 20px; opacity: 0; pointer-events: none; transform-origin: 50% 50%; }
.card.on { pointer-events: auto; }
.card h2 { font-family: var(--disp); font-size: 25px; line-height: 30px; font-weight: 600; letter-spacing: -0.025em; padding-right: 44px; }
.card .sub { font-size: 14.5px; line-height: 21px; font-weight: 500; color: var(--ink2); margin-top: 6px; text-wrap: pretty; }
.card .x { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); }
.app[data-scene=dawn] .card .x, .app[data-scene=snow] .card .x { background: rgba(31,36,64,.07); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; margin-top: 18px; }
.bars i { display: block; border-radius: 8px; background: rgba(255,255,255,.3); transform-origin: 50% 100%; position: relative; }
.app[data-scene=dawn] .bars i, .app[data-scene=snow] .bars i { background: rgba(31,36,64,.18); }
.bars i.hi { background: var(--ink); }
.bars i::after { content: attr(data-d); position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink3); }
.meals { margin-top: 14px; display: grid; gap: 2px; }
.meal { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; box-shadow: inset 0 -1px 0 var(--hair); font-size: 15.5px; font-weight: 600; }
.meal span { color: var(--ink3); font-weight: 600; font-size: 14px; }
.card .pill { height: 46px; padding: 0 20px; border-radius: 23px; }
.card .acts { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.ring { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); flex: none; }
.ring b { font-family: var(--disp); font-size: 34px; font-weight: 600; letter-spacing: -0.04em; display: block; line-height: 1; }
.ring span { font-size: 14px; font-weight: 600; color: var(--ink3); }
.toast { position: absolute; left: 50%; bottom: 100px; z-index: 45; height: 50px; padding: 0 8px 0 18px; border-radius: 25px; display: flex; align-items: center; gap: 14px;
  font-size: 15px; font-weight: 600; white-space: nowrap; transform: translate3d(-50%, 0, 0); opacity: 0; pointer-events: none; }
.toast.on { pointer-events: auto; }
.toast button { height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,.2); font-weight: 700; font-size: 14.5px; }

/* sky sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 28; border-radius: 36px 36px 0 0; padding: 10px 22px 30px; transform: translate3d(0, 105%, 0); touch-action: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; margin: 0 auto 14px; background: rgba(255,255,255,.4); }
.app[data-scene=dawn] .grab, .app[data-scene=snow] .grab { background: rgba(31,36,64,.25); }
.sheet h2 { font-family: var(--disp); font-size: 25px; line-height: 30px; font-weight: 600; letter-spacing: -.025em; }
.sheet .sub { font-size: 14.5px; line-height: 21px; font-weight: 500; color: var(--ink2); margin-top: 6px; }
.sheet .now { display: flex; gap: 12px; align-items: center; margin-top: 14px; font-size: 15px; font-weight: 600; color: var(--ink2); }
.sheet .now b { color: var(--ink); font-weight: 700; }
.arc { display: block; width: 100%; height: 132px; margin-top: 10px; touch-action: none; cursor: ew-resize; overflow: visible; }
.arc .curve { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.arc .under { fill: none; stroke: var(--ink); stroke-opacity: .32; stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; }
.arc .hz { stroke: var(--ink); stroke-opacity: .3; stroke-width: 1; }
.arc text { fill: var(--ink3); font-size: 12px; font-weight: 600; font-family: var(--hk); }
.arc .sun { fill: var(--acc); stroke: var(--ink); stroke-width: 2.5; }
.arc .halo { fill: var(--acc); opacity: .25; }
.wxrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.wxrow button { height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14.5px; font-weight: 700; white-space: nowrap; background: rgba(255,255,255,.12);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.26); display: flex; align-items: center; gap: 6px; }
.wxrow button .ico { width: 17px; height: 17px; }
.app[data-scene=dawn] .wxrow button, .app[data-scene=snow] .wxrow button { background: rgba(31,36,64,.06); box-shadow: inset 0 0 0 1px rgba(31,36,64,.18); }
.wxrow button.sel { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
.sheet .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 13px; font-weight: 500; color: var(--ink3); gap: 12px; }
.credit { font-size: 11.5px; line-height: 16px; color: var(--ink3); margin-top: 14px; }

/* Coach sheet */
.csheet { position: absolute; left: 10px; right: 10px; bottom: 10px; top: 92px; z-index: 27; border-radius: 36px; display: flex; flex-direction: column; opacity: 0; pointer-events: none; overflow: hidden; }
.csheet.on { pointer-events: auto; }
.csheet .hd { display: flex; align-items: center; gap: 10px; padding: 20px 20px 6px 22px; font-size: 15px; font-weight: 700; }
.csheet .hd .x { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); }
.app[data-scene=dawn] .csheet .hd .x, .app[data-scene=snow] .csheet .hd .x { background: rgba(31,36,64,.07); }
.thread { flex: 1; overflow-y: auto; padding: 8px 20px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
.msg { max-width: 88%; font-size: 16px; line-height: 23px; font-weight: 500; }
.msg.me { align-self: flex-end; background: rgba(255,255,255,.18); padding: 10px 16px; border-radius: 22px 22px 6px 22px; }
.app[data-scene=dawn] .msg.me, .app[data-scene=snow] .msg.me { background: rgba(31,36,64,.08); }
.msg.ai { align-self: flex-start; }
.msg.ai .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.sugg { display: flex; gap: 8px; overflow-x: auto; padding: 6px 20px 10px; scrollbar-width: none; }
.sugg button { flex: none; }
.cin { display: flex; gap: 8px; padding: 4px 14px 14px; }
.cin input { flex: 1; min-width: 0; height: 52px; border-radius: 26px; border: 0; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.24); color: inherit;
  padding: 0 18px; font: inherit; font-size: 16px; outline: 0; }
.app[data-scene=dawn] .cin input, .app[data-scene=snow] .cin input { background: rgba(31,36,64,.06); box-shadow: inset 0 0 0 1px rgba(31,36,64,.2); }
.cin input::placeholder { color: var(--ink3); }
.cin button { width: 52px; height: 52px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; flex: none; }

/* ---------- Workout: its own dusk world; your sets build a ridge ---------- */
.wk { position: absolute; inset: 0; z-index: 8; color: var(--w-ink); }
.wk[hidden] { display: block; visibility: hidden; pointer-events: none; }
.w-sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.w-seg { position: absolute; top: 44px; left: 20px; right: 20px; display: grid; gap: 5px; }
.w-seg i { height: 3px; border-radius: 2px; background: var(--w-hair); overflow: hidden; position: relative; }
.w-seg i::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: 0 50%; transform: scaleX(var(--p, 0)); transition: transform .7s var(--soft); }
.w-name { position: absolute; top: 60px; left: 22px; right: 84px; }
.w-name b { display: block; font-family: var(--disp); font-size: 31px; line-height: 36px; font-weight: 600; letter-spacing: -0.035em; white-space: nowrap; }
.w-name span { display: block; margin-top: 2px; font-size: 15px; font-weight: 600; color: var(--w-ink3); }
.w-min { position: absolute; top: 62px; right: 18px; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--w-key); box-shadow: inset 0 0 0 1px var(--w-keyedge); }
.w-race { position: absolute; top: 124px; left: 22px; right: 22px; height: 30px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; font-size: 13.5px; font-weight: 700; }
.w-race > span { color: var(--w-ink3); white-space: nowrap; }
.w-race > b { white-space: nowrap; font-weight: 700; min-width: 86px; text-align: right; }
.w-race > b.ahead { color: #b9f3d6; }
.w-race > b.behind { color: #ffc4b0; }
.w-lane { position: relative; height: 22px; margin: 0 9px; }
.w-lane .rail { position: absolute; left: 0; right: 0; top: 10px; height: 2px; border-radius: 1px; background: var(--w-hair); }
.w-lane .fill { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: #fff; transform-origin: 0 50%; transform: scaleX(0); transition: transform .8s var(--soft); }
.w-lane .you, .w-lane .gh { position: absolute; top: 2px; left: 0; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; }
.w-lane .you { background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.16); transition: transform .8s var(--soft); }
.w-lane .gh { border: 2px dashed rgba(236,232,255,.75); }
.w-face { position: absolute; left: 0; right: 0; top: 168px; height: 196px; transition: opacity .28s ease, transform .5s var(--spring); }
.w-face.off { opacity: 0; transform: scale(.97); pointer-events: none; transition: opacity .16s ease, transform .4s ease; }
.w-big { display: flex; justify-content: center; align-items: baseline; gap: 0; height: 100px; font-family: var(--disp); font-weight: 500; white-space: nowrap; line-height: 1; }
.w-big .n { font-size: 98px; letter-spacing: -0.055em; }
.w-big u { text-decoration: none; font-family: var(--hk); font-size: 20px; font-weight: 700; color: var(--w-ink3); margin: 0 10px 0 6px; letter-spacing: 0; }
.w-big .x { font-family: var(--hk); font-size: 34px; font-weight: 400; color: var(--w-ink3); margin: 0 10px 0 0; }
.w-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 18px 0; }
.w-ctl div { display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; text-align: center; font-size: 13.5px; font-weight: 700; color: var(--w-ink3); }
.pm { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--w-key); box-shadow: inset 0 0 0 1px var(--w-keyedge);
  transition: transform .18s var(--spring), background-color .2s, opacity .2s; color: #fff; }
.pm .ico { width: 20px; height: 20px; stroke-width: 2.3; }
.pm:active, .w-min:active, .w-mic:active, .w-log:active, .w-plus:active { transform: scale(.94); transition-duration: .08s; }
.w-tue { margin-top: 12px; text-align: center; font-size: 14.5px; font-weight: 600; color: var(--w-ink3); display: flex; justify-content: center; align-items: center; gap: 8px; }
.w-tue i { width: 18px; height: 0; border-top: 2px dashed rgba(236,232,255,.7); }
/* rest face sits in the same place as the numbers: the weight becomes the countdown */
.w-rest .lab { text-align: center; font-size: 14.5px; font-weight: 700; color: var(--w-ink2); height: 20px; display: flex; justify-content: center; gap: 10px; align-items: center; }
.w-rest .lab button { height: 30px; padding: 0 12px; border-radius: 15px; background: var(--w-key); box-shadow: inset 0 0 0 1px var(--w-keyedge); font-size: 13px; font-weight: 700; }
.w-rest .clk { display: flex; justify-content: center; font-family: var(--disp); font-weight: 500; font-size: 112px; letter-spacing: -0.055em; line-height: 1; margin-top: 6px; height: 114px; }
.w-breath { position: relative; height: 22px; margin-top: 8px; text-align: center; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.86); text-shadow: 0 1px 8px rgba(20,16,48,.45); }
.w-breath span { position: absolute; left: 0; right: 0; opacity: 0; animation: bin 10s linear infinite; }
.w-breath span + span { animation-name: bout; }
@keyframes bin { 0% { opacity: 0; } 4%, 36% { opacity: 1; } 42%, 100% { opacity: 0; } }
@keyframes bout { 0%, 38% { opacity: 0; } 46%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
/* the bar: exactly what to load */
.w-bar { position: absolute; left: 22px; right: 22px; top: 384px; height: 64px; }
.w-bar .rod { position: absolute; left: 0; right: 0; top: 23px; height: 6px; border-radius: 3px; background: linear-gradient(#e9e8f4, #8a8aa6); }
.w-bar .collar { position: absolute; top: 15px; width: 6px; height: 22px; border-radius: 2px; background: #d8d7e6; }
.w-bar .side { position: absolute; top: 0; height: 52px; display: flex; align-items: center; gap: 2px; }
.w-bar .side.l { right: calc(50% + 72px); flex-direction: row-reverse; }
.w-bar .side.r { left: calc(50% + 72px); }
.w-bar .lab { position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,.78); white-space: nowrap; text-shadow: 0 1px 8px rgba(20,16,48,.45); }
.plate { flex: none; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(0,0,0,.18); }
/* the ridge */
.w-ridge { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; pointer-events: none; }
.w-ridge svg { position: absolute; bottom: 0; overflow: visible; transform-origin: 50% 100%; }
.w-ridge .far { left: 0; width: 384px; height: 150px; }
.w-ridge .pk.tgt { transition: transform .55s var(--spring), opacity .3s; }
.w-ridge .pk.mine path { pointer-events: visiblePainted; cursor: pointer; }
#peaks { position: absolute; inset: 0; }
.w-ridge #peaks, .w-ridge .far { will-change: transform; }
.w-flag { position: absolute; width: 30px; height: 40px; transform-origin: 2px 100%; }
.w-mist { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; transform: translate3d(0, 100%, 0); }
.w-mist i { position: absolute; inset: 0; display: block; transform-origin: 50% 100%; animation: mistb 10s cubic-bezier(.45,0,.55,1) infinite; }
.w-mist canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
@keyframes mistb { 0%, 100% { transform: scaleY(.9); } 40% { transform: scaleY(1); } }
/* bottom: mic + the one big button */
.w-foot { position: absolute; left: 16px; right: 16px; bottom: 20px; height: 76px; display: flex; gap: 10px; }
.w-mic, .w-plus { width: 76px; height: 76px; border-radius: 38px; flex: none; display: grid; place-items: center; background: rgba(29,31,61,.55); box-shadow: inset 0 0 0 1px var(--w-keyedge);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); font-size: 16px; font-weight: 700; transition: transform .18s var(--spring); color: #fff; }
.w-mic .ico { width: 26px; height: 26px; }
.w-plus[hidden], .w-mic[hidden] { display: none; }
.w-log { flex: 1; position: relative; height: 76px; border-radius: 38px; background: var(--w-chalk); color: var(--w-chalk-ink); overflow: hidden; display: flex; align-items: center; justify-content: space-between;
  padding: 0 26px; font-size: 20px; font-weight: 800; letter-spacing: -0.015em; box-shadow: 0 22px 40px -20px rgba(0,0,0,.6); transition: transform .18s var(--spring); }
.w-log small { font-size: 15px; font-weight: 700; opacity: .55; letter-spacing: 0; }
.w-log .fill { position: absolute; inset: 0; background: #d9d4f2; transform-origin: 0 50%; transform: scaleX(0); }
.w-log span, .w-log small { position: relative; }
.w-log.hold .fill { background: #ffe2a8; }
/* workout pop-ups: dark frost that grows out of its source */
.wpop { position: absolute; z-index: 32; left: 14px; right: 14px; border-radius: 26px; padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start;
  background: rgba(70,66,124,.46); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.14), 0 20px 40px -20px rgba(0,0,0,.6); color: #fff; }
.wpop .dot { margin-top: 7px; --acc: var(--gold); }
.wpop p { font-size: 15.5px; line-height: 22px; font-weight: 600; flex: 1; }
.wpop p small { display: block; font-size: 13px; font-weight: 700; color: var(--w-ink3); }
.wpop .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.wpop .pill { background: var(--w-key); box-shadow: inset 0 0 0 1px var(--w-keyedge); color: #fff; }
.wpop .pill.main { background: var(--w-chalk); color: var(--w-chalk-ink); box-shadow: none; }
.wpop input { width: 100%; height: 46px; margin-top: 10px; border-radius: 23px; border: 0; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px var(--w-keyedge);
  color: #fff; padding: 0 16px; font: inherit; font-size: 16px; outline: 0; }
.wpop input::placeholder { color: var(--w-ink3); }
.wchip { position: absolute; z-index: 32; height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; white-space: nowrap;
  background: rgba(24,26,56,.66); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); color: #fff; pointer-events: none; }
.wchip.gold { background: var(--gold); color: #3d2a06; box-shadow: none; }
.listen { display: flex; gap: 4px; align-items: center; height: 22px; margin-top: 8px; }
.listen i { width: 4px; height: 22px; border-radius: 2px; background: #fff; transform: scaleY(.3); animation: lv 1s ease-in-out infinite; }
.listen i:nth-child(2) { animation-delay: -.2s; } .listen i:nth-child(3) { animation-delay: -.4s; } .listen i:nth-child(4) { animation-delay: -.6s; } .listen i:nth-child(5) { animation-delay: -.8s; }
@keyframes lv { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

/* ---------- a new best: the dusk drops away to the summit in full sun ---------- */
.rec { position: absolute; inset: 0; z-index: 34; display: none; color: #fff; overflow: hidden; }
.rec.on { display: block; }
.rec img { position: absolute; inset: -3%; width: 106%; height: 106%; object-fit: cover; }
.rec .blurimg { filter: blur(22px) saturate(1.2) brightness(.9); }
.rec .shade { position: absolute; inset: 0; background: linear-gradient(rgba(20,40,80,.28), rgba(20,40,80,0) 40%, rgba(20,40,80,0) 60%, rgba(20,30,60,.4)); }
.rec .sweep { position: absolute; inset: -20% -60%; opacity: 0; background: linear-gradient(105deg, transparent 38%, rgba(255,246,220,.0) 40%, rgba(255,246,220,.45) 50%, rgba(255,246,220,0) 60%, transparent 62%); }
.rec .stage { position: absolute; left: 0; right: 0; top: calc(var(--H) * .12); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px; text-shadow: 0 2px 18px rgba(10,30,70,.35); }
.medal { width: 168px; height: 168px; perspective: 700px; }
.medal > div { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; align-content: center; color: #4a3208; text-shadow: none;
  background: radial-gradient(circle at 34% 28%, #fff6d6, #f1c766 38%, #c8902c 72%, #9b6a1c);
  box-shadow: inset 0 0 0 6px rgba(255,255,255,.38), inset 0 -8px 18px rgba(120,70,10,.45), 0 26px 50px -18px rgba(60,30,0,.55); position: relative; overflow: hidden; }
.medal b { font-family: var(--disp); font-size: 60px; font-weight: 600; letter-spacing: -.05em; line-height: 1; }
.medal small { font-size: 13px; font-weight: 800; letter-spacing: .02em; margin-top: 2px; }
.medal .shine { position: absolute; inset: -30%; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.8) 50%, transparent 60%); transform: translate3d(-120%,0,0); }
.rec h2 { font-family: var(--disp); font-size: 46px; line-height: 50px; font-weight: 600; letter-spacing: -.04em; margin-top: 26px; text-shadow: 0 2px 24px rgba(14,30,60,.45); }
.rec p { font-size: 16.5px; line-height: 23px; font-weight: 600; color: #fff; margin-top: 6px; text-wrap: balance; text-shadow: 0 1px 2px rgba(14,30,60,.35), 0 2px 18px rgba(14,30,60,.55); }
.rec .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; max-width: 330px; }
.rec .chips span { height: 38px; padding: 0 15px; border-radius: 19px; display: flex; align-items: center; font-size: 15px; font-weight: 700; background: rgba(255,255,255,.92); color: #22304d; text-shadow: none; }
.rec .chips span.g { background: var(--gold); color: #3d2a06; }
.rec .go { position: absolute; left: 20px; right: 20px; bottom: 30px; height: 70px; border-radius: 35px; background: #fff; color: #1d2a48; font-size: 19px; font-weight: 800; box-shadow: 0 20px 40px -20px rgba(0,20,60,.6); }

/* ---------- finish: the sky comes back with today's ridge on it ---------- */
.fin { position: absolute; inset: 0; z-index: 33; display: none; }
.fin.on { display: block; }
.fin .range { position: absolute; left: 0; right: 0; bottom: 112px; height: 260px; }
.fin .range svg { position: absolute; left: 0; bottom: 0; width: 384px; height: 260px; overflow: visible; }
.fin .box { position: absolute; left: 12px; right: 12px; top: calc(var(--H) * .14); border-radius: 36px; padding: 24px 24px 22px; }
.fin h2 { font-family: var(--disp); font-size: 38px; line-height: 42px; font-weight: 600; letter-spacing: -.035em; }
.fin .sub { font-size: 15.5px; line-height: 22px; font-weight: 500; color: var(--ink2); margin-top: 6px; }
.fin .st { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; padding-top: 16px; box-shadow: inset 0 1px 0 var(--hair); }
.fin .st div { font-size: 13px; font-weight: 600; color: var(--ink3); }
.fin .st b { display: block; font-family: var(--disp); font-size: 30px; font-weight: 600; letter-spacing: -.04em; color: var(--ink); margin-top: 2px; line-height: 1.1; }
.fin .go { position: absolute; left: 20px; right: 20px; bottom: 30px; height: 64px; border-radius: 32px; background: var(--btn); color: var(--btn-ink); font-size: 18px; font-weight: 700; z-index: 2; }
@media (prefers-reduced-motion: reduce) { .wall, .wx i, .dot::after, .w-mist i, .listen i { animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app" data-scene="fog">
  <div class="zoom" id="zoom"><div class="par" id="par"><div class="wall" id="wall"></div></div></div>
  <div class="tint" id="tint"></div>
  <div class="wx fog" id="wxfog"><i></i><i></i></div>
  <div class="wx snow" id="wxsnow"><i></i><i></i></div>
  <div class="scrim top"></div><div class="scrim bot"></div>
  <div class="sbar"><span id="clock">07:42</span><span style="display:flex;gap:6px"><svg viewBox="0 0 18 12"><path d="M1 9.5h2.4V12H1zM5.3 7h2.4v5H5.3zM9.6 4.2H12V12H9.6zM13.9 1h2.4v11h-2.4z" fill="currentColor"/></svg><svg viewBox="0 0 26 12"><rect x=".7" y=".7" width="21.6" height="10.6" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.4" y="2.4" width="14.5" height="7.2" rx="1.8" fill="currentColor"/><rect x="23.6" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".5"/></svg></span></div>

  <!-- Today -->
  <section class="view td" id="today">
    <div class="top">
      <p class="date" id="date"></p>
      <button class="chip frost" id="skychip" aria-label="Your sky"><span id="wxico"></span><b id="temp">4°</b><span id="place">Aarhus</span></button>
      <button class="me frost" id="me" aria-label="Dansk / English">DA</button>
    </div>
    <div class="hero" id="hero">
      <p class="lab" id="heroLab"></p>
      <div class="num"><span id="heroNum"></span><u id="heroU">kg</u></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
      <svg class="ridgemini" id="ridgeMini" viewBox="0 0 260 46" hidden></svg>
      <button class="start" id="start"><span id="startTx"></span><small id="startSm"></small></button>
    </div>
    <div class="day frost" id="day">
      <button class="tile" data-card="sleep"><span data-t="sleep"></span><b><span id="vSleep"></span></b><svg viewBox="0 0 100 18" preserveAspectRatio="none" id="spSleep"></svg></button>
      <button class="tile" data-card="food"><span data-t="protein"></span><b><span id="vProt"></span><u>/150 g</u></b><svg viewBox="0 0 100 18" preserveAspectRatio="none" id="spProt"></svg></button>
      <button class="tile" data-card="weight"><span data-t="weight"></span><b><span id="vW"></span><u>kg</u></b><svg viewBox="0 0 100 18" preserveAspectRatio="none" id="spW"></svg></button>
    </div>
  </section>

  <nav class="dock frost td" id="dock">
    <button class="tab on" data-tab="today"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></svg><span data-t="today"></span></button>
    <button class="tab" data-tab="train"><svg class="ico" viewBox="0 0 24 24"><path d="M7 12h10M7 7.5v9M17 7.5v9M3.8 9.8v4.4M20.2 9.8v4.4"/></svg><span data-t="train"></span></button>
    <button class="tab" data-tab="food"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11.5h16a8 8 0 0 1-16 0z"/><path d="M9.5 8c0-1.5 1.2-1.5 1.2-3M14 8c0-1.5 1.2-1.5 1.2-3"/></svg><span data-t="food"></span></button>
    <button class="tab" data-tab="health"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19.5s-7-4.3-7-9.4A3.9 3.9 0 0 1 12 7.9a3.9 3.9 0 0 1 7 2.2c0 5.1-7 9.4-7 9.4z"/></svg><span data-t="health"></span></button>
  </nav>
  <button class="coachb frost td" id="coachBtn" aria-label="Coach"><i class="dot"></i></button>

  <!-- Workout -->
  <section class="wk" id="wk" hidden>
    <canvas class="w-sky" id="wSky"></canvas>
    <div class="w-ridge" id="ridge">
      <svg class="far" id="far" viewBox="0 0 384 150" preserveAspectRatio="none"></svg>
      <div id="peaks"></div>
      <div class="w-mist" id="mist"><i><canvas id="mistC"></canvas></i></div>
    </div>
    <div class="w-seg" id="seg"></div>
    <div class="w-name"><b id="liftName"></b><span id="liftSub"></span></div>
    <button class="w-min" id="minimise" aria-label="Back to Today"><svg class="ico" viewBox="0 0 24 24"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg></button>
    <div class="w-race" id="race"><span data-t="vsTue"></span><div class="w-lane"><i class="rail"></i><i class="fill" id="rFill"></i><i class="gh" id="rGh"></i><i class="you" id="rYou"></i></div><b id="rGap"></b></div>
    <div class="w-face" id="faceSet">
      <div class="w-big" id="bigRow"><span class="n" id="kg"></span><u>kg</u><span class="x">×</span><span class="n" id="reps"></span></div>
      <div class="w-ctl">
        <div><button class="pm" data-d="kg:-1" aria-label="Less weight"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><span>kg</span><button class="pm" data-d="kg:1" aria-label="More weight"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button></div>
        <div><button class="pm" data-d="reps:-1" aria-label="Fewer reps"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><span data-t="reps"></span><button class="pm" data-d="reps:1" aria-label="More reps"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button></div>
      </div>
      <p class="w-tue"><i></i><span id="tue"></span></p>
    </div>
    <div class="w-face w-rest off" id="faceRest">
      <p class="lab"><span id="restLab"></span><button id="undoSet" data-t="undo"></button></p>
      <div class="clk"><span id="clockBig"></span></div>

function spring(k, c, steps = 64) {

  return { e: `linear(0, ${s.join(', ')})`, d: REDUCED ? 1 : Math.round(t * 1000) };

/* ---------------- sun position for Aarhus (NOAA approximation) ---------------- */
const LAT = 56.157, LON = 10.211;
function sunAlt(date) {
  const rad = Math.PI / 180, d = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const g = (357.529 + 0.98560028 * d) * rad, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24, ha = ((gmst * 15 + LON) * rad - ra);
  return Math.asin(Math.sin(LAT * rad) * Math.sin(dec) + Math.cos(LAT * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
}

    const nowH = j.current.time.slice(0, 13); const i0 = j.hourly.time.findIndex((t) => t.slice(0, 13) === nowH);

/* ---------------- digit roller: only the digits that change move ---------------- */
function roll(el, text, instant) {
  text = String(text); const old = el._t; el._t = text;
  const slot = (ch) => `<span><i>${ch}</i></span>`;
  if (!el.classList.contains('roll') || instant || old == null || old.length !== text.length) {
    el.classList.add('roll'); el.innerHTML = [...text].map(slot).join('');
    if (!instant && old != null && old !== text) el.animate([{ opacity: 0, transform: 'translate3d(0,.18em,0)' }, { opacity: 1, transform: 'none' }], { duration: SP.pop.d, easing: SP.pop.e });
    return;
  }
  const num = (t) => parseFloat(t.replace(',', '.').replace(/[^0-9.]/g, '')) || 0, dir = num(text) >= num(old) ? 1 : -1;
  [...el.children].forEach((sp, i) => {
    if (old[i] === text[i]) return;
    [...sp.children].slice(0, -1).forEach((x) => x.remove());
    const was = sp.lastElementChild, now = document.createElement('i'); now.textContent = text[i]; sp.appendChild(now);
    was.animate([{ transform: 'none', opacity: 1 }, { transform: `translate3d(0,${-dir * .42}em,0)`, opacity: 0 }], { duration: 190, easing: 'cubic-bezier(.4,0,.8,.6)', fill: 'forwards' }).onfinish = () => was.remove();

  });
}

  anim(f.querySelector('.box'), [{ opacity: 0, transform: 'translate3d(0,40px,0) scale(.96)' }, { opacity: 1, transform: 'none' }], { s: 'pop', delay: 380, fill: 'backwards' });
  anim($('finRange'), [{ transform: 'translate3d(0,100%,0)' }, { transform: 'none' }], { s: 'rise', delay: 500, fill: 'backwards' });
  anim($('finGo'), [{ opacity: 0, transform: 'translate3d(0,20px,0)' }, { opacity: 1, transform: 'none' }], { s: 'pop', delay: 900, fill: 'backwards' });
  setTimeout(() => { roll($('fV'), thou(S.volume)); roll($('fB'), String(S.bests)); }, 800);
}
$('finGo').addEventListener('click', () => {
  const f = $('fin'); f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-in' }).onfinish = () => f.classList.remove('on');
  const td = $('today'); td.hidden = false; td.getAnimations().forEach((x) => x.cancel()); renderToday(true);
  anim(td, [{ opacity: 0, transform: 'translate3d(0,-20px,0)' }, { opacity: 1, transform: 'none' }], { s: 'pop', delay: 160, fill: 'backwards' });
  ['dock', 'coachBtn'].forEach((id, i) => { const el = $(id); el.style.pointerEvents = ''; el.getAnimations().forEach((x) => x.cancel());
    anim(el, [{ opacity: 0, transform: 'translate3d(0,30px,0)' }, { opacity: 1, transform: 'none' }], { s: 'pop', delay: 220 + i * 40, fill: 'backwards' }); });
  setTab('today');
});
function drawMiniRidge() { const rg = rangeSVG(260, 46); $('ridgeMini').innerHTML = rg ? `<path d="${rg.d}" fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>${rg.flags}` : ''; }

/* ---------------- voice: say the set; the app's own parser reads it (no AI) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const read = (text) => window.A2 ? A2.parseSetCommand(A2.mergeDecimals(A2.mergeNumberWords(text.trim().split(/\s+/)).join(' '))) : null;
let rec = null;
function openVoice() {
  const el = wpop(`<small>${T('sayHint')}</small><span id="vState">${SR ? T('listening') : ''}</span>${SR ? '<span class="listen"><i></i><i></i><i></i><i></i><i></i></span>' : ''}`, $('mic'),
    { stay: true, top: Math.round(H() - 300), extra: '' });
  const p = el.querySelector('p'); const inp = document.createElement('input'); inp.id = 'vIn'; inp.placeholder = T('sayPh'); inp.setAttribute('enterkeyhint', 'done'); p.appendChild(inp);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && inp.value.trim()) { hear(inp.value); } });
  if (SR) { try { rec = new SR(); rec.lang = lang === 'da' ? 'da-DK' : 'en-GB'; rec.interimResults = false;
    rec.onresult = (e) => hear(e.results[0][0].transcript); rec.onerror = () => { const s = $('vState'); if (s) s.textContent = T('typeIt'); el.querySelector('.listen')?.remove(); };
    rec.onend = () => { el.querySelector('.listen')?.remove(); }; rec.start(); } catch (e) { rec = null; } }
  else setTimeout(() => inp.focus({ preventScroll: true }), 300);
}
function hear(text) {
  try { rec && rec.abort(); } catch (e) {}
  const cmd = read(text); closeWpop(true);
  if (!cmd) return wpop(`${T('heard', text)} ${T('notSet')}`, $('mic'), { d: 3600 });
  if (cmd.kind === 'undo') return undoLast();
  if (cmd.kind === 'skip') return S.rest ? endRest() : wpop(T('heard', text), $('mic'));
  if (cmd.kind === 'rest') { if (S.rest) { S.rest.end += cmd.sec * 1000; S.rest.total += cmd.sec * 1000; resumeRestFace(); wpop(T('addedS', cmd.sec), $('clockBig'), { d: 2000 }); } return; }
  if (cmd.kind === 'ask') {
    const opts = (cmd.options || []).filter((o) => o.kind === 'set').map((o) => [o.kg ?? S.kg, o.reps ?? S.reps]);
    const el = wpop(`${T('heard', text)} ${T('which')}`, $('mic'), { stay: true, acts: opts.map((o, i) => `<button class="pill${i ? '' : ' main'}" data-k="${o[0]}" data-r="${o[1]}">${nf(o[0])} kg × ${o[1]}</button>`).join('') });
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) { closeWpop(true); if (S.rest) endRest(); setTimeout(() => logSet(+b.dataset.k, +b.dataset.r), S.rest ? 400 : 0); } }); return;
  }
  if (!['set', 'same', 'done'].includes(cmd.kind)) return wpop(`${T('heard', text)} ${T('notSet')}`, $('mic'), { d: 3600 });
  const prev = S.si > 0 ? S.logs[S.li][S.si - 1] : null;
  const said = cmd.kind === 'set' ? { kg: cmd.kg, reps: cmd.reps } : {};
  const fixed = A2.fixMisheard(said, { kg: S.kg, reps: S.reps });
  const base = cmd.kind === 'same' && prev ? { kg: prev[0], reps: prev[1] } : { kg: S.kg, reps: S.reps };
  const kg = fixed.kg ?? base.kg, reps = fixed.reps ?? base.reps;
  const odd = A2.guardSet({ kg: said.kg === undefined ? undefined : kg, reps: said.reps === undefined ? undefined : reps }, { kg: S.kg, reps: S.reps });
  if (odd) { const picks = (odd.kg ?? [kg]).flatMap((k) => (odd.reps ?? [reps]).map((r) => [k, r]));
    const el = wpop(T('farFrom', odd.kg ? `${nf(kg)} kg` : `${reps} ${T('reps')}`, odd.kg ? `${nf(S.kg)} kg` : `${S.reps} ${T('reps')}`), $('mic'), { stay: true, acts: picks.map((o, i) => `<button class="pill${i ? '' : ' main'}" data-k="${o[0]}" data-r="${o[1]}">${nf(o[0])} kg × ${o[1]}</button>`).join('') });
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) { closeWpop(true); logSet(+b.dataset.k, +b.dataset.r); } }); return; }
  const note = fixed.heard ? T('misheard', fixed.heard.kg !== undefined ? nf(fixed.heard.kg) : fixed.heard.reps, fixed.heard.kg !== undefined ? `${nf(kg)} kg` : `${reps} ${T('reps')}`) : '';
  const go = () => { S.kg = kg; S.reps = reps; renderWorkout(); placeTarget(); setTimeout(() => logSet(kg, reps, note), 260); };
  if (S.rest) { endRest(); setTimeout(go, 300); } else go();
}
$('mic').addEventListener('click', () => { if (wpopEl && wpopEl.querySelector('#vIn')) return closeWpop(); openVoice(); });

/* ---------------- dock ---------------- */
function setTab(t) { document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === t)); }
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  const t = b.dataset.tab; vib(6);
  if (t === 'train') { return S.done ? openCard('sleep', b) : startWorkout(); }
  closeCard(); closeCoachSheet();
  if (t === 'food') { setTab('food'); return openCard('food', b); }
  if (t === 'health') { setTab('health'); return openCard('weight', b); }
  setTab('today');
}));
document.querySelectorAll('.tile').forEach((t) => t.addEventListener('click', () => openCard(t.dataset.card, t)));
$('me').addEventListener('click', () => { lang = lang === 'en' ? 'da' : 'en'; renderAll(); vib(6); });
addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; closeCard(); closeSheet(); closeCoachSheet(); closeWpop(); });

/* ---------------- alive, the way Paper felt: layers drift by depth, follow your finger, spring back; your peaks answer a touch ---------------- */
const drifts = [];
function drift(el, a, dur, lag) {
  if (REDUCED) return;
  drifts.push(el.animate([{ transform: 'translate3d(0,0,0)' }, { transform: `translate3d(${a}px,${(-a * .3).toFixed(1)}px,0)` }, { transform: 'translate3d(0,0,0)' }, { transform: `translate3d(${-a}px,${(a * .2).toFixed(1)}px,0)` }, { transform: 'translate3d(0,0,0)' }],
    { duration: dur, iterations: Infinity, delay: -lag, easing: 'ease-in-out', composite: 'add' }));
}
drift($('far'), 2.5, 23000, 4000); drift($('peaks'), 4, 17000, 9000);
// drift runs only while the workout is on screen and the page is visible
new MutationObserver(() => { const on = app.classList.contains('in-work') && !app.classList.contains('paused'); drifts.forEach((d) => on ? d.play() : d.pause()); }).observe(app, { attributes: true, attributeFilter: ['class'] });
drifts.forEach((d) => d.pause());

const DEPTH = { today: [[$('par'), -.16, -.1], [$('wxfog'), -.42, -.16], [$('wxsnow'), -.3, -.12]], workout: [[$('far'), .12, .05], [$('peaks'), .34, .1]] };
let pdrag = null;
app.addEventListener('pointerdown', (e) => {
  if (e.button > 0 || e.target.closest('button, input, #coach, #card, #sheet, #csheet, .day, .dock, .wpop, .pk.mine, #rec, #fin, #veil')) return;
  const set = S.view === 'workout' ? DEPTH.workout : DEPTH.today;
  pdrag = { x: e.clientX, y: e.clientY, set, moved: false };
});
addEventListener('pointermove', (e) => {
  if (!pdrag) return; const s = scaleOf();
  const dx = Math.max(-44, Math.min(44, (e.clientX - pdrag.x) / s)), dy = Math.max(-26, Math.min(26, (e.clientY - pdrag.y) / s));
  pdrag.moved = true;
  pdrag.set.forEach(([el, kx, ky]) => { el._sb?.cancel(); el.style.transform = `translate3d(${(dx * kx).toFixed(2)}px,${(dy * ky).toFixed(2)}px,0)`; });
});
const pend = () => {
  if (!pdrag) return; const set = pdrag.set; pdrag = null;
  set.forEach(([el]) => { const from = el.style.transform; if (!from) return; el.style.transform = '';
    el._sb = anim(el, [{ transform: from }, { transform: 'translate3d(0,0,0)' }], { s: 'pop', composite: 'add', fill: 'none' }); });
};
addEventListener('pointerup', pend); addEventListener('pointercancel', pend);

$('peaks').addEventListener('click', (e) => {
  const pk = e.target.closest('.pk.mine'); if (!pk || S.busy) return;
  const si = +pk.dataset.si, lg = S.logs[S.li][si], t = lift().sets[si]; if (!lg) return;
  anim(pk, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(1.07)', offset: .3 }, { transform: 'scaleY(1)' }], { duration: 560, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'none' }); vib(4);
  const { cx } = peakX(si, lift().sets.length), h = peakH(lg[0], lg[1]);
  const a = document.createElement('i'); a.style.cssText = `position:absolute;left:${cx - 10}px;bottom:${h}px;width:20px;height:20px`; $('peaks').appendChild(a);
  floatChip(T('peakChip', si + 1, `${nf(lg[0])} × ${lg[1]}`, `${nf(t[2])} × ${t[3]}`), a, { cls: 'wchip', dy: -8 }); setTimeout(() => a.remove(), 100);
});

/* ---------------- fit to the screen ---------------- */
function fit() {
  const w = innerWidth, h = innerHeight; let s, Hh, x = 0, y = 0;
  if (w < 520) { s = Math.min(w / 384, h / 740); Hh = Math.round(h / s); x = (w - 384 * s) / 2; app.classList.remove('desk'); }
  else { Hh = 832; s = Math.min(1.05, (h - 32) / Hh); x = (w - 384 * s) / 2; y = Math.max(16, (h - Hh * s) / 2); app.classList.add('desk'); }
  app.style.setProperty('--H', `${Hh}px`); app.style.setProperty('--s', s); app.style.height = `${Hh}px`;
  app.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  // the workout keeps its numbers at the top and its ridge and button at the bottom; the bar sits between
  $('bar').style.top = `${Math.round(Math.max(372, Math.min(420, Hh - 448)))}px`;
  if (app._H !== Hh) { app._H = Hh; paintDusk(); }
}
addEventListener('resize', fit);

/* ---------------- run ---------------- */
function renderAll() { renderToday(true); if (S.view === 'workout') { renderWorkout(true); if (S.rest) resumeRestFace(); } if (sheetOpen) drawArc(); document.documentElement.lang = lang;
  document.querySelectorAll('#wk [data-t], #rec [data-t], #fin [data-t]').forEach((el) => { el.textContent = T(el.dataset.t); }); }
function clockTick() { $('clock').textContent = hm24(new Date());
  if (S.active) { if (S.view === 'today') renderToday(true); if (S.view === 'workout') { $('liftSub').textContent = T('setOf', Math.min(S.si + 1, lift().sets.length), lift().sets.length, elapsed()); renderRace(); } }
  if (sky.live) { sky.t = Date.now(); if (!W.ok) fromSnap(); applySky(); } }
setInterval(() => loadWeather().then(() => { if (sky.live) applySky(); }), 30 * 60000);
document.addEventListener('visibilitychange', () => { app.classList.toggle('paused', document.hidden); if (!document.hidden && S.rest) resumeRestFace(); });
if (params.get('scene')) { sky.live = false; const sc = params.get('scene'); sky.wx = ({ night: 'clear', dawn: 'clear', dusk: 'clear', sun: 'clear', summer: 'clear', fog: 'cloudy', rain: 'rain', snow: 'snow' })[sc];
  const st = sunTimes(new Date()); const at = { night: 23, dawn: (st.rise - st.start) / 3600000 + .3, dusk: (st.set - st.start) / 3600000 + .3, sun: 12, summer: 13, fog: 11, rain: 11, snow: 10 }[sc];
  sky.t = st.start + at * 3600000; if (sc === 'summer') sky.season = 7; }
fit(); drawFar(); fromSnap(); applySky(true); renderAll(); clockTick(); setInterval(clockTick, 15000);
// morning open: the picture settles, the words arrive one by one, then the Coach speaks first
anim($('zoom'), [{ transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { s: 'soft', duration: 1600 });
[...$('hero').children, $('day'), $('dock'), $('coachBtn'), document.querySelector('.top')].forEach((el, i) =>
  anim(el, [{ opacity: 0, transform: 'translate3d(0,18px,0)' }, { opacity: 1, transform: 'none' }], { s: 'pop', delay: 180 + i * 55, fill: 'backwards' }));
loadWeather().then(() => { applySky(); renderAll(); if (params.get('quiet') == null && location.hash !== '#quiet') showCoach(coachLine(), [[T('startNow'), 'start'], [T('later'), 'later']], 900); });
if (params.get('screen') === 'workout' || location.hash === '#workout') startWorkout();
