<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Today</title>
<link rel="stylesheet" href="../frost/common.css">
<style>
/* Today, in Heat's language: the same hot light from below, Unbounded numbers, one serif voice and a
   cream pill, but the whole screen is one seamless blurred field. From the Oura still it keeps only the idea: one calm number in a ring of ticks, a sentence that talks
   to you, and everything else one tap away. */
.ui { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px; padding: calc(env(safe-area-inset-top) + 12px) 14px 14px; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; height: 40px; flex: none; }
.coach { position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; --veil: 12%; --blur: 24px; }
.coach i { width: 9px; height: 9px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 14px 2px var(--g2); animation: breathe 4.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(0.72); opacity: 0.7; } }

/* The hero: one number in a ring of ticks, on a soft glow. */
.hero { position: relative; flex: 1 1 0; min-height: 0; display: grid; place-items: center; width: 100%; }
.gauge { position: relative; height: 100%; max-height: 292px; aspect-ratio: 1; }
.halo { position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--g2) 34%, transparent), transparent 72%); filter: blur(8px); }
.gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.t line { stroke: color-mix(in srgb, var(--ink) 22%, transparent); stroke-width: 1.6; stroke-linecap: round; transition: stroke 0.5s, stroke-width 0.5s; transition-delay: calc(var(--i) * 9ms); }
.t line.on { stroke: var(--g2); stroke-width: 2.4; }
.t.lit { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--g1) 80%, transparent)); }
.knob { transform-origin: 150px 150px; transition: transform 1.1s cubic-bezier(.2, .9, .15, 1); }
.knob circle { fill: var(--hot); filter: drop-shadow(0 0 7px var(--g2)); }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2px; text-shadow: 0 2px 30px rgb(0 0 0 / .35); }
.read .big { font-size: clamp(76px, 12.5dvh, 104px); font-weight: 200; line-height: 1; letter-spacing: -0.06em; min-width: 1ch; }
.read .cap { color: var(--soft); }
.read .u { position: absolute; left: 0; right: 0; bottom: 5%; text-align: center; font-size: 13px; color: var(--soft); }
.say { text-align: center; font-size: 29px; line-height: 1.12; padding: 0 22px; text-wrap: balance; min-height: 66px; flex: none; margin-top: -4px; }

/* The field: the background IS the day. One seamless blurred gradient, four soft colour masses, each owned by something
   you track: readiness (top), sleep (left), food (right), training (bottom). Their size and glow follow the numbers. */
.field { position: fixed; inset: 0; z-index: 0; overflow: clip; pointer-events: none; background: var(--bg); }
.blob { position: absolute; left: 0; top: 0; width: 130vmax; height: 130vmax; margin: -65vmax 0 0 -65vmax; border-radius: 50%; will-change: transform, opacity;
  background: radial-gradient(closest-side, var(--c) 0%, color-mix(in srgb, var(--c) 74%, transparent) 22%, color-mix(in srgb, var(--c) 36%, transparent) 50%, color-mix(in srgb, var(--c) 10%, transparent) 76%, transparent 100%);
  transition: transform 1.3s cubic-bezier(.2, .8, .15, 1), opacity 1.1s ease; }
.shade { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(180deg, color-mix(in srgb, var(--base) 55%, transparent) 0%, transparent 30%, transparent 62%, color-mix(in srgb, var(--base) 34%, transparent) 100%); }
.ui, .sheet .in { text-shadow: 0 1px 18px color-mix(in srgb, var(--base) 55%, transparent); }
.ui { transition: opacity 0.5s ease, transform 0.9s cubic-bezier(.2, .8, .15, 1); }
.ui.away { opacity: 0; transform: scale(0.96); pointer-events: none; }

/* Today's plan sits straight on the field: no box. */
.plan { flex: none; padding: 0 8px; }
.plan .row { display: flex; justify-content: space-between; align-items: flex-end; }
.plan h2 { font-size: 42px; line-height: 1; margin-top: 4px; }
.plan .meta { color: var(--soft); font-size: 14px; text-align: right; line-height: 1.35; padding-bottom: 4px; }
.plan .meta .num { font-size: 12px; color: var(--ink); }
.plan .line { color: var(--soft); font-size: 15px; margin: 8px 0 14px; min-height: 22px; }
.plan .line b { color: var(--ink); font-weight: 600; }
.plan .line.gold b { color: var(--gold); }
.plan .go { height: 64px; border-radius: 32px; padding: 0 26px; font-size: 16px; }

/* Three numbers, hairlines between, no boxes. */
.tiles { display: flex; flex: none; padding: 2px 0 0; }
.tile { position: relative; flex: 1; height: 94px; padding: 8px 14px 0; text-align: left; display: block; }
.tile + .tile { border-left: 1px solid var(--line); }
.tile .cap { color: var(--soft); }
.tile .num { display: block; font-size: 25px; font-weight: 500; margin-top: 8px; line-height: 1.1; }
.tile .num small { font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--soft); margin-left: 3px; }
.tile .bar { position: absolute; left: 14px; right: 14px; bottom: 8px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 18%, transparent); overflow: clip; }
.tile .bar i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transform: scaleX(var(--v, 0)); border-radius: 2px; background: var(--ink); transition: transform 1s cubic-bezier(.2, .9, .15, 1); }

.ask { height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 12px; padding: 0 22px; color: var(--soft); font-size: 20px; text-align: left; --veil: 9%; flex: none; }
.ask i { width: 7px; height: 7px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 10px var(--g2); flex: none; }

/* A page is the field re-composed: the tapped colour swells to fill the screen and the page fades in over it. */
.sheet { position: fixed; inset: 0; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.45s ease; }
.sheet.on { opacity: 1; pointer-events: auto; }
.sheet .in { position: relative; height: 100%; overflow: auto; padding: calc(env(safe-area-inset-top) + 14px) 22px 40px; scrollbar-width: none; }
.sheet .in::-webkit-scrollbar { display: none; }
.sheet .x { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; z-index: 2; --veil: 14%; --blur: 20px; font-size: 22px; line-height: 1; }
.sheet h3 { font-size: 34px; line-height: 1.05; margin: 8px 0 4px; max-width: 80%; }
.sheet .hn { font-size: 88px; font-weight: 200; letter-spacing: -0.06em; line-height: 1; margin: 22px 0 6px; }
.sheet .hn small { font-family: 'Archivo', sans-serif; font-size: 18px; letter-spacing: 0; color: var(--soft); font-weight: 500; margin-left: 8px; }
.sheet .sub { color: var(--soft); font-size: 16px; margin-bottom: 20px; }
.card { padding: 0; margin-bottom: 18px; border-top: 1px solid var(--line); }
.li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 13px 0; }
.li + .li { border-top: 1px solid var(--line); }
.li .n { font-size: 16px; }
.li .v { font-size: 16px; text-align: right; }
.li .v small { font-family: 'Archivo', sans-serif; font-size: 12px; color: var(--dim); letter-spacing: 0; }
.li .s { grid-column: 1 / -1; font-size: 13px; color: var(--soft); }
.meter { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 18%, transparent); overflow: clip; }
.meter i { display: block; height: 100%; width: calc(var(--v) * 1%); transform-origin: 0 50%; border-radius: 2px; background: var(--ink); }
.stages { display: flex; height: 44px; gap: 3px; margin: 8px 0 14px; }
.stages i { border-radius: 10px; flex: var(--f); background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 40%, transparent)); }
.chart { width: 100%; height: 130px; display: block; margin: 8px 0 12px; overflow: visible; }
.sug { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.sug button { height: 44px; padding: 0 18px; border-radius: 22px; font-size: 15px; --veil: 12%; --blur: 20px; }
.sheet .go { margin-top: 16px; height: 64px; font-size: 16px; }
/* The picture: a misty mountain painted in code, grey only, so it takes the colour of the field under it. The peak rises with readiness. */
.scene { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; transition: transform 1.6s cubic-bezier(.2, .8, .15, 1), opacity 0.8s ease; }
.field.focus .scene { opacity: 0.25; }
@keyframes drift { to { translate: 22px -26px; } }
.blob { animation: drift 15s ease-in-out infinite alternate; }
.blob[data-b=sleep] { animation-duration: 19s; animation-delay: -6s; } .blob[data-b=food] { animation-duration: 17s; animation-delay: -3s; } .blob[data-b=train] { animation-duration: 21s; animation-delay: -9s; }
.blob[data-b=ready] { --c: var(--g2); } .blob[data-b=sleep] { --c: var(--r1); } .blob[data-b=food] { --c: var(--g1); } .blob[data-b=train] { --c: var(--g2); }
@media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
</style>
</head>
<body>
<div class="field" id="field"><i class="blob" data-b="ready"></i><i class="blob" data-b="sleep"></i><i class="blob" data-b="food"></i><i class="blob" data-b="train"></i><canvas class="scene" id="farC" width="195" height="374"></canvas><canvas class="scene near" id="nearC" width="195" height="374"></canvas></div>
<div class="shade"></div>
<main class="ui" id="ui">
  <header class="top">
    <span class="cap" id="date">Mon 2 Nov</span>
    <button type="button" class="coach frost" id="coach" aria-label="Coach"><i></i></button>
  </header>

  <button type="button" class="hero" id="hero" aria-label="Why this number">
    <div class="gauge">
      <i class="halo"></i>
      <svg viewBox="0 0 300 300" aria-hidden="true"><g class="t" id="ticks"></g><g class="knob" id="knob"><circle cx="287" cy="150" r="5"/></g></svg>
      <div class="read"><span class="cap" id="hcap">Ready</span><span class="big num" id="big">00</span><span class="u" id="hu"></span></div>
    </div>
  </button>
  <p class="say serif" id="say"></p>

  <section class="plan" id="pane">
    <div class="row"><div><span class="cap" id="pcap">Today</span><h2 class="serif" id="ptitle">Push</h2></div><p class="meta" id="pmeta"></p></div>
    <p class="line" id="pline"></p>
    <button type="button" class="go" id="go"><span id="gol">Start workout</span><small id="gos"></small></button>
  </section>

  <div class="tiles" id="tiles">
    <button type="button" class="tile" data-k="food"><span class="cap">Protein</span><span class="num" id="t-food">0<small>g</small></span><span class="bar"><i id="b-food"></i></span></button>
    <button type="button" class="tile" data-k="sleep"><span class="cap">Sleep</span><span class="num" id="t-sleep">0<small>h</small></span><span class="bar"><i id="b-sleep"></i></span></button>
    <button type="button" class="tile" data-k="weight"><span class="cap">Weight</span><span class="num" id="t-weight">0<small>kg</small></span><span class="bar"><i id="b-weight"></i></span></button>
  </div>

  <button type="button" class="ask frost" id="ask"><i></i><span class="serif">Ask your coach</span></button>
</main>

<div class="sheet" id="sheet"><button type="button" class="x frost" id="close" aria-label="Close">×</button><div class="in" id="sin"></div></div>
<div class="medal-flash"></div>
<div class="grain"></div>

<script type="module">
import { roll, press, play, SPRINGS, $, $$ } from '../frost/common.js';

/* ---------- Made-up data. Three moments of the same day; the layout never changes, the content does. ---------- */
const M = {
  morning: { hcap: 'Ready', n: 84, hu: '+6 on your usual', say: 'Slept well, legs fresh. A good day to push.',
    pcap: 'Today', title: 'Push', meta: '<span class="num">52</span> min · 5 exercises', line: 'Bench press <b>85 × 6</b> would be a record.',
    go: 'Start workout', gos: 'Bench first', food: [88, 170, 0.52], sleep: ['7:42', 0.86], weight: ['78.4', 0.7], phase: '', frac: 0.84, why: [92, 78, 81, 88, 'Sleep and load are both on your side.'], macros: [88, 112, 31], kcal: '1 120', slnote: '23:18 to 07:00. Deep sleep was your best in two weeks.', stages: [["Deep", "1:46", 14], ["REM", "1:52", 15], ["Light", "3:51", 33], ["Awake", "0:13", 3]], coach: 'You have hit 85 kg for 5 twice. Today is the day for six.', coachsub: 'You slept well and the last two sessions were light on chest. I would keep the plan as it is, and add a 90 second longer rest before the top set.', level: { ready: 0.84, sleep: 0.86, food: 0.52, train: 1 } },
  rest: { hcap: 'Ready', n: 91, hu: 'fully charged', say: 'Nothing to prove today. Rest is part of the plan.',
    pcap: 'Today', title: 'Rest day', meta: 'Next: <span class="num">Pull</span><br>tomorrow, 17:30', line: 'A <b>20 minute walk</b> keeps you loose.',
    go: 'Log a walk', gos: '', food: [124, 170, 0.73], sleep: ['8:05', 0.91], weight: ['78.4', 0.7], phase: '', frac: 0.91, rest: true, why: [96, 86, 88, 94, 'Fully recharged. Nothing is in the way.'], macros: [124, 160, 48], kcal: '1 640', slnote: '22:50 to 07:15. A long night, and it shows.', stages: [["Deep", "2:02", 16], ["REM", "1:58", 15], ["Light", "3:53", 31], ["Awake", "0:12", 2]], coach: 'Rest is when the 85 kg gets built.', coachsub: 'Walk 20 minutes, eat your protein and sleep early. Pull is tomorrow at 17:30.', level: { ready: 0.91, sleep: 0.92, food: 0.73, train: 0.2 } },
  done: { hcap: 'Push', n: 5, hu: 'of 5 done', say: 'Heaviest six you have ever done. Eat well tonight.',
    pcap: 'Today · done', title: 'Push', meta: '<span class="num">54</span> min<br><span class="num">6 420</span> kg moved', line: 'New best: <b>Bench press 85 × 6</b>',
    go: 'See summary', gos: '', food: [88, 170, 0.52], sleep: ['7:42', 0.86], weight: ['78.4', 0.7], phase: 'record', frac: 1, gold: true, why: [92, 78, 81, 88, 'A heavy day, done well.'], macros: [88, 112, 31], kcal: '1 120', slnote: '23:18 to 07:00. Deep sleep was your best in two weeks.', stages: [["Deep", "1:46", 14], ["REM", "1:52", 15], ["Light", "3:51", 33], ["Awake", "0:13", 3]], coach: 'That was your best bench ever, 85 kg for 6.', coachsub: 'Eat 40 g of protein in the next two hours and sleep before 23:00. Next bench is Thursday.', level: { ready: 0.84, sleep: 0.86, food: 0.52, train: 1.5 } },
};

/* ---------- The ring: 60 ticks over 270 degrees, open at the bottom. ---------- */
const N = 60, A0 = 135, SPAN = 270;
const ticks = $('#ticks');
for (let i = 0; i < N; i++) {
  const a = (A0 + (i / (N - 1)) * SPAN) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', 150 + c * 126); l.setAttribute('y1', 150 + s * 126); l.setAttribute('x2', 150 + c * 140); l.setAttribute('y2', 150 + s * 140);
  l.style.setProperty('--i', i); ticks.append(l);
}
const lines = [...ticks.children];
function setRing(frac) {
  const on = Math.round(frac * N);
  lines.forEach((l, i) => l.classList.toggle('on', i < on));
  ticks.classList.toggle('lit', on > 0);
  $('#knob').style.transform = `rotate(${A0 + (Math.max(on, 1) - 1) / (N - 1) * SPAN}deg)`;
}

/* ---------- Moment changes: only what differs moves. ---------- */
const swap = (el, html) => {
  const t = el._t = (el._t || 0) + 1; // a newer swap cancels any older one still fading
  el.getAnimations().forEach((a) => a.cancel());
  if (el.innerHTML === html) return;
  const out = el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: 'ease-in', fill: 'forwards' });
  out.finished.then(() => { if (el._t !== t) return; el.innerHTML = html; out.cancel(); play(el, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], SPRINGS.set); }, () => {});
};
let first = true, cur = 'morning';
function show(k) {
  const d = M[k]; cur = k;
  const root = document.documentElement;
  root.dataset.phase = d.phase;
  level = d.level; field(); lift(d.level.ready);
  setRing(first ? 0 : d.frac);
  if (first) { roll($('#big'), '00'); setTimeout(() => { if (cur !== k) return; roll($('#big'), String(d.n), 1); setRing(d.frac); }, 350); }
  else roll($('#big'), String(d.n), 1);
  swap($('#hcap'), d.hcap); swap($('#hu'), d.hu); swap($('#say'), d.say);
  swap($('#pcap'), d.pcap); swap($('#ptitle'), d.title); swap($('#pmeta'), d.meta); swap($('#pline'), d.line);
  $('#pline').classList.toggle('gold', !!d.gold);
  swap($('#gol'), d.go); swap($('#gos'), d.gos);
  const [p, pt, pf] = d.food;
  swap($('#t-food'), `${p}<small>g</small>`); swap($('#t-sleep'), `${d.sleep[0]}<small>h</small>`); swap($('#t-weight'), `${d.weight[0]}<small>kg</small>`);
  $('#b-food').style.setProperty('--v', pf); $('#b-sleep').style.setProperty('--v', d.sleep[1]); $('#b-weight').style.setProperty('--v', d.weight[1]);
  if (!first && d.gold) play($('.medal-flash'), [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { damping: 1, response: 1.4 });
  first = false;
}

/* ---------- Sheets: a card grows into its page and back. ---------- */
const sheet = $('#sheet'), sin = $('#sin');
const bar = (n, v, s, val) => `<div class="li"><span class="n">${n}</span><span class="v num">${val}</span><span class="meter" style="--v:${v}"><i></i></span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
const curve = 'M0,22 C30,24 50,36 80,34 S130,46 160,54 S215,60 245,70 S290,72 320,80';
const D = () => M[cur];
const PAGES = {
  ready: () => { const d = D(), n = Math.round(d.level.ready * 100); return `<span class="cap">Readiness</span><h3 class="serif">${d.why[4]}</h3>
    <p class="hn num">${n}<small>${d.hu}</small></p><p class="sub">Four things set this number.</p>
    <div class="card">${bar('Sleep', d.why[0], `${d.sleep[0]} h last night`, d.why[0])}${bar('Heart rate recovery', d.why[1], d.why[1] > 80 ? 'Resting 50, right on your usual' : 'Resting 52, a little above your 50', d.why[1])}${bar('Training load', d.why[2], d.rest ? 'Two days since your last session' : '3 sessions in the last 7 days', d.why[2])}${bar('Soreness', d.why[3], d.rest ? 'Everything feels fresh' : 'Chest and triceps feel fresh', d.why[3])}</div>`; },
  food: () => { const d = D(), [p, c, f] = d.macros; return `<span class="cap">Food · so far today</span><p class="hn num">${p}<small>of 170 g protein</small></p><p class="sub">${d.kcal} of 2 600 kcal. Dinner closes the gap.</p>
    <div class="card">${bar('Protein', Math.round(p / 1.7), '', `${p} <small>g</small>`)}${bar('Carbs', Math.round(c / 3), '', `${c} <small>g</small>`)}${bar('Fat', Math.round(f / 0.8), '', `${f} <small>g</small>`)}</div>
    <div class="card"><div class="li"><span class="n">Oats, skyr, berries</span><span class="v num">520<small> kcal</small></span><span class="s">08:10</span></div><div class="li"><span class="n">Chicken wrap</span><span class="v num">600<small> kcal</small></span><span class="s">12:40</span></div></div>
    <button type="button" class="go"><span>Log food</span></button>`; },
  sleep: () => { const d = D(); return `<span class="cap">Sleep · last night</span><p class="hn num">${d.sleep[0]}<small>h</small></p><p class="sub">${d.slnote}</p>
    <div class="stages">${d.stages.map(([, , f], i) => `<i style="--f:${f};--c:var(${['--g3', '--g1', '--g2', '--hot'][i]})"></i>`).join('')}</div>
    <div class="card">${d.stages.map(([n, t]) => `<div class="li"><span class="n">${n}</span><span class="v num">${t}</span></div>`).join('')}</div>`; },
  weight: () => `<span class="cap">Weight · 14 days</span><p class="hn num">78.4<small>kg</small></p><p class="sub">Down 0.3 this week. The trend is smooth, the days are noisy.</p>
    <div class="card"><svg class="chart" viewBox="0 0 320 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--g2)" stop-opacity=".55"/><stop offset="1" stop-color="var(--g2)" stop-opacity="0"/></linearGradient></defs><path d="${curve} L320,100 L0,100Z" fill="url(#wg)"/><path d="${curve}" fill="none" stroke="var(--hot)" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>
    <div class="card"><div class="li"><span class="n">Goal</span><span class="v num">76.0<small> kg</small></span></div><div class="li"><span class="n">Pace</span><span class="v num">−0.3<small> kg / week</small></span></div></div>`,
  coach: () => `<span class="cap">Coach</span><h3 class="serif">${D().coach}</h3>
    <p class="sub" style="margin-top:14px">${D().coachsub}</p>
    <div class="sug"><button type="button" class="frost">Why not 87.5?</button><button type="button" class="frost">Swap bench for incline</button><button type="button" class="frost">What should I eat before?</button></div>`,
};

/* ---------- The picture: far ridges with one tall peak, then near ridges, fog between. Painted once, no image file. ---------- */
function paint() {
  let seed = 7; const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const W = 195, H = 374;
  const ridge = (base, amp, rough, peak) => {
    const ph = Array.from({ length: 6 }, () => rnd() * 6.28), pts = [];
    for (let x = 0; x <= W; x += 1) {
      let y = 0, f = 1, a = 1;
      for (let o = 0; o < 6; o++) { y += Math.abs(Math.sin(x / W * 6.28 * f * 0.9 + ph[o])) * a; f *= 2.05; a *= rough; }
      y = base - (y / 1.9) * amp;
      if (peak) y -= peak.h * Math.exp(-(((x / W) - peak.x) ** 2) / peak.w);
      pts.push(y);
    }
    return pts;
  };
  const layer = (ctx, pts, top, bot, fogTo) => {
    const g = ctx.createLinearGradient(0, Math.min(...pts), 0, H);
    g.addColorStop(0, top); g.addColorStop(0.55, bot); g.addColorStop(1, fogTo);
    ctx.beginPath(); ctx.moveTo(0, H); pts.forEach((y, x) => ctx.lineTo(x, y)); ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  };
  const fog = (ctx, y, a) => { const g = ctx.createLinearGradient(0, y - 40, 0, y + 50); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.55, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - 40, W, 90); };
  const far = $('#farC').getContext('2d'), near = $('#nearC').getContext('2d');
  // Far: pale ranges and one tall peak. Near: darker ranges. Fog between. Big soft forms, no jagged detail.
  layer(far, ridge(132, 26, 0.5, null), 'rgb(158,158,158)', 'rgb(124,124,124)', 'rgb(128,128,128)'); fog(far, 150, 0.35);
  const peak = ridge(150, 44, 0.64, { x: 0.56, h: 80, w: 0.016 });
  layer(far, peak, 'rgb(255,255,255)', 'rgb(70,70,70)', 'rgb(128,128,128)');
  far.save(); far.beginPath(); far.moveTo(0, H); peak.forEach((y, x) => far.lineTo(x, y)); far.lineTo(W, H); far.closePath(); far.clip();
  const sh = far.createLinearGradient(W * 0.44, 0, W * 0.8, 0); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(0.5, 'rgba(0,0,0,0.5)'); sh.addColorStop(1, 'rgba(0,0,0,0.12)'); far.fillStyle = sh; far.fillRect(0, 0, W, H); far.restore();
  far.globalCompositeOperation = 'source-atop'; far.strokeStyle = 'rgba(255,255,255,0.6)'; far.lineWidth = 1.2; far.beginPath(); peak.forEach((y, x) => (x ? far.lineTo(x, y) : far.moveTo(x, y))); far.stroke(); far.globalCompositeOperation = 'source-over';
  fog(far, 178, 0.5);
  layer(near, ridge(205, 28, 0.5, null), 'rgb(60,60,60)', 'rgb(96,96,96)', 'rgb(128,128,128)'); fog(near, 222, 0.5);
  layer(near, ridge(240, 24, 0.5, null), 'rgb(30,30,30)', 'rgb(84,84,84)', 'rgb(128,128,128)'); fog(near, 258, 0.6);
  progressive(far); progressive(near);
}
/* Like Oura's photo: sharp at the top, blurring more and more as it goes down, then dissolving into the background. Done once, in the paint. */
function progressive(ctx) {
  const c = ctx.canvas, W = c.width, H = c.height;
  const src = document.createElement('canvas'); src.width = W; src.height = H; src.getContext('2d').drawImage(c, 0, 0);
  ctx.clearRect(0, 0, W, H); ctx.drawImage(src, 0, 0);
  [[0.8, 0.22], [2, 0.34], [4, 0.46], [8, 0.58]].forEach(([blur, from]) => {
    const t = document.createElement('canvas'); t.width = W; t.height = H; const x = t.getContext('2d');
    x.filter = `blur(${blur}px)`; x.drawImage(src, 0, 0); x.filter = 'none';
    x.globalCompositeOperation = 'destination-in';
    const g = x.createLinearGradient(0, H * from, 0, H * (from + 0.16)); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    ctx.drawImage(t, 0, 0);
  });
  ctx.globalCompositeOperation = 'destination-in';
  const f = ctx.createLinearGradient(0, H * 0.42, 0, H * 0.82); f.addColorStop(0, 'rgba(0,0,0,1)'); f.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = f; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}
paint();
const farC = $('#farC');
const lift = (r) => { farC.style.transform = `translateY(${(0.84 - r) * -150}px) scale(${0.9 + r * 0.14})`; farC.style.transformOrigin = '56% 80%'; };

/* The field: where each colour mass sits, and how big and bright it is for a given day. */
const POS = { ready: [0.5, 0.17], sleep: [0.0, 0.5], food: [1.0, 0.68], train: [0.5, 1.04] };
const FOCUS = { ready: 'ready', food: 'food', sleep: 'sleep', weight: 'train', coach: 'ready' };
let level = { ready: 0.84, sleep: 0.86, food: 0.52, train: 1 };
function field(focus) {
  $('#field').classList.toggle('focus', !!focus);
  const W = innerWidth, H = innerHeight;
  $$('.blob').forEach((el) => {
    const k = el.dataset.b, v = level[k], [px, py] = POS[k];
    let x = px * W, y = py * H, sc = 0.3 + 0.5 * v, o = 0.35 + 0.6 * Math.min(v, 1);
    if (focus) { if (FOCUS[focus] === k) { x = W * 0.5; y = H * 0.34; sc = 1.15; o = 1; } else { sc *= 0.8; o *= 0.45; } }
    el.style.transform = `translate(${x}px, ${y}px) scale(${sc})`; el.style.opacity = o;
  });
}
const ui = $('#ui');
function open(k) {
  if (sheet.classList.contains('on')) return;
  sin.getAnimations().forEach((x) => x.cancel()); sin.innerHTML = PAGES[k](); sin.scrollTop = 0;
  ui.classList.add('away'); sheet.classList.add('on'); field(k);
  [...sin.children].forEach((c, i) => play(c, [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], SPRINGS.set, { delay: 220 + i * 55, fill: 'backwards' }));
  $$('.meter i', sin).forEach((m, i) => play(m, [{ transform: 'scaleX(0)' }, { transform: 'none' }], { damping: 1, response: 0.8 }, { delay: 380 + i * 70 }));
}
function close() {
  if (!sheet.classList.contains('on')) return;
  sheet.classList.remove('on'); ui.classList.remove('away'); field();
}
$('#close').addEventListener('click', close);
addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
$('#hero').addEventListener('click', () => open('ready'));
$('#coach').addEventListener('click', () => open('coach'));
$('#ask').addEventListener('click', () => open('coach'));
$$('.tile').forEach((t) => t.addEventListener('click', () => open(t.dataset.k)));
$('#go').addEventListener('click', () => { if (cur === 'morning') parent.postMessage({ type: 'start' }, '*'); });
[$('#go'), $('#ask'), $('#coach'), ...$$('.tile'), $('#close')].forEach((e) => press(e, 0.97));

addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'moment' && M[d.m]) show(d.m);
  if (d.type === 'theme') document.documentElement.dataset.theme = d.t;
  if (d.type === 'active') document.documentElement.toggleAttribute('data-idle', !d.on);
});
const q = new URLSearchParams(location.search);
if (q.get('t')) document.documentElement.dataset.theme = q.get('t');
document.fonts.ready.then(() => show(M[q.get('m')] ? q.get('m') : 'morning'));
</script>
