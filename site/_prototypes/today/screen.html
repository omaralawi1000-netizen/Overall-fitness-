<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Today</title>
<link rel="stylesheet" href="../frost/common.css">
<style>
/* Today, in Heat's language: the same hot light from below, Unbounded numbers, one serif voice, frosted panes and a
   cream pill. From the Oura still it keeps only the idea: one calm number in a ring of ticks, a sentence that talks
   to you, and everything else one tap away. */
.ui { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px; padding: calc(env(safe-area-inset-top) + 12px) 14px 14px; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; height: 40px; flex: none; }
.coach { position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; --veil: 12%; --blur: 24px; }
.coach i { width: 9px; height: 9px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 14px 2px var(--g2); animation: breathe 4.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(0.72); opacity: 0.7; } }

/* The hero: one number in a ring of ticks, on a soft glow. */
.hero { position: relative; flex: 1 1 0; min-height: 0; display: grid; place-items: center; width: 100%; }
.gauge { position: relative; height: 100%; max-height: 292px; aspect-ratio: 1; }
.halo { position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--g2) 34%, transparent), transparent 72%); filter: blur(8px); }
.gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.t line { stroke: color-mix(in srgb, var(--ink) 22%, transparent); stroke-width: 1.6; stroke-linecap: round; transition: stroke 0.5s, stroke-width 0.5s; transition-delay: calc(var(--i) * 9ms); }
.t line.on { stroke: var(--g2); stroke-width: 2.4; }
.t.lit { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--g1) 80%, transparent)); }
.knob { transform-origin: 150px 150px; transition: transform 1.1s cubic-bezier(.2, .9, .15, 1); }
.knob circle { fill: var(--hot); filter: drop-shadow(0 0 7px var(--g2)); }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2px; text-shadow: 0 2px 30px rgb(0 0 0 / .35); }
.read .big { font-size: clamp(76px, 12.5dvh, 104px); font-weight: 200; line-height: 1; letter-spacing: -0.06em; min-width: 1ch; }
.read .cap { color: var(--soft); }
.read .u { position: absolute; left: 0; right: 0; bottom: 5%; text-align: center; font-size: 13px; color: var(--soft); }
.say { text-align: center; font-size: 29px; line-height: 1.12; padding: 0 22px; text-wrap: balance; min-height: 66px; flex: none; margin-top: -4px; }

/* Panes. */
.pane { border-radius: 32px; padding: 18px 18px 18px; --veil: 11%; flex: none; }
.pane .row { display: flex; justify-content: space-between; align-items: flex-end; }
.pane h2 { font-size: 36px; line-height: 1; margin-top: 6px; }
.pane .meta { color: var(--soft); font-size: 14px; text-align: right; line-height: 1.35; }
.pane .meta .num { font-size: 12px; color: var(--ink); }
.pane .line { color: var(--soft); font-size: 15px; margin: 12px 0 14px; min-height: 22px; }
.pane .line b { color: var(--ink); font-weight: 600; }
.pane .line.gold b { color: var(--gold); }
.pane .go { height: 64px; border-radius: 32px; padding: 0 26px; font-size: 16px; }

.tiles { display: flex; gap: 10px; flex: none; }
.tile { position: relative; flex: 1; height: 106px; border-radius: 28px; padding: 14px 14px 0; text-align: left; --veil: 9%; --blur: 30px; display: block; }
.tile .cap { color: var(--soft); }
.tile .num { display: block; font-size: 25px; font-weight: 500; margin-top: 8px; line-height: 1.1; }
.tile .num small { font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--soft); margin-left: 3px; }
.tile .bar { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 16%, transparent); overflow: clip; }
.tile .bar i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transform: scaleX(var(--v, 0)); border-radius: 2px; background: linear-gradient(90deg, var(--g1), var(--hot)); transition: transform 1s cubic-bezier(.2, .9, .15, 1); }

.ask { height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 12px; padding: 0 22px; color: var(--soft); font-size: 20px; text-align: left; --veil: 9%; flex: none; }
.ask i { width: 7px; height: 7px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 10px var(--g2); flex: none; }

/* The sheet: a card grows into its page. */
.sheet { position: fixed; inset: 0; z-index: 30; overflow: hidden; background: color-mix(in srgb, var(--base) 58%, transparent); -webkit-backdrop-filter: blur(44px) saturate(1.5); backdrop-filter: blur(44px) saturate(1.5); }
.sheet::before { content: ''; position: absolute; inset: 0; background: radial-gradient(90% 46% at 50% 108%, color-mix(in srgb, var(--g1) 85%, transparent), transparent 74%), var(--grain); background-size: auto, 128px; pointer-events: none; }
.sheet .in { position: relative; height: 100%; overflow: auto; padding: calc(env(safe-area-inset-top) + 14px) 18px 40px; scrollbar-width: none; }
.sheet .in::-webkit-scrollbar { display: none; }
.sheet .x { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; z-index: 2; --veil: 14%; --blur: 20px; font-size: 22px; line-height: 1; }
.sheet h3 { font-size: 34px; line-height: 1.05; margin: 8px 0 4px; max-width: 80%; }
.sheet .hn { font-size: 88px; font-weight: 200; letter-spacing: -0.06em; line-height: 1; margin: 22px 0 6px; }
.sheet .hn small { font-family: 'Archivo', sans-serif; font-size: 18px; letter-spacing: 0; color: var(--soft); font-weight: 500; margin-left: 8px; }
.sheet .sub { color: var(--soft); font-size: 16px; margin-bottom: 20px; }
.card { border-radius: 26px; padding: 6px 18px; --veil: 9%; margin-bottom: 12px; }
.li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 13px 0; }
.li + .li { border-top: 1px solid var(--line); }
.li .n { font-size: 16px; }
.li .v { font-size: 16px; text-align: right; }
.li .v small { font-family: 'Archivo', sans-serif; font-size: 12px; color: var(--dim); letter-spacing: 0; }
.li .s { grid-column: 1 / -1; font-size: 13px; color: var(--dim); }
.meter { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 14%, transparent); overflow: clip; }
.meter i { display: block; height: 100%; width: calc(var(--v) * 1%); transform-origin: 0 50%; border-radius: 2px; background: linear-gradient(90deg, var(--g1), var(--hot)); }
.stages { display: flex; height: 44px; gap: 3px; margin: 8px 0 14px; }
.stages i { border-radius: 10px; flex: var(--f); background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 40%, transparent)); }
.chart { width: 100%; height: 130px; display: block; margin: 8px 0 4px; overflow: visible; }
.sug { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.sug button { height: 44px; padding: 0 18px; border-radius: 22px; font-size: 15px; --veil: 12%; --blur: 20px; }
.sheet .go { margin-top: 16px; height: 64px; font-size: 16px; }
</style>
</head>
<body>
<div class="light"></div>
<main class="ui" id="ui">
  <header class="top">
    <span class="cap" id="date">Mon 2 Nov</span>
    <button type="button" class="coach frost" id="coach" aria-label="Coach"><i></i></button>
  </header>

  <button type="button" class="hero" id="hero" aria-label="Why this number">
    <div class="gauge">
      <i class="halo"></i>
      <svg viewBox="0 0 300 300" aria-hidden="true"><g class="t" id="ticks"></g><g class="knob" id="knob"><circle cx="287" cy="150" r="5"/></g></svg>
      <div class="read"><span class="cap" id="hcap">Ready</span><span class="big num" id="big">00</span><span class="u" id="hu"></span></div>
    </div>
  </button>
  <p class="say serif" id="say"></p>

  <section class="pane frost" id="pane">
    <div class="row"><div><span class="cap" id="pcap">Today</span><h2 class="serif" id="ptitle">Push</h2></div><p class="meta" id="pmeta"></p></div>
    <p class="line" id="pline"></p>
    <button type="button" class="go" id="go"><span id="gol">Start workout</span><small id="gos"></small></button>
  </section>

  <div class="tiles" id="tiles">
    <button type="button" class="tile frost" data-k="food"><span class="cap">Protein</span><span class="num" id="t-food">0<small>g</small></span><span class="bar"><i id="b-food"></i></span></button>
    <button type="button" class="tile frost" data-k="sleep"><span class="cap">Sleep</span><span class="num" id="t-sleep">0<small>h</small></span><span class="bar"><i id="b-sleep"></i></span></button>
    <button type="button" class="tile frost" data-k="weight"><span class="cap">Weight</span><span class="num" id="t-weight">0<small>kg</small></span><span class="bar"><i id="b-weight"></i></span></button>
  </div>

  <button type="button" class="ask frost" id="ask"><i></i><span class="serif">Ask your coach</span></button>
</main>

<div class="sheet" id="sheet" hidden><button type="button" class="x frost" id="close" aria-label="Close">×</button><div class="in" id="sin"></div></div>
<div class="medal-flash"></div>
<div class="grain"></div>

<script type="module">
import { roll, press, play, SPRINGS, $, $$ } from '../frost/common.js';

/* ---------- Made-up data. Three moments of the same day; the layout never changes, the content does. ---------- */
const M = {
  morning: { hcap: 'Ready', n: 84, hu: '+6 on your usual', say: 'Slept well, legs fresh. A good day to push.',
    pcap: 'Today', title: 'Push', meta: '<span class="num">52</span> min · 5 exercises', line: 'Bench press <b>85 × 6</b> would be a record.',
    go: 'Start workout', gos: 'Bench first', food: [88, 170, 0.52], sleep: ['7:42', 0.86], weight: ['78.4', 0.7], phase: '', frac: 0.84 },
  rest: { hcap: 'Ready', n: 91, hu: 'fully charged', say: 'Nothing to prove today. Rest is part of the plan.',
    pcap: 'Today', title: 'Rest day', meta: 'Next: <span class="num">Pull</span><br>tomorrow, 17:30', line: 'A <b>20 minute walk</b> keeps you loose.',
    go: 'Log a walk', gos: '', food: [124, 170, 0.73], sleep: ['8:05', 0.91], weight: ['78.4', 0.7], phase: '', frac: 0.91 },
  done: { hcap: 'Push', n: 5, hu: 'of 5 done', say: 'Heaviest six you have ever done. Eat well tonight.',
    pcap: 'Today · done', title: 'Push', meta: '<span class="num">54</span> min<br><span class="num">6 420</span> kg moved', line: 'New best: <b>Bench press 85 × 6</b>',
    go: 'See summary', gos: '', food: [88, 170, 0.52], sleep: ['7:42', 0.86], weight: ['78.4', 0.7], phase: 'record', frac: 1, gold: true },
};

/* ---------- The ring: 60 ticks over 270 degrees, open at the bottom. ---------- */
const N = 60, A0 = 135, SPAN = 270;
const ticks = $('#ticks');
for (let i = 0; i < N; i++) {
  const a = (A0 + (i / (N - 1)) * SPAN) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', 150 + c * 126); l.setAttribute('y1', 150 + s * 126); l.setAttribute('x2', 150 + c * 140); l.setAttribute('y2', 150 + s * 140);
  l.style.setProperty('--i', i); ticks.append(l);
}
const lines = [...ticks.children];
function setRing(frac) {
  const on = Math.round(frac * N);
  lines.forEach((l, i) => l.classList.toggle('on', i < on));
  ticks.classList.toggle('lit', on > 0);
  $('#knob').style.transform = `rotate(${A0 + (Math.max(on, 1) - 1) / (N - 1) * SPAN}deg)`;
}

/* ---------- Moment changes: only what differs moves. ---------- */
const swap = (el, html) => {
  if (el.innerHTML === html) return;
  const out = el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: 'ease-in', fill: 'forwards' });
  out.finished.then(() => { el.innerHTML = html; out.cancel(); play(el, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], SPRINGS.set); }, () => {});
};
let first = true, cur = 'morning';
function show(k) {
  const d = M[k]; cur = k;
  const root = document.documentElement;
  root.dataset.phase = d.phase;
  setRing(first ? 0 : d.frac);
  if (first) { roll($('#big'), '00'); setTimeout(() => { roll($('#big'), String(d.n), 1); setRing(d.frac); }, 350); }
  else roll($('#big'), String(d.n), 1);
  swap($('#hcap'), d.hcap); swap($('#hu'), d.hu); swap($('#say'), d.say);
  swap($('#pcap'), d.pcap); swap($('#ptitle'), d.title); swap($('#pmeta'), d.meta); swap($('#pline'), d.line);
  $('#pline').classList.toggle('gold', !!d.gold);
  swap($('#gol'), d.go); swap($('#gos'), d.gos);
  const [p, pt, pf] = d.food;
  swap($('#t-food'), `${p}<small>g</small>`); swap($('#t-sleep'), `${d.sleep[0]}<small>h</small>`); swap($('#t-weight'), `${d.weight[0]}<small>kg</small>`);
  $('#b-food').style.setProperty('--v', pf); $('#b-sleep').style.setProperty('--v', d.sleep[1]); $('#b-weight').style.setProperty('--v', d.weight[1]);
  if (!first && d.gold) play($('.medal-flash'), [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { damping: 1, response: 1.4 });
  first = false;
}

/* ---------- Sheets: a card grows into its page and back. ---------- */
const sheet = $('#sheet'), sin = $('#sin');
const SPEC = { damping: 1, response: 0.46 };
const bar = (n, v, s, val) => `<div class="li"><span class="n">${n}</span><span class="v num">${val}</span><span class="meter" style="--v:${v}"><i></i></span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
const curve = 'M0,22 C30,24 50,36 80,34 S130,46 160,54 S215,60 245,70 S290,72 320,80';
const PAGES = {
  ready: () => `<span class="cap">Readiness</span><h3 class="serif">Sleep and load are both on your side.</h3>
    <p class="hn num">84<small>+6 on your usual</small></p><p class="sub">Four things set this number.</p>
    <div class="card frost">${bar('Sleep', 92, '7 h 42 min, bed at 23:18', '92')}${bar('Heart rate recovery', 78, 'Resting 52, a little above your 50', '78')}${bar('Training load', 81, '3 sessions in the last 7 days', '81')}${bar('Soreness', 88, 'Chest and triceps feel fresh', '88')}</div>`,
  food: () => `<span class="cap">Food · so far today</span><p class="hn num">88<small>of 170 g protein</small></p><p class="sub">1 120 of 2 600 kcal. Dinner closes the gap.</p>
    <div class="card frost">${bar('Protein', 52, '', '88 <small>g</small>')}${bar('Carbs', 38, '', '112 <small>g</small>')}${bar('Fat', 44, '', '31 <small>g</small>')}</div>
    <div class="card frost"><div class="li"><span class="n">Oats, skyr, berries</span><span class="v num">520<small> kcal</small></span><span class="s">08:10</span></div><div class="li"><span class="n">Chicken wrap</span><span class="v num">600<small> kcal</small></span><span class="s">12:40</span></div></div>
    <button type="button" class="go"><span>Log food</span></button>`,
  sleep: () => `<span class="cap">Sleep · last night</span><p class="hn num">7:42<small>h</small></p><p class="sub">23:18 to 07:00. Deep sleep was your best in two weeks.</p>
    <div class="stages"><i style="--f:14;--c:var(--g3)"></i><i style="--f:33;--c:var(--g1)"></i><i style="--f:22;--c:var(--g2)"></i><i style="--f:5;--c:var(--hot)"></i><i style="--f:26;--c:var(--g1)"></i></div>
    <div class="card frost"><div class="li"><span class="n">Deep</span><span class="v num">1:46</span></div><div class="li"><span class="n">REM</span><span class="v num">1:52</span></div><div class="li"><span class="n">Light</span><span class="v num">3:51</span></div><div class="li"><span class="n">Awake</span><span class="v num">0:13</span></div></div>`,
  weight: () => `<span class="cap">Weight · 14 days</span><p class="hn num">78.4<small>kg</small></p><p class="sub">Down 0.3 this week. The trend is smooth, the days are noisy.</p>
    <div class="card frost" style="padding:14px 18px 10px"><svg class="chart" viewBox="0 0 320 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--g2)" stop-opacity=".55"/><stop offset="1" stop-color="var(--g2)" stop-opacity="0"/></linearGradient></defs><path d="${curve} L320,100 L0,100Z" fill="url(#wg)"/><path d="${curve}" fill="none" stroke="var(--hot)" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>
    <div class="card frost"><div class="li"><span class="n">Goal</span><span class="v num">76.0<small> kg</small></span></div><div class="li"><span class="n">Pace</span><span class="v num">−0.3<small> kg / week</small></span></div></div>`,
  coach: () => `<span class="cap">Coach</span><h3 class="serif">You have hit 85 kg for 5 twice. Today is the day for six.</h3>
    <p class="sub" style="margin-top:14px">You slept well and the last two sessions were light on chest. I would keep the plan as it is, and add a 90 second longer rest before the top set.</p>
    <div class="sug"><button type="button" class="frost">Why not 87.5?</button><button type="button" class="frost">Swap bench for incline</button><button type="button" class="frost">What should I eat before?</button></div>`,
};
let origin = null, busy = false;
function inset(r) { return `inset(${r.top}px ${innerWidth - r.right}px ${innerHeight - r.bottom}px ${r.left}px round ${r.radius}px)`; }
function open(k, el) {
  if (busy || !sheet.hidden) return; busy = true;
  const b = el.getBoundingClientRect();
  origin = { top: b.top, right: b.right, bottom: b.bottom, left: b.left, radius: parseFloat(getComputedStyle(el).borderTopLeftRadius) || 28 };
  sin.getAnimations().forEach((x) => x.cancel()); sin.innerHTML = PAGES[k](); sin.scrollTop = 0; sheet.hidden = false;
  const a = play(sheet, [{ clipPath: inset(origin) }, { clipPath: 'inset(0px 0px 0px 0px round 0px)' }], SPEC, { fill: 'both' });
  [...sin.children].forEach((c, i) => play(c, [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], SPRINGS.set, { delay: 140 + i * 45, fill: 'backwards' }));
  $$('.meter i', sin).forEach((m, i) => play(m, [{ transform: 'scaleX(0)' }, { transform: 'none' }], { damping: 1, response: 0.8 }, { delay: 220 + i * 70 }));
  a.finished.then(() => { busy = false; a.cancel(); }, () => { busy = false; });
}
function close() {
  if (busy || sheet.hidden) return; busy = true;
  const a = play(sheet, [{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: inset(origin) }], { damping: 1, response: 0.34 }, { fill: 'forwards' });
  sin.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: 'forwards' });
  a.finished.then(() => { sheet.hidden = true; busy = false; a.cancel(); }, () => { busy = false; });
}
$('#close').addEventListener('click', close);
addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
$('#hero').addEventListener('click', () => open('ready', $('.gauge')));
$('#coach').addEventListener('click', () => open('coach', $('#coach')));
$('#ask').addEventListener('click', () => open('coach', $('#ask')));
$$('.tile').forEach((t) => t.addEventListener('click', () => open(t.dataset.k, t)));
$('#go').addEventListener('click', () => { if (cur === 'morning') parent.postMessage({ type: 'start' }, '*'); });
[$('#go'), $('#ask'), $('#coach'), ...$$('.tile'), $('#close')].forEach((e) => press(e, 0.97));

addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'moment' && M[d.m]) show(d.m);
  if (d.type === 'theme') document.documentElement.dataset.theme = d.t;
  if (d.type === 'active') document.documentElement.toggleAttribute('data-idle', !d.on);
});
const q = new URLSearchParams(location.search);
if (q.get('t')) document.documentElement.dataset.theme = q.get('t');
document.fonts.ready.then(() => show(M[q.get('m')] ? q.get('m') : 'morning'));
</script>
</body>
</html>
