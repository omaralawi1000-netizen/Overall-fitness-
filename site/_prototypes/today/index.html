<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="robots" content="noindex">
<title>Aven 2 · Today next to the workout</title>
<style>
  :root { --bar: 96px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0a0b; color: #f2f3f5; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  .pager { position: fixed; left: 0; right: 0; top: 0; bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .pager::-webkit-scrollbar { display: none; }
  .pager section { flex: none; width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #0a0a0b; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); background: #0a0a0b; border-top: 1px solid rgba(255, 255, 255, .08); display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 16px; background: rgba(255, 255, 255, .08); }
  .tabs button { height: 28px; padding: 0 12px; border-radius: 13px; border: 0; background: none; color: rgba(255, 255, 255, .6); font-size: 13px; font-weight: 600; }
  .tabs button.on { background: #fff; color: #0a0a0b; }
  .name { font-size: 13px; color: rgba(255, 255, 255, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 6px; flex: 1; } .chips button { flex: 1; height: 38px; border-radius: 19px; border: 0; background: rgba(255, 255, 255, .1); color: #f2f3f5; font-size: 13px; font-weight: 500; }
  .themes { display: flex; gap: 6px; } .themes button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: linear-gradient(135deg, var(--a), var(--b)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .themes button.on { box-shadow: 0 0 0 2px #0a0a0b, 0 0 0 4px #fff; }
</style>
</head>
<body>
<main class="pager" id="pager"></main>
<footer class="bar">
  <div class="row"><div class="tabs" id="tabs"></div><div class="name" id="name"></div></div>
  <div class="row"><div class="chips" id="chips"></div><div class="themes" id="themes"></div></div>
</footer>
<script>
/* Made-up data only. Today (this page's screen) swipes against the workout screen from the frost round, same theme. */
const P = [
  { f: 'screen.html', n: 'Today', d: 'the background is your day', m: [['morning', 'Morning'], ['rest', 'Rest day'], ['done', 'After lifting']] },
  { f: '../frost/fluted.html', n: 'Workout', d: 'Fluted, from the frost round', m: [['set', 'Set'], ['rest', 'Rest'], ['record', 'Record']] },
];
const T = [['heat', '#FF4816', '#FFAC3C', 'Heat'], ['glacier', '#2F6BFF', '#7FD3FF', 'Glacier'], ['volt', '#2FA51A', '#C8FF3A', 'Volt'], ['violet', '#8A2BFF', '#FF4FD8', 'Violet'], ['rose', '#FF3D63', '#FFB38A', 'Rose'], ['chrome', '#5E6672', '#DCE3EC', 'Chrome']];
const q = new URLSearchParams(location.search);
let cur = q.get('v') === '2' ? 1 : 0, theme = T.some((t) => t[0] === q.get('t')) ? q.get('t') : 'heat';
const pager = document.getElementById('pager'), tabs = document.getElementById('tabs'), name = document.getElementById('name'), chips = document.getElementById('chips'), themes = document.getElementById('themes');
const frames = P.map((p) => { const s = document.createElement('section'); s.innerHTML = `<iframe title="${p.n}" src="${p.f}?t=${theme}${p.m[0][0] && q.get('m') && p === P[cur] ? '&m=' + q.get('m') : ''}"></iframe>`; pager.append(s); return s.firstChild; });
const post = (f, msg) => f.contentWindow && f.contentWindow.postMessage(msg, '*');
const go = (i) => pager.scrollTo({ left: i * pager.clientWidth, behavior: 'smooth' });
P.forEach((p, i) => { const b = document.createElement('button'); b.textContent = p.n; b.onclick = () => go(i); tabs.append(b); });
T.forEach(([k, a, b, l]) => { const e = document.createElement('button'); e.style.setProperty('--a', a); e.style.setProperty('--b', b); e.dataset.t = k; e.setAttribute('aria-label', l + ' theme'); e.onclick = () => { theme = k; frames.forEach((f) => post(f, { type: 'theme', t: k })); paint(); }; themes.append(e); });
function paint() {
  [...tabs.children].forEach((b, i) => b.classList.toggle('on', i === cur));
  name.textContent = P[cur].d;
  chips.innerHTML = '';
  P[cur].m.forEach(([k, l]) => { const b = document.createElement('button'); b.textContent = l; b.onclick = () => post(frames[cur], { type: 'moment', m: k }); chips.append(b); });
  [...themes.children].forEach((b) => b.classList.toggle('on', b.dataset.t === theme));
  frames.forEach((f, i) => post(f, { type: 'active', on: i === cur }));
}
frames.forEach((f) => f.addEventListener('load', () => post(f, { type: 'active', on: f === frames[cur] })));
pager.addEventListener('scroll', () => { const i = Math.round(pager.scrollLeft / pager.clientWidth); if (i !== cur) { cur = i; paint(); } }, { passive: true });
addEventListener('message', (e) => { if (e.data && e.data.type === 'start') { go(1); setTimeout(() => post(frames[1], { type: 'moment', m: 'set' }), 450); } });
if (cur) requestAnimationFrame(() => pager.scrollTo({ left: pager.clientWidth }));
paint();
</script>
</body>
</html>
