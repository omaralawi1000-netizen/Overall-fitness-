<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4">
<title>Aven Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Drift: style 9 of the ten-style round. Numbers and progress form from fine particles and dissolve back into them.
   The particles are the day's weather: snow, drizzle, pollen or sand. Light field, ink type, one accent per weather. */
:root{
  --bg:#EEF1F4; --bg2:#E3E8EE; --ink:#131A24; --ink2:#556070; --ink3:#8D97A5;
  --line:rgba(19,26,36,.09); --card:rgba(255,255,255,.62); --glass:rgba(250,252,255,.56);
  --acc:#2B4CDB; --accSoft:rgba(43,76,219,.10); --brass:#9C7A2C; --brassSoft:rgba(156,122,44,.13);
  --wx:#8EA2BE; --dune:#C9D3DF;
  --s-top:env(safe-area-inset-top,0px); --s-bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html[data-wx=pollen]{--bg:#F2F1E7;--bg2:#E9E8D6;--wx:#A8A23E;--acc:#3D6A2C;--accSoft:rgba(61,106,44,.11);--dune:#DAD7B4}
html[data-wx=sand]{--bg:#F4EFE7;--bg2:#ECE3D5;--wx:#B39370;--acc:#1E5470;--accSoft:rgba(30,84,112,.10);--dune:#E3D5C0}
html[data-wx=rain]{--bg:#ECEFF1;--bg2:#DFE5EA;--wx:#7E90A3;--acc:#2C507E;--accSoft:rgba(44,80,126,.10);--dune:#CBD5DE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:Geist,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  font-feature-settings:"tnum" 1,"ss01" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.app{position:fixed;inset:0;max-width:440px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
/* weather: tiled textures that move on the compositor */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.wx{position:absolute;top:-256px;left:-256px;right:-256px;bottom:-256px;background-repeat:repeat;background-size:256px 256px}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.5;background-size:128px 128px;mix-blend-mode:multiply}
/* screens */
.screen{position:absolute;inset:0;overflow:hidden;padding:calc(var(--s-top) + 14px) 20px calc(var(--s-bot) + 16px);display:flex;flex-direction:column}
#workout{visibility:hidden}
.c{display:inline-block}
.num{display:inline-flex;white-space:pre;line-height:1}
.mute{color:var(--ink2)}
/* pool of particles */
#pool{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#pool i{position:absolute;left:0;top:0;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:var(--ink);opacity:0}
/* ---------- Today ---------- */
.t-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{font-size:15px;font-weight:500;letter-spacing:-.01em}
.wxline{display:inline-flex;align-items:center;gap:8px;margin-top:4px;font-size:14px;color:var(--ink2);min-height:32px;padding-right:6px}
.wxdots{width:16px;height:16px;flex:none}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;background:var(--card);border:1px solid var(--line)}
.hero{margin-top:22px}
.hero-lab{font-size:14px;color:var(--ink2);letter-spacing:.01em}
.hero-num{font-size:132px;font-weight:300;letter-spacing:-.065em;margin:4px 0 0 -7px;height:132px}
.hero-line{font-size:18px;line-height:1.38;letter-spacing:-.012em;max-width:300px;margin-top:12px}
.coach{margin-top:18px;border-radius:22px;padding:16px 16px 14px;background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px -18px rgba(19,26,36,.25)}
.coach-who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.coach-msg{font-size:16.5px;line-height:1.4;margin-top:8px;letter-spacing:-.01em}
.coach-act{display:flex;gap:8px;margin-top:12px;min-height:44px;align-items:center}
.btn{height:44px;padding:0 18px;border-radius:22px;font-size:15px;font-weight:500;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec{background:rgba(19,26,36,.06)}
.done-pill{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2)}
.done-pill b{font-weight:500;color:var(--ink)}
.link{color:var(--acc);font-weight:500;min-height:44px;padding:0 6px}
.tiles{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:12px}
.tile{border-radius:22px;background:var(--card);border:1px solid rgba(255,255,255,.75);padding:15px 15px 14px;position:relative;overflow:hidden;text-align:left}
.tile-lab{font-size:13px;color:var(--ink2)}
.tile-big{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-top:5px}
.tile-sub{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.35}
.train{grid-row:span 2;display:flex;flex-direction:column}
.train .start{margin-top:auto;height:52px;border-radius:26px;background:var(--ink);color:#fff;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.train .start:active{transform:scale(.97)}
.train-time{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-size:15px;color:var(--ink2)}
.train-time .num{font-size:30px;font-weight:400;color:var(--ink);letter-spacing:-.03em}
.jar{position:absolute;right:12px;top:14px;bottom:14px;width:12px;border-radius:6px;background:rgba(19,26,36,.06);overflow:hidden}
.jar-fill{position:absolute;left:0;right:0;bottom:0;height:100%;transform-origin:50% 100%;
  background-image:radial-gradient(circle,var(--acc) 1.05px,transparent 1.35px);background-size:4px 4px;background-position:0 0}
.food .tile-big .num{font-size:22px}
.addskyr{margin-top:8px;height:44px;padding:0 12px;border-radius:20px;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:500;width:max-content;transition:transform .12s}
.addskyr:active{transform:scale(.96)}
.ask{margin-top:auto;height:56px;border-radius:28px;display:flex;align-items:center;gap:12px;padding:0 10px 0 20px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(255,255,255,.7);color:var(--ink3);font-size:16px;text-align:left;width:100%}
.ask .mic{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
/* ---------- Workout ---------- */
.w-top{display:flex;align-items:center;justify-content:space-between;height:48px}
.back{height:44px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;padding-right:10px}
.clock{font-size:15px;color:var(--ink2)}
.clock .num{color:var(--ink);font-weight:500}
.ex{margin-top:18px}
.ex-name{font-size:30px;font-weight:500;letter-spacing:-.03em}
.ex-meta{display:flex;gap:14px;margin-top:6px;font-size:15px;color:var(--ink2)}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:22px;height:4px;border-radius:2px;background:rgba(19,26,36,.12)}
.pip.on{background:var(--ink)} .pip.pr{background:var(--brass)} .pip.now{background:var(--acc)}
.stage{position:relative;flex:1;min-height:300px}
.lift{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;align-items:center;justify-content:space-between}
.step{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid rgba(255,255,255,.8);display:grid;place-items:center;font-size:28px;font-weight:300;flex:none;transition:transform .1s, background-color .2s}
.step:active{transform:scale(.92);background:#fff}
.val{display:flex;flex-direction:column;align-items:center}
.w-num{font-size:124px;font-weight:300;letter-spacing:-.065em;height:124px}
.r-num{font-size:56px;font-weight:300;letter-spacing:-.05em;height:56px}
.unit{font-size:14px;color:var(--ink2);margin-top:8px;letter-spacing:.02em}
.by{height:1px;background:var(--line);margin:18px 64px}
.hint{display:flex;justify-content:center;margin-top:18px;height:36px}
.chip{height:36px;padding:0 14px;border-radius:18px;display:inline-flex;align-items:center;gap:8px;font-size:14px;background:rgba(19,26,36,.05);color:var(--ink2);transition:background-color .25s,color .25s}
.chip.hot{background:var(--brassSoft);color:var(--brass)}
.chip .lab{display:inline-block}
.log{height:64px;border-radius:32px;background:var(--acc);color:#fff;font-size:18px;font-weight:500;width:100%;position:relative;overflow:hidden;transition:transform .12s}
.log:active{transform:scale(.975)}
.log .fill{position:absolute;inset:0;background:rgba(255,255,255,.22);transform:scaleX(0);transform-origin:0 50%}
.log span{position:relative}
.sets{display:flex;gap:8px;margin:14px 0 6px;min-height:30px;flex-wrap:wrap;position:relative;z-index:3}
.set{height:34px;padding:0 12px;border-radius:17px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.55);color:var(--ink2)}
.set b{font-weight:500;color:var(--ink)}
.set.pr{background:var(--brassSoft);color:var(--brass)} .set.pr b{color:var(--brass)}
.dune{position:absolute;left:0;right:0;bottom:-310px;height:400px;pointer-events:none;z-index:1}
.dune svg{width:100%;height:100%;display:block}
.w-foot{position:relative;z-index:3}
/* rest */
.rest{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden}
.sphere{position:relative;width:260px;height:260px}
.sph{position:absolute;left:50%;top:50%;width:0;height:0}
.sph i{position:absolute;left:0;top:0;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:var(--ink)}
.cd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-num{font-size:64px;font-weight:300;letter-spacing:-.05em;height:64px;padding:0 10px;border-radius:20px;background:color-mix(in srgb,var(--bg) 82%,transparent)}
.cd-lab{font-size:14px;color:var(--ink2);margin-top:8px}
.next{margin-top:16px;font-size:15px;color:var(--ink2);text-align:center}
.next b{color:var(--ink);font-weight:500}
.rest-ctl{display:flex;gap:10px;margin-top:18px}
.rest-ctl .btn{height:48px;border-radius:24px;padding:0 18px;background:var(--card);border:1px solid rgba(255,255,255,.8)}
.rest-ctl .btn.skip{background:var(--ink);color:#fff;border-color:transparent}
/* PR */
.veil{position:absolute;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 70%,transparent);visibility:hidden}
.prbox{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden;perspective:900px;pointer-events:none}
.prbox.on{pointer-events:auto}
.coin{width:168px;height:168px;border-radius:50%;position:relative;display:grid;place-items:center;color:var(--brass);
  background:#FBF8F0;box-shadow:inset 0 0 0 1.5px var(--brass),inset 0 0 0 9px #FBF8F0,inset 0 0 0 10px rgba(156,122,44,.35),0 20px 40px -24px rgba(110,80,20,.45);overflow:hidden}
.coin .shine{position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 40%,rgba(214,182,110,.28) 50%,transparent 60%);transform:translateX(-120%)}
.coin-num{font-size:50px;font-weight:300;letter-spacing:-.05em;position:relative;color:var(--ink)}
.coin-u{font-size:12px;letter-spacing:.12em;margin-top:4px;position:relative}
.coin-in{display:flex;flex-direction:column;align-items:center}
.prtext{margin-top:22px;text-align:center}
.prtext h2{font-size:30px;font-weight:500;letter-spacing:-.03em}
.prtext p{font-size:16px;color:var(--ink2);margin-top:6px;line-height:1.4}
.prtext .btn{margin-top:20px;height:52px;border-radius:26px;padding:0 28px;font-size:16px}
/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:35;border-radius:28px 28px 0 0;padding:14px 20px calc(var(--s-bot) + 20px);
  background:rgba(250,251,253,.78);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border-top:1px solid rgba(255,255,255,.85);visibility:hidden;box-shadow:0 -12px 40px -24px rgba(19,26,36,.3)}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(19,26,36,.15);margin:0 auto 10px}
.orb{width:120px;height:120px;margin:6px auto 4px;position:relative}
.sheet h3{font-size:24px;font-weight:500;letter-spacing:-.02em;text-align:center}
.qs{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.q{min-height:48px;border-radius:16px;background:rgba(19,26,36,.05);text-align:left;padding:12px 16px;font-size:15.5px;line-height:1.35}
.answer{font-size:18px;line-height:1.45;letter-spacing:-.01em;margin-top:14px;min-height:0}
.answer b{font-weight:500}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.sum div{font-size:13px;color:var(--ink2)} .sum b{display:block;font-size:28px;font-weight:400;color:var(--ink);letter-spacing:-.03em}
.sheet .wide{width:100%;height:56px;border-radius:28px;margin-top:20px;font-size:16px}
.week{display:flex;justify-content:space-between;align-items:flex-end;height:120px;margin:18px 4px 6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink2);width:30px}
.week i{width:12px;border-radius:6px;transform-origin:50% 100%;background-image:radial-gradient(circle,var(--acc) 1.3px,transparent 1.7px);background-size:6px 5px;background-position:0 100%}
.week div.now i{background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.5px)}
.sheet-p{font-size:16px;line-height:1.45;color:var(--ink2);margin-top:12px;text-align:center}
button.tile{font:inherit;color:inherit;display:block;width:100%;transition:transform .12s}
button.tile:active{transform:scale(.97)}
.scrim{position:absolute;inset:0;z-index:34;visibility:hidden;background:rgba(19,26,36,.12)}
.fps{position:absolute;right:8px;top:calc(var(--s-top) + 4px);z-index:99;font:12px ui-monospace,monospace;background:#000c;color:#fff;padding:2px 6px;border-radius:6px;display:none}
@media (prefers-reduced-motion:reduce){.wx{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="sky" id="sky"></div>
  <div class="grain" id="grain"></div>

  <!-- TODAY -->
  <section class="screen" id="today" aria-label="Today">
    <div class="t-top">
      <div>
        <div class="date" data-t="date"></div>
        <button class="wxline" id="wxBtn" aria-label="Change weather"><svg class="wxdots" viewBox="0 0 16 16" id="wxIcon"></svg><span id="wxText"></span></button>
      </div>
      <div class="avatar">O</div>
    </div>
    <div class="hero">
      <div class="hero-lab" data-t="ready"></div>
      <div class="hero-num num" id="heroNum" aria-label="78"></div>
      <div class="hero-line" data-t="heroLine"></div>
    </div>
    <div class="coach" id="coach">
      <div class="coach-who"><span class="cdot"></span><span data-t="coach"></span></div>
      <div class="coach-msg" id="coachMsg"></div>
      <div class="coach-act" id="coachAct"></div>
    </div>
    <div class="tiles">
      <div class="tile train" id="trainTile">
        <div class="tile-lab" data-t="training"></div>
        <div class="tile-big" data-t="pushDay"></div>
        <div class="tile-sub" data-t="pushSub"></div>
        <div class="train-time"><span class="num" id="trainTime"></span><span id="trainState" data-t="today"></span></div>
        <button class="start" id="startBtn"><span id="startLab" data-t="start"></span></button>
      </div>
      <div class="tile food" id="foodTile">
        <div class="tile-lab" data-t="protein"></div>
        <div class="tile-big"><span class="num" id="protNum"></span><span style="font-size:15px;color:var(--ink2)"> g</span></div>
        <div class="tile-sub" id="foodSub" data-t="of150"></div>
        <button class="addskyr" id="skyrBtn" data-t="addSkyr"></button>
        <div class="jar"><div class="jar-fill" id="jarFill"></div></div>
      </div>
      <button class="tile" id="sleepTile">
        <div class="tile-lab" data-t="sleep"></div>
        <div class="tile-big" data-t="sleepVal"></div>
        <div class="tile-sub" data-t="sleepSub"></div>
      </button>
    </div>
    <button class="ask" id="askBtn" style="margin-top:14px"><span data-t="ask"></span><span class="mic"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg></span></button>
  </section>

  <!-- WORKOUT -->
  <section class="screen" id="workout" aria-label="Workout">
    <div class="w-top">
      <button class="back" id="backBtn"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 3.5 5.5 9l5.5 5.5"/></svg><span data-t="todayBack"></span></button>
      <div class="clock"><span data-t="pushDay"></span> · <span class="num" id="clock">24:10</span></div>
    </div>
    <div class="ex">
      <div class="ex-name" data-t="bench"></div>
      <div class="ex-meta"><span id="setOf"></span><span class="pips" id="pips"></span></div>
    </div>
    <div class="stage" id="stage">
      <div class="lift" id="lift">
        <div class="row">
          <button class="step" id="wMinus" aria-label="−2.5 kg">−</button>
          <div class="val"><span class="num w-num" id="wNum"></span><span class="unit">kg</span></div>
          <button class="step" id="wPlus" aria-label="+2.5 kg">+</button>
        </div>
        <div class="by"></div>
        <div class="row">
          <button class="step" id="rMinus" aria-label="−1">−</button>
          <div class="val"><span class="num r-num" id="rNum"></span><span class="unit" data-t="reps"></span></div>
          <button class="step" id="rPlus" aria-label="+1">+</button>
        </div>
        <div class="hint"><span class="chip" id="chip"><span class="lab" id="chipLab"></span></span></div>
      </div>
      <div class="rest" id="rest">
        <div class="sphere" id="sphere"><div class="sph" id="sph"></div>
          <div class="cd"><span class="num cd-num" id="cdNum"></span><span class="cd-lab" data-t="rest"></span></div>
        </div>
        <div class="next" id="nextLab"></div>
        <div class="rest-ctl">
          <button class="btn" id="minus15">−15 s</button>
          <button class="btn skip" id="skipBtn" data-t="skip"></button>
          <button class="btn" id="plus15">+15 s</button>
        </div>
      </div>
    </div>
    <div class="w-foot">
      <div class="sets" id="sets"></div>
      <button class="log" id="logBtn"><span class="fill" id="logFill"></span><span id="logLab" data-t="logSet"></span></button>
    </div>
    <div class="dune" id="dune"><svg viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="sandp" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.6" r=".95" fill="var(--wx)" opacity=".75"/><circle cx="3.9" cy="4.1" r=".7" fill="var(--wx)" opacity=".5"/></pattern>
      <linearGradient id="duneg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--dune)" stop-opacity=".0"/><stop offset=".08" stop-color="var(--dune)" stop-opacity=".6"/><stop offset="1" stop-color="var(--dune)" stop-opacity=".8"/></linearGradient></defs>
      <path d="M0 22 C60 6 120 4 190 14 S320 30 400 10 V400 H0Z" fill="url(#duneg)"/>
      <path d="M0 22 C60 6 120 4 190 14 S320 30 400 10 V400 H0Z" fill="url(#sandp)"/>
    </svg></div>
  </section>

  <div class="veil" id="veil"></div>
  <div class="prbox" id="prbox">
    <div class="coin" id="coin"><div class="shine" id="shine"></div><div class="coin-in"><span class="coin-num num" id="coinNum"></span><span class="coin-u" data-t="e1rm"></span></div></div>
    <div class="prtext" id="prtext"><h2 data-t="newBest"></h2><p id="prP"></p><button class="btn pri" id="prOk" data-t="keepGoing"></button></div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="askSheet" role="dialog" aria-modal="true">
    <div class="grab"></div>

/* ---------- Workout ---------- */
const lastFor=i=>[{w:75,r:8},{w:80,r:6},{w:80,r:6},{w:80,r:5}][i]||{w:80,r:5};
function renderSets(){
  $('sets').innerHTML=W.sets.map((s,i)=>`<span class="set${s.pr?' pr':''}" data-i="${i}">${i+1} · <b>${fmt(s.w)}×${s.r}</b></span>`).join('');
  const n=W.sets.length;

  $('setOf').textContent=t('setOf',{a:Math.min(n+1,W.total)});
}
let chipState='';
function renderChip(force){
  const n=W.sets.length,e=e1(W.w,W.r),best=Math.max(BEST,...W.sets.map(s=>e1(s.w,s.r)));

    if(e1(W.w,r)>best+.01&&r-W.r<=2){st='beat'+r;txt=t('beat',{n:r})}

  const c=$('chip');c.classList.toggle('hot',st==='hot');$('chipLab').textContent=txt;swapIn($('chipLab'));

function stepW(d){if(resting)return;const v=Math.max(20,Math.min(300,W.w+d));if(v===W.w)return;W.w=v;setNum($('wNum'),fmt(v),{dur:460,stagger:50});renderChip()}
function stepR(d){if(resting)return;const v=Math.max(1,Math.min(30,W.r+d));if(v===W.r)return;W.r=v;setNum($('rNum'),String(v),{dur:420,stagger:40});renderChip()}
function duneH(){return 26+W.sets.reduce((a,s)=>a+s.w*s.r,0)/48}
let duneY=0;
function setDune(animate){
  const h=duneH(),y=-(h-26);const from=duneY;duneY=y;const d=$('dune');
  d.style.transform=`translateY(${y}px)`;
  if(animate)anim(d,[{transform:`translateY(${from}px)`},{transform:`translateY(${y}px)`}],SP.soft);
}
function dunePts(n){const d=$('dune').getBoundingClientRect(),app=$('app').getBoundingClientRect();const o=[];
  for(let i=0;i<n;i++){const x=R(0,d.width),u=x/d.width;const top=22-16*Math.sin(u*Math.PI*1.1)*.6;o.push({x:d.left-app.left+x,y:d.top-app.top+top*(d.height/400)+duneY*0+R(-2,6)})}return o}

function openWorkout(){
  if(screen==='workout')return;screen='workout';
  const td=$('today'),wk=$('workout'),tile=$('trainTile').getBoundingClientRect(),app=$('app').getBoundingClientRect();
  wk.style.visibility='visible';
  anim(td,[{opacity:1,transform:'none'},{opacity:0,transform:'scale(.96)'}],{duration:260,easing:'ease-in',fill:'forwards'}).onfinish=function(){td.style.visibility='hidden';this.cancel()};
  const from=`inset(${tile.top-app.top}px ${app.right-tile.right}px ${app.bottom-tile.bottom}px ${tile.left-app.left}px round 22px)`;wk._from=from;

  [...wk.children].forEach((c,i)=>{if(c.id!=='dune')anim(c,[{opacity:0,transform:'translateY(16px) scale(.98)'},{opacity:1,transform:'none'}],{duration:360,delay:80+i*35,easing:EO,fill:'backwards'})});

function renderTrainTile(){

function logSet(){

  const s={w:W.w,r:W.r},best=Math.max(BEST,...W.sets.map(x=>e1(x.w,x.r)));s.pr=e1(s.w,s.r)>best+.01;s.prev=best;

/* ---------- rest: a sphere of particles that sheds itself as time runs out ---------- */
const SR=112;const sphDots=makeSphere($('sph'),300,SR,2.7);
sphDots.sort((a,b)=>a.r-b.r);
const ring=sphDots.filter(d=>d.r>.9),inner=sphDots.filter(d=>d.r<=.9);
let R0=0,REnd=0,tick=null,shed=0,breath=null,lastCd='',restShown=false;
function startRest(delay,set){
  resting=true;R0=Date.now();REnd=R0+REST*1000;shed=0;lastCd='';
  const rest=$('rest');
  setTimeout(()=>{
    if(set.pr){prMoment(set);return}
    showSphere();
  },Math.max(0,delay));
  if(tick)clearInterval(tick);tick=setInterval(restTick,200);

function showSphere(){

  const rest=$('rest');rest.style.visibility='visible';
  formSphere(sphDots,SR,950);shed=0;syncShed(false);
  anim(rest,[{opacity:0},{opacity:1}],{duration:300,fill:'backwards'});
  anim($('cdNum').parentElement,[{opacity:0,transform:'scale(.92)'},{opacity:1,transform:'none'}],{...SP.soft,delay:350,fill:'backwards'});
  [...rest.querySelectorAll('.next,.rest-ctl')].forEach((e,i)=>anim(e,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{...SP.soft,delay:420+i*60,fill:'backwards'}));
  if(breath)breath.cancel();

  setWind(.7);

}
function remain(){return Math.max(0,REnd-Date.now())}
function restTick(){
  const ms=remain(),s=Math.ceil(ms/1000);
  const txt=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(txt!==lastCd){const el=$('cdNum'),old=el._t;build(el,txt);
    if(old&&old.length===txt.length)[...el.children].forEach((c,i)=>{if(old[i]!==txt[i])anim(c,[{transform:'translateY(.32em)',opacity:0,filter:'blur(2px)'},{transform:'none',opacity:1,filter:'blur(0)'}],{duration:280,easing:EO})});
    el.classList.toggle('soon',s<=10);el.style.color=s<=10?'var(--acc)':'';lastCd=txt}
  if($('rest').style.visibility==='visible')syncShed(true);
  if(ms<=0)endRest();
}
/* interior dots leave first, so the sphere thins to a ring for the last ten seconds */
function syncShed(animate){
  const total=REnd-R0,el=Date.now()-R0,usable=Math.max(1,total-10000);
  const target=Math.round(inner.length*Math.min(1,Math.max(0,el/usable)));
  if(target>shed){for(let i=shed;i<target;i++){const d=inner[i];d.gone=true;d.el.style.opacity=0;if(!animate)continue;
      if(d.el._a)d.el._a.cancel();const ox=d.x*R(.5,1)+R(10,40),oy=d.y*R(.3,.8)-R(30,70);
      d.el._a=d.el.animate([{transform:`translate(${d.x}px,${d.y}px) scale(${d.sc})`,opacity:d.op},{transform:`translate(${d.x+ox}px,${d.y+oy}px) scale(${d.sc*.5})`,opacity:0}],{duration:R(1500,2300),delay:R(0,500),easing:'cubic-bezier(.25,.6,.3,1)',fill:'backwards'})}}
  else if(target<shed){for(let i=shed-1;i>=target;i--){const d=inner[i];d.gone=false;d.el.style.opacity=d.op;if(!animate)continue;
      if(d.el._a)d.el._a.cancel();
      d.el._a=d.el.animate([{transform:`translate(${d.x*1.6+R(-20,20)}px,${d.y*1.6+R(-20,20)}px) scale(${d.sc*.5})`,opacity:0},{transform:`translate(${d.x}px,${d.y}px) scale(${d.sc})`,opacity:d.op}],{duration:700,delay:R(0,200),easing:EO,fill:'backwards'})}}

function addRest(ms){if(!resting)return;REnd=Math.max(Date.now(),REnd+ms);restTick()}
function endRest(){
  if(!resting)return;resting=false;restShown=false;clearInterval(tick);tick=null;
  const rest=$('rest'),app=$('app').getBoundingClientRect();

  setNum($('rNum'),String(W.r),{force:true,plain:away,from:src?src.slice(half):null,dur:760,stagger:100});

/* ---------- a new record: the dune lifts in a gust and gathers into a medal that turns ---------- */
function prMoment(s){
  s.pr=true;W.prs++;
  const box=$('prbox'),coin=$('coin'),veil=$('veil'),app=$('app').getBoundingClientRect();
  const ne=e1(s.w,s.r);build($('coinNum'),fmt(Math.round(ne*10)/10));

      renderSets();if(chip){const c=$('sets').lastElementChild;anim(c,[{transform:'scale(1.25)'},{transform:'none'}],SP.bounce)}
      if(resting)showSphere();};
  };
}

// touch: a few grains lift from wherever a finger lands on the field
$('app').addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;const app=$('app').getBoundingClientRect();
  const x=e.clientX-app.left,y=e.clientY-app.top,s=[],d=[];
  for(let i=0;i<22;i++){const a=R(0,6.28),r=R(2,8);s.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r});const r2=R(26,60);d.push({x:x+Math.cos(a)*r2+12,y:y+Math.sin(a)*r2-18})}
  fly(s,d,{dur:800,stagger:0,jit:80,size:2.2,color:'var(--wx)',spread:10,wind:[10,-10]});
});
setInterval(()=>{const s=Math.floor((Date.now()-W.start)/1000);if(screen==='workout'&&!W.done)build($('clock'),`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`)},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&resting)restTick()});
if(Q.has('fps')){const f=$('fps');f.style.display='block';let n=0,t0=performance.now();(function loop(t){n++;if(t-t0>=500){f.textContent=Math.round(n*1000/(t-t0))+' fps';n=0;t0=t}requestAnimationFrame(loop)})(performance.now())}

/* ---------- start: the morning number forms out of the weather ---------- */
const startWx=WX.includes(Q.get('wx'))?Q.get('wx'):'snow';
setWeather(startWx,true);renderCoach();
build($('trainTime'),'17:00');build($('protNum'),'92');setJar(92,false);
build($('wNum'),fmt(W.w));build($('rNum'),String(W.r));renderSets();renderChip(true);setDune(false);
build($('heroNum'),'78');
const go=()=>{
  if(Q.get('screen')==='workout'){openWorkout();return}
  const h=$('heroNum'),r=h.getBoundingClientRect(),app=$('app').getBoundingClientRect();
  const dst=[...h.children].flatMap(c=>glyphPts(c,stepFor(h)));
  const src=dst.map(()=>({x:R(-20,app.width+20),y:R(-30,r.bottom-app.top+40)}));
  [...h.children].forEach(c=>c.style.opacity=0);
  const land=fly(src,dst,{dur:1500,stagger:260,jit:200,wind:[40,30],spread:50,size:stepFor(h)*.95,fromOp:0});
  [...h.children].forEach(c=>{c.style.opacity='';c._f=c.animate([{opacity:0},{opacity:1}],{duration:380,delay:land-160,fill:'backwards',easing:'ease-out'})});
  [...document.querySelectorAll('#today .hero-line,#today .coach,#today .tiles,#today .ask')].forEach((e,i)=>anim(e,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{...SP.soft,delay:500+i*90,fill:'backwards'}));
};
document.fonts.load('300 150px Geist').then(()=>document.fonts.ready).then(()=>{
  // re-measure once the real font is in
  build($('heroNum'),'78');build($('wNum'),fmt(W.w));build($('rNum'),String(W.r));requestAnimationFrame(go);
}).catch(()=>requestAnimationFrame(go));
window.__drift={W,logSet,endRest,addRest,setWeather,openWorkout};
})();
</script>
