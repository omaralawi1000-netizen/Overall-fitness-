<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aven Window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a real photo lit by the real sun, moon and weather over Copenhagen fills the screen; each area (Today, Train,
   Fuel, Health, Coach) is its own screen of frosted glass over it, and the workout happens inside the same photo.
   1rem = 10 design px on a 430 x 932 phone. */
:root{
  --bg:#05070b; --ink:#f4f1ec; --ink2:rgba(244,241,236,.72); --ink3:rgba(244,241,236,.46); --line:rgba(244,241,236,.13);
  --ember:#ff8d55; --teal:#46d0c2; --gold:#f2c46a; --sky:#9cc4ff; --mint:#7fe0c0; --amber:#ffbf72; --lilac:#c9b8ff;
  --accent:#efe6da; --accentInk:#15120e; --ground:#06080c; --rimA:135deg; --rimC:255,255,255;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --se:cubic-bezier(.2,.9,.25,1); --sd:420ms;
  color-scheme:dark;
}
html{font-size:calc(100vw/43);height:100%;background:var(--bg)}
@media (min-aspect-ratio:3/4){html{font-size:min(10px,calc((100dvh - 32px)/93.2))}}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible{outline:.2rem solid rgba(244,241,236,.9);outline-offset:.2rem}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#0c1016,#020304)}
#phone{position:relative;width:43rem;height:100%;overflow:hidden;background:var(--ground);isolation:isolate;transition:background-color 1.2s ease}
@media (min-aspect-ratio:3/4){#phone{height:93.2rem;border-radius:5.6rem;box-shadow:0 0 0 .2rem #1a1f27,0 4rem 12rem rgba(0,0,0,.7)}}
.tab{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.k{font-size:1.2rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--ink2)}

/* glass: one recipe, frosted from the first frame, its rim lit on the side facing the sun (or the moon) */
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(2.4rem) saturate(1.45) brightness(1.03);backdrop-filter:blur(2.4rem) saturate(1.45) brightness(1.03);
  box-shadow:0 1rem 3rem rgba(0,0,0,.2)}
.glass::after,.tint::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:.1rem;pointer-events:none;
  background:linear-gradient(var(--rimA),rgba(var(--rimC),.05) 15%,rgba(var(--rimC),.05) 45%,rgba(var(--rimC),.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tint{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05))}
.card{border-radius:3rem;padding:2rem 2rem 1.8rem}

/* ---------- the window ---------- */
#sceneW{position:absolute;inset:0;z-index:0;overflow:hidden}
#scene{position:absolute;left:0;top:0;width:43rem;height:93.2rem;display:block;transform-origin:50% 62%;transition:transform 900ms var(--se)}
#phone[data-tab="train"] #scene{transform:scale(1.05)}
#phone[data-tab="fuel"] #scene,#phone[data-tab="health"] #scene,#phone[data-tab="coach"] #scene{transform:scale(1.08)}
.lay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s ease;z-index:1}
#dim{background:linear-gradient(180deg,rgba(4,6,10,.35),rgba(4,6,10,.72));opacity:0;z-index:1;pointer-events:none;position:absolute;inset:0;transition:opacity .5s ease}
#phone:not([data-tab="today"]) #dim{opacity:0!important}
#tTrain{background:radial-gradient(120% 70% at 50% 110%,rgba(255,110,60,.42),rgba(90,26,12,.36) 55%,rgba(10,6,8,.5))}
#tFuel{background:radial-gradient(120% 75% at 50% 105%,rgba(255,170,90,.4),rgba(110,60,20,.38) 55%,rgba(14,10,8,.55))}
#tHealth{background:linear-gradient(180deg,rgba(6,12,24,.45),rgba(6,14,28,.72))}
#tH0{background:radial-gradient(90% 60% at 50% 30%,rgba(110,150,255,.32),transparent 70%)}
#tH1{background:radial-gradient(90% 60% at 50% 30%,rgba(90,220,170,.28),transparent 70%)}
#tH2{background:radial-gradient(90% 60% at 50% 30%,rgba(255,180,90,.3),transparent 70%)}
#tCoach{background:linear-gradient(180deg,rgba(8,8,18,.5),rgba(10,8,22,.78))}
#light{position:absolute;left:-30%;right:-30%;bottom:-40%;height:120%;z-index:1;pointer-events:none;opacity:0;transform:translate3d(0,45%,0);
  background:radial-gradient(50% 45% at 50% 70%,rgba(255,190,170,.55),rgba(190,150,255,.38) 45%,rgba(120,110,255,.12) 70%,transparent 78%);
  transition:transform 1.4s cubic-bezier(.2,.8,.2,1),opacity 1s ease;will-change:transform}
#phone[data-tab="train"] #tTrain,#phone[data-tab="fuel"] #tFuel,#phone[data-tab="health"] #tHealth,#phone[data-tab="coach"] #tCoach{opacity:1}
#phone:not([data-tab="health"]) #tH0,#phone:not([data-tab="health"]) #tH1,#phone:not([data-tab="health"]) #tH2{opacity:0!important}
#phone[data-tab="coach"] #light{opacity:1;transform:none}
#tEmber{background:linear-gradient(180deg,rgba(255,112,64,.22),rgba(150,38,20,.55) 55%,rgba(30,7,7,.94));z-index:2}
#tTeal{background:linear-gradient(180deg,rgba(30,150,150,.42),rgba(8,70,76,.78) 55%,rgba(4,26,30,.96));z-index:2}
#level{position:absolute;left:0;right:0;bottom:0;height:100%;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s ease;
  background:linear-gradient(180deg,rgba(110,235,220,.34),rgba(60,190,180,.16) 8rem,rgba(40,160,150,.10));transform:translate3d(0,100%,0);will-change:transform}
#level::before{content:'';position:absolute;left:0;right:0;top:0;height:.15rem;background:rgba(180,255,245,.7);box-shadow:0 0 1.6rem rgba(120,255,240,.6)}
#phone[data-v="train"] #tEmber,#phone[data-v="rest"] #tTeal,#phone[data-v="rest"] #level,#phone[data-v="done"] #tEmber{opacity:1}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;z-index:3;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;visibility:hidden;pointer-events:none;
  padding:0 1.6rem calc(env(safe-area-inset-bottom,0px) + 13rem)}
.scr::-webkit-scrollbar{display:none}
.scr.on{visibility:visible;pointer-events:auto}
#phone:not([data-v="today"]) .scr{pointer-events:none}
.rise{will-change:transform}
.title{padding-top:calc(env(safe-area-inset-top,0px) + 8.6rem)}
.title h1{margin:.6rem 0 0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:6.4rem;line-height:.96;letter-spacing:-.005em}
.title p{margin:1rem 0 0;font-size:1.6rem;line-height:1.4;color:var(--ink2);max-width:36rem}
.sp{height:1.4rem}

/* Today */

.hero{position:relative;height:calc(env(safe-area-inset-top,0px) + 76rem);margin:0 -1.6rem}
.hdr{position:absolute;left:2rem;right:2rem;top:calc(env(safe-area-inset-top,0px) + 1.6rem);height:5.2rem;display:flex;align-items:center;justify-content:space-between}
.circ{width:5.2rem;height:5.2rem;border-radius:50%;display:grid;place-items:center;flex:none}
.circ svg{width:2.2rem;height:2.2rem;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.85rem;font-weight:500;letter-spacing:.36em;padding-left:.36em}
.wxp{height:5.2rem;border-radius:2.6rem;padding:0 1.6rem 0 1.3rem;display:flex;align-items:center;gap:.8rem;font-size:1.45rem}
.wxp svg{width:2rem;height:2rem;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wxp b{font-weight:500}
#arc{position:absolute;left:0;top:calc(env(safe-area-inset-top,0px) + 8.4rem);width:43rem;height:30rem;overflow:visible;touch-action:pan-y;cursor:grab}
#dockFade{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 13rem);z-index:8;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(4,6,10,.5) 55%,rgba(4,6,10,.66));
  -webkit-backdrop-filter:blur(1.4rem);backdrop-filter:blur(1.4rem);-webkit-mask-image:linear-gradient(180deg,transparent,#000 45%);mask-image:linear-gradient(180deg,transparent,#000 45%)}
#phone:not([data-v="today"]) #dockFade,#phone[data-tab="coach"] #dockFade{opacity:0}
#rec .tap{margin-top:2.6rem;font-size:1.25rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
#phone.recOn #toast{transform:translate3d(-50%,24rem,0)!important}
.clock{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 25.4rem);text-align:center;pointer-events:none}
#arcHint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 21.2rem);text-align:center;font-size:1.2rem;color:var(--ink2);letter-spacing:.02em;pointer-events:none;transition:opacity .6s ease}
.clock::before{content:'';position:absolute;left:50%;top:50%;width:32rem;height:15rem;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(4,6,12,var(--cv,.12)),rgba(4,6,12,calc(var(--cv,.12) * .4)) 45%,transparent 75%);z-index:-1}
#kick,#rk,#arcHint{text-shadow:0 0 1rem rgba(0,0,0,.45),0 0 .3rem rgba(0,0,0,.25)}
#big{font-size:6rem;line-height:1;font-weight:200;letter-spacing:-.045em;white-space:nowrap}
#big .u{font-size:.4em;letter-spacing:-.01em;margin:0 .1em 0 .04em;opacity:.82;font-weight:300}
#kick{margin-top:.5rem;font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:rgba(244,241,236,.86)}
/* readiness: one word that fills with light as far as you are ready */
.ready{position:absolute;left:1.6rem;right:1.6rem;top:calc(env(safe-area-inset-top,0px) + 40.2rem);text-align:center}
#rk{font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:rgba(244,241,236,.86)}
#rk b{font-weight:500;color:var(--ink);margin-left:.5rem}
.rw{position:relative;display:inline-block;margin-top:.4rem;font-family:var(--serif);font-style:italic;font-size:10.4rem;line-height:1.04;letter-spacing:-.012em;white-space:nowrap;padding:0 .12em}
.rw .dim{color:rgba(244,241,236,.2)}
.ready.moon .lit{color:rgba(205,218,245,.7)}
/* the light fills the letters with a soft edge, like a level of light, never a hard cut through a letter */
@property --f{syntax:'<percentage>';inherits:false;initial-value:0%}
.rw .lit{position:absolute;inset:0;padding:0 .12em;color:color-mix(in srgb,var(--accent) 45%,#fff);--f:0%;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(var(--f) - 9%),transparent calc(var(--f) + 9%));mask-image:linear-gradient(90deg,#000 calc(var(--f) - 9%),transparent calc(var(--f) + 9%))}
.rc{display:flex;justify-content:center;gap:1.6rem;flex-wrap:wrap;margin-top:1rem;font-size:1.35rem;color:var(--ink2)}
.rc span{display:inline-flex;align-items:center;gap:.6rem}
.rc i{width:.7rem;height:.7rem;border-radius:50%}
.mom{position:absolute;left:2rem;right:2rem;top:calc(env(safe-area-inset-top,0px) + 57.2rem);text-align:center}#arc:active{cursor:grabbing}
#arcT{font-size:12px;font-weight:500;letter-spacing:.06em}
#coach{margin:0 auto;max-width:34rem;font-size:2.1rem;line-height:1.2;color:rgba(244,241,236,.78);min-height:5rem;text-wrap:balance}
#coach .chip2,.chip2{display:inline-block;margin-top:.8rem;font-style:normal;font-family:var(--sans);font-size:1.3rem;font-weight:500;letter-spacing:.02em;color:var(--ink);background:rgba(255,255,255,.14);padding:.25rem .9rem .35rem;border-radius:1.2rem;white-space:nowrap}
.swap span{display:inline-block;transition:opacity .26s ease,transform .26s var(--se)}
.swap.out span{opacity:0;transform:translate3d(0,.5rem,0)}
.cta{margin-top:2rem;display:flex;justify-content:center}
.prim{height:5.6rem;padding:0 3rem;border-radius:2.8rem;background:var(--accent);color:var(--accentInk);font-size:1.8rem;font-weight:500;letter-spacing:-.005em;display:inline-flex;align-items:center;gap:1rem;
  transition:transform .18s var(--se),background-color 1.2s ease;box-shadow:0 1.2rem 4rem rgba(0,0,0,.3);position:relative}
.prim:active{transform:scale(.96)}
.prim svg{width:1.5rem;height:1.5rem;fill:currentColor}
.prim small{font-size:1.4rem;font-weight:400;opacity:.6}
.ch3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
.ch3 .serif{font-size:2.4rem}
.row{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;padding:1.4rem 0;border-top:.06rem solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .n{font-size:1.75rem;letter-spacing:-.01em}
.row .d{font-size:1.35rem;color:var(--ink3);margin-top:.3rem}
.row .r{font-size:1.65rem;text-align:right;font-variant-numeric:tabular-nums}
.row .r small{display:block;font-size:1.2rem;color:var(--ember);margin-top:.3rem}
.lvl{height:.6rem;border-radius:.3rem;background:rgba(244,241,236,.12);overflow:hidden;margin:.6rem 0 0}
.lvl i{display:block;height:100%;width:100%;border-radius:.3rem;transform-origin:0 50%;transition:transform .8s var(--se)}
.chips{display:flex;flex-wrap:wrap;gap:.8rem}
.chip{height:4.4rem;padding:0 1.6rem;border-radius:2.2rem;background:rgba(255,255,255,.1);font-size:1.55rem;display:inline-flex;align-items:center;gap:.7rem;transition:transform .16s var(--se),background-color .2s;white-space:nowrap}
.chip:active{transform:scale(.95);background:rgba(255,255,255,.18)}
.chip small{color:var(--ink2);font-size:1.3rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.6rem;margin-top:1.2rem}
.day{text-align:center;font-size:1.25rem;color:var(--ink3)}
.day .b{height:8rem;margin:.8rem auto 0;width:100%;max-width:3.4rem;border-radius:1.7rem;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.day .b i{position:absolute;left:0;right:0;bottom:0;height:100%;border-radius:1.7rem;transform-origin:50% 100%;transform:scaleY(0)}
.day.now{color:var(--ink)}
.day.now .b{box-shadow:0 0 0 .12rem var(--ember)}
.day .t{margin-top:.7rem;font-size:1.2rem;letter-spacing:.02em;white-space:nowrap}
.mems{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1rem}
.mem{font-size:1.35rem;padding:.7rem 1.2rem;border-radius:1.6rem;background:rgba(255,255,255,.08);color:var(--ink)}

/* dock */
#dock{position:absolute;left:1.8rem;right:1.8rem;bottom:calc(env(safe-area-inset-bottom,0px) + 2.2rem);height:6.6rem;display:flex;gap:1.2rem;z-index:9;transition:transform var(--sd) var(--se)}
.tabs{position:relative;flex:1;border-radius:3.3rem;display:flex;padding:.5rem}
#ind{position:absolute;top:.5rem;bottom:.5rem;left:.5rem;width:calc((100% - 1rem)/4);border-radius:2.8rem;background:rgba(255,255,255,.14);box-shadow:inset 0 .06rem 0 rgba(255,255,255,.22);transition:transform var(--sd) var(--se)}
.tb{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;font-size:1.25rem;color:var(--ink3);transition:color .3s}
.tb svg{width:2.4rem;height:2.4rem;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--ink)}
#askB{width:6.6rem;height:6.6rem;border-radius:50%;display:grid;place-items:center;flex:none}
#askB svg{width:2.6rem;height:2.6rem;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#askB .dot{position:absolute;top:1rem;right:1rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .3rem rgba(6,8,11,.4);transition:background-color 1.2s}
#phone:not([data-v="today"]) #dock{transform:translate3d(0,14rem,0)}
#phone[data-tab="coach"] #dock{transform:translate3d(0,14rem,0)}
#live{position:absolute;left:1.8rem;right:1.8rem;bottom:calc(env(safe-area-inset-bottom,0px) + 10rem);height:5.6rem;border-radius:2.8rem;display:flex;align-items:center;gap:1.2rem;padding:0 2rem 0 1.6rem;z-index:8;text-align:left;
  transform:translate3d(0,24rem,0);transition:transform var(--sd) var(--se)}
#live.on{transform:none}
#phone:not([data-v="today"]) #live,#phone[data-tab="coach"] #live{transform:translate3d(0,24rem,0)}
#live .pd{width:1rem;height:1rem;border-radius:50%;background:var(--ember);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,141,85,.6)}70%{box-shadow:0 0 0 1rem rgba(255,141,85,0)}100%{box-shadow:0 0 0 0 rgba(255,141,85,0)}}
#live .lt{flex:1;font-size:1.5rem}
#live .lt small{display:block;font-size:1.2rem;color:var(--ink2);margin-top:.1rem}
#live .lc{font-size:1.6rem}

/* Train */
.exc{border-radius:2.8rem;padding:1.8rem 2rem;width:100%;text-align:left;display:block;clip-path:inset(0 round 2.8rem)}
.exc .top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.exc .nm{font-family:var(--serif);font-style:italic;font-size:2.8rem;line-height:1.05}
.exc .w{font-size:1.9rem;font-weight:300;letter-spacing:-.02em;white-space:nowrap}
.exc .w small{font-size:1.2rem;color:var(--ink2);margin-left:.2rem}
.exc .meta{margin-top:.6rem;font-size:1.35rem;color:var(--ink2);display:flex;gap:1.4rem}
.exc .dots{display:flex;gap:.5rem;margin-top:1.2rem}
.exc .dots i{width:1rem;height:1rem;border-radius:50%;background:rgba(244,241,236,.22)}
.exc .more{display:none;margin-top:1.4rem;border-top:.06rem solid var(--line);padding-top:1.2rem}
.exc.open .more{display:block}
.exc .sx{display:flex;justify-content:space-between;font-size:1.5rem;padding:.55rem 0;color:var(--ink)}
.exc .sx span:first-child{color:var(--ink3)}
.spark{width:100%;height:6rem;display:block;margin-top:1rem;overflow:visible}
.exc .cl{margin-top:1rem;font-family:var(--serif);font-style:italic;font-size:1.9rem;line-height:1.2;color:rgba(244,241,236,.86)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;margin-top:1rem}
.wk div{text-align:center;padding:1rem .2rem;border-radius:1.6rem;font-size:1.2rem;color:var(--ink2)}
.wk div b{display:block;font-weight:500;color:var(--ink);font-size:1.3rem;margin-bottom:.4rem}
.wk div.now{background:rgba(255,141,85,.18);color:#ffd2bb}
.wk div.dn b::after{content:' ✓';color:var(--mint)}
.bigb{width:100%;height:6.4rem;border-radius:3.2rem;background:var(--accent);color:var(--accentInk);font-size:2rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:2.2rem;transition:transform .18s var(--se),background-color 1.2s;box-shadow:0 1.4rem 4rem rgba(0,0,0,.3)}
.bigb:active{transform:scale(.97)}
.bigb svg{width:1.6rem;height:1.6rem;fill:currentColor}

/* Fuel */
/* the glass fills as you eat: an amber level rises behind the number */
.jar{position:relative;height:30rem;margin-top:2.2rem;border-radius:3.6rem;overflow:hidden;display:grid;place-items:center;text-align:center}
.jar .lv{position:absolute;left:0;right:0;bottom:0;height:100%;transform-origin:50% 100%;transform:scaleY(0);background:linear-gradient(180deg,rgba(255,196,120,.5),rgba(255,150,70,.26) 30%,rgba(255,130,60,.14));will-change:transform}
.jar .lv::before{content:'';position:absolute;left:0;right:0;top:0;height:.16rem;background:rgba(255,226,180,.9);box-shadow:0 0 2rem rgba(255,200,130,.8)}
.jar .in{position:relative}
#fNum{font-size:9.6rem;font-weight:200;letter-spacing:-.05em;line-height:1;white-space:nowrap}
.jar .l1{font-size:1.5rem;color:var(--ink2);margin-top:.4rem}
.jar .l2{font-size:1.3rem;color:var(--ink3);margin-top:.9rem}

#cmp.on{pointer-events:auto}
#cmp .c{opacity:0;transform:translate3d(0,1.6rem,0)}
.ring{position:relative;height:20rem;margin:0 auto}
#cLine{display:block;width:22rem;height:.2rem;border-radius:.1rem;margin:1.6rem auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform-origin:50% 50%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#cKg{font-size:10rem;font-weight:200;letter-spacing:-.05em;line-height:1;white-space:nowrap}
.ring .in small{font-size:1.2rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin-top:.8rem;font-weight:500}
#cmp h2{margin:3rem 0 0;text-align:center;font-family:var(--serif);font-style:italic;font-weight:400;font-size:4.8rem;line-height:1}
.cst{display:flex;justify-content:center;gap:3.6rem;margin-top:2.2rem}
.cst div{text-align:center;font-size:2.6rem;font-weight:300;letter-spacing:-.02em}
.cst small{display:block;font-size:1.2rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:.4rem;font-weight:500}
.medals{display:flex;justify-content:center;gap:1.6rem;margin-top:2.8rem;perspective:60rem}
.md{width:6.4rem;height:6.4rem;border-radius:50%;background:radial-gradient(circle at 38% 30%,#ffeebe,#f2c46a 45%,#b47c24 85%);box-shadow:0 .8rem 2.4rem rgba(242,196,106,.3),inset 0 0 0 .2rem rgba(255,240,200,.55);display:grid;place-items:center;font-size:1.4rem;font-weight:600;color:#4a2f06;transform-style:preserve-3d}
.mdl{font-size:1.25rem;color:var(--ink2);text-align:center;margin-top:.7rem;max-width:8rem;line-height:1.25}
#doneB{position:absolute;left:2rem;right:2rem;bottom:calc(env(safe-area-inset-bottom,0px) + 3rem);height:6.4rem;border-radius:3.2rem;background:var(--ink);color:#0d0b09;font-size:2rem;font-weight:500}

/* rolling digits */
.col{display:inline-block;height:1.08em;line-height:1.08em;overflow:hidden;vertical-align:-.24em}
.strip{display:flex;flex-direction:column;will-change:transform}
.strip i{font-style:normal;display:block;height:1.08em;line-height:1.08em;text-align:center}
.ch{display:inline-block}
.bloom{position:absolute;width:24rem;height:24rem;margin:-12rem 0 0 -12rem;border-radius:50%;pointer-events:none;z-index:45;background:radial-gradient(closest-side,rgba(255,236,210,.55),rgba(255,200,150,.18) 55%,transparent);opacity:0}
#veil{position:absolute;inset:0;z-index:60;background:var(--ground);opacity:.996;transition:opacity .9s ease;pointer-events:none}
#veil.off{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  setTimeout(() => { C.innerHTML = ''; $('#soft').getAnimations().forEach(a => a.cancel()); $('#soft').style.opacity = 0; }, 520);
  setView('today'); pushTo(0, 700); backIn();
  $('#aSess').setAttribute('stroke', '#f2c46a'); $('#aSessG').setAttribute('stroke', '#f2c46a'); $('#aLab').textContent = '15:15 PUSH ✓'; $('#aLab').setAttribute('fill', '#ffe2a8');
  paintCards(); paintCta(); $('#coach').__h = null; paintHero(nowMin()); built.train = false; if (S.tab === 'train') { BUILD.train(); built.train = true; }
  toast(t('savedPush'));
}

/* ================= the morning: the night you slept through runs past ================= */
function morning() {
  const end = nowMin(), start = Math.max(0, Math.min(end - 60, 300)), t0 = performance.now(), ms = 1700; springId++;
  const st = () => { const k = clamp((performance.now() - t0) / ms, 0, 1), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; const m = lerp(start, end, e); placeDot(m); applyLight(m, k === 1); paintHero(k === 1 ? end : Math.round(m / 10) * 10); if (k < 1) requestAnimationFrame(st); };
  requestAnimationFrame(st);
}

/* ================= boot: everything is built and warmed before the first tap ================= */
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (sheetOpen) closeSheet(); else if (sessOpen) closeSess(); else if (S.view === 'train' || S.view === 'rest') minimise(); else if (S.tab !== 'today') show('today'); } });
const nf = () => new Promise(r => requestAnimationFrame(() => r()));
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
async function boot() {
  findSunTimes();
  $$('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  const m = nowMin();
  LIGHT = lightAt(dateAtMin(m));
  buildArc(); placeDot(m); paintCards(); $('#arcHint').textContent = t('arcHint'); if (store.get('arcHint')) $('#arcHint').style.opacity = 0; paintCta(); paintHero(m); paintWx(m);
  ['train', 'fuel', 'health', 'coach'].forEach(k => { BUILD[k](); built[k] = true; });
  try {
    initGL();
    const [ph, mk] = await Promise.all([loadImg('photo.jpg'), loadImg('mask.png')]);
    await Promise.all([ph.decode?.(), mk.decode?.()].filter(Boolean));
    tex(ph, 0); gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE); tex(mk, 1); glReady = true;
  } catch (err) { console.error(err); }
  sizeCanvas(); applyLight(m); draw();
  try { await Promise.race([Promise.all(['200 100px Geist', '300 20px Geist', '400 16px Geist', '500 16px Geist', 'italic 40px "Instrument Serif"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 1800))]); } catch {}
  await warmUp();
  window.addEventListener('resize', () => { sizeCanvas(); render(); });
  $('#veil').classList.add('off'); window.__ready = true;
  // the first open: the rings draw, the numbers count, the week grows
  paintReady(nowMin(), 'draw'); growBars(true);
  const mm = nowMin();
  if (mm > 300 && mm < 660 && store.get('morning') !== new Date().toDateString()) { store.set('morning', new Date().toDateString()); setTimeout(morning, 450); }
  setInterval(() => { if (S.scrub === null && springIdle()) { const n = nowMin(); applyLight(n); placeDot(n); paintHero(n); paintWx(n); } }, 20000);
}
const springIdle = () => true;
// warm-up under the veil. The GPU compiles a shader the first time it meets a new kind of picture (a glass layer that is
// scaled, clipped half-way or faded, blurred text, a 3D turn, a blend), and that is what made first taps stutter. So every
// screen, sheet and in-between state is drawn here once, and every kind of motion is played once for real.
async function warmUp() {
  const quiet = document.createElement('style'); quiet.textContent = '*,*::before,*::after{transition:none!important;animation-play-state:paused!important}'; document.head.append(quiet);
  const warm = document.createElement('style'); document.head.append(warm);
  const FULL = '.scr{visibility:visible!important}.sheet::before,#sessT::before,#tray::before{clip-path:inset(0 round 0)!important}.si,.sT,.tr{opacity:1!important;transform:none!important}#soft{opacity:1!important}#toast{transform:translate3d(-50%,0,0)!important}.stp button{transform:none!important}#medal{opacity:1!important;transform:none!important}#recBg{opacity:.5!important}#recT{opacity:1!important}#level{opacity:1!important}#live{transform:none!important}#askBar,#askX{transform:none!important}#light{opacity:1!important;transform:none!important}.lay{opacity:.4!important}';
  const MID = '.scr{visibility:visible!important}.sheet::before,#sessT::before{clip-path:inset(22% 12% 30% 9% round 2.4rem)!important}#tray::before{clip-path:inset(0 0 45% 0 round 2.6rem)!important}' +
    '.si,.sT,.tr{opacity:.5!important;transform:translate3d(0,1rem,0)!important}#soft{opacity:.45!important}#toast{transform:translate3d(-50%,-1rem,0) scale(.97)!important}' +
    '.stp button{transform:scale(.55)!important}.glass{transform:scale(.97)}.rise{opacity:.5;transform:translate3d(0,2rem,0)}#medal{opacity:.7!important;transform:rotateY(-42deg) scale(.8)!important}#medal .sh{transform:translate3d(-10%,0,0)!important}' +
    '#recBg,#recT{opacity:.5!important}#setB{transform:translate3d(3rem,8rem,0) scale(.3)!important;opacity:.5!important}#logL,.lb{filter:blur(.4rem)!important;opacity:.6!important}' +
    '#level{opacity:.6!important;transform:translate3d(0,40%,0)!important}.lay{opacity:.6!important}#light{opacity:.6!important;transform:translate3d(0,20%,0)!important}#scene{transform:scale(1.04)!important}' +
    '.st{transform:scaleY(.4)}.md{transform:rotateY(70deg) translate3d(0,-.6rem,2rem)}#cmp .c{opacity:.5;transform:translate3d(0,1rem,0)}.exc{clip-path:inset(0 0 30% 0 round 2.8rem)}';
  $$('.sheet').forEach(s => s.classList.add('on')); $('#sessT').classList.add('on'); $('#tray').classList.add('on');
  buildSettings(); buildLog();
  $('#trIn').innerHTML = `<div class="k">${t('coachK')}</div><p>${t('coachP')}</p><div class="r"><button class="use"><span class="lb">${t('use85')}</span></button></div>`;
  $('#cmp').innerHTML = `<div class="ring c"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="122" stroke="var(--gold)" stroke-dasharray="766.5" stroke-dashoffset="300"/></svg></div><div class="medals c"><div class="md">85</div></div>`;
  $('#thread').innerHTML = `<div class="me">.</div><div class="think"><i></i></div><div class="prop glass"><p>.</p><div class="r"><button class="use"><span class="lb">.</span></button></div></div>`;
  W = freshW(); buildSess(); renderSet(true);
  const rehearse = () => {
    const A = (el, kf, o = {}) => el && el.animate(kf, { duration: 140, easing: SP.easing, ...o });
    $$('.glass,.stp button,.exc,.disc').forEach(el => A(el, [{ transform: 'scale(.9)', opacity: .6 }, { transform: 'scale(1.02)', opacity: 1 }, { transform: 'none', opacity: 1 }]));
    $$('.rise').forEach(el => A(el, [{ transform: 'translate3d(0,4rem,0)', opacity: 0 }, { transform: 'none', opacity: 1 }]));
    $$('#logL,.lb,.lg,.swap span').forEach(el => A(el, [{ filter: 'blur(4px)', opacity: .3 }, { filter: 'blur(0)', opacity: 1 }]));

    A($('#medal .sh'), [{ transform: 'translate3d(-80%,0,0)' }, { transform: 'translate3d(80%,0,0)' }]);
    A($('#soft'), [{ opacity: .1 }, { opacity: .9 }]); A($('#recBg'), [{ opacity: .1 }, { opacity: .6 }]);
    A($('#setB'), [{ transform: 'translate3d(4rem,10rem,0) scale(.1)', opacity: .2 }, { transform: 'none', opacity: 1 }]);
    A($('#level'), [{ transform: 'translate3d(0,80%,0)' }, { transform: 'translate3d(0,20%,0)' }]);
    ['.sheet', '#sessT', '#tray'].forEach(s => $$(s).forEach(el => A(el, [{ clipPath: 'inset(40% 30% 40% 30% round 2.4rem)' }, { clipPath: 'inset(0 round 0)' }], { pseudoElement: '::before' })));
    $$('.exc,.prop,#hDet').forEach(el => A(el, [{ clipPath: 'inset(0 0 40% 0 round 2.8rem)' }, { clipPath: 'inset(0 0 0 0 round 2.8rem)' }]));
    $$('.md').forEach(el => A(el, [{ transform: 'rotateY(0)' }, { transform: 'rotateY(180deg) translate3d(0,-.6rem,2rem)' }, { transform: 'rotateY(360deg)' }]));
    $$('circle').forEach(el => A(el, [{ strokeDashoffset: 700 }, { strokeDashoffset: 200 }]));
    $$('.strip').forEach(el => A(el, [{ transform: 'translate3d(0,-10%,0)' }, { transform: 'translate3d(0,-40%,0)' }]));
    $$('.st,.day .b i,.bars7 i').forEach(el => A(el, [{ transform: 'scaleY(0)' }, { transform: 'none' }]));
    $$('#pearl i').forEach(el => A(el, [{ transform: 'scale(0)' }, { transform: 'scale(1.2)' }]));
    $$('#scene').forEach(el => A(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }]));
    $$('#light').forEach(el => A(el, [{ transform: 'translate3d(0,45%,0)', opacity: 0 }, { transform: 'none', opacity: 1 }]));
    $$('.lay').forEach(el => A(el, [{ opacity: 0 }, { opacity: .8 }]));
    bloom($('#cta')); bloom($('#pearl'), 'rgba(255,170,120,.5)');
  };
  for (const [v, tab] of [['today', 'today'], ['today', 'train'], ['today', 'fuel'], ['today', 'health'], ['today', 'coach'], ['train', 'today'], ['rest', 'today'], ['record', 'today'], ['complete', 'today']]) {
    setView(v); phone.dataset.tab = tab; fades(v !== 'today'); restFades(v === 'rest');
    scene.push = v === 'today' ? 0 : 1; draw();
    warm.textContent = FULL; rehearse(); for (let i = 0; i < 10; i++) await nf();
    for (const css of [MID, FULL]) { warm.textContent = css; await nf(); await nf(); await nf(); }
  }
  document.getAnimations().forEach(a => { try { a.finish(); } catch { a.cancel(); } });
  document.getAnimations().forEach(a => a.cancel());
  warm.remove(); $$('.sheet').forEach(s => s.classList.remove('on')); $('#sessT').classList.remove('on'); $('#tray').classList.remove('on');
  $('#trIn').innerHTML = ''; $('#cmp').innerHTML = ''; $('#thread').innerHTML = ''; fades(false); restFades(false);
  W = null; $('#sess').innerHTML = ''; setView('today'); phone.dataset.tab = 'today'; scene.push = 0; draw();
  $$('.scr').forEach(s => s.classList.toggle('on', s.dataset.s === 'today'));

  await nf(); await nf(); quiet.remove();
}
boot();
window.__aven = { S, get W() { return W; }, startWorkout, show, logSet: () => $('#logB').click(), endRest, finish, minimise, morning, scrubTo: m => { placeDot(m); applyLight(m); paintHero(m); paintWx(m); },
  setWx: w => { WXMODE = w; lastAcc = ''; applyLight(nowMin()); paintWx(nowMin()); paintHero(nowMin()); }, nowMin, openSheet, SP };
})();
