<title>Aven Window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a real photo lit by the real sun, moon and weather over Copenhagen fills the screen; each area (Today, Train,
   Fuel, Health, Coach) is its own screen of frosted glass over it, and the workout happens inside the same photo.
   1rem = 10 design px on a 430 x 932 phone. */
:root{
  --bg:#05070b; --ink:#f4f1ec; --ink2:rgba(244,241,236,.72); --ink3:rgba(244,241,236,.6); --line:rgba(244,241,236,.13);
  --ember:#ff8d55; --teal:#46d0c2; --gold:#f2c46a; --sky:#9cc4ff; --mint:#7fe0c0; --amber:#ffbf72; --lilac:#c9b8ff;
  --accent:#efe6da; --accentInk:#15120e; --ground:#06080c; --rimA:135deg; --rimC:255,255,255;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --se:cubic-bezier(.2,.9,.25,1); --sd:420ms;
  color-scheme:dark;
}
html{font-size:calc(100vw/43);height:100%;background:var(--bg)}
@media (min-aspect-ratio:3/4){html{font-size:min(10px,calc((100dvh - 32px)/93.2))}}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible{outline:.2rem solid rgba(244,241,236,.9);outline-offset:.2rem}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#0c1016,#020304)}
#phone{position:relative;width:43rem;height:100%;overflow:hidden;background:var(--ground);isolation:isolate;transition:background-color 1.2s ease}
@media (min-aspect-ratio:3/4){#phone{height:93.2rem;border-radius:5.6rem;box-shadow:0 0 0 .2rem #1a1f27,0 4rem 12rem rgba(0,0,0,.7)}}
.tab{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.k{font-size:1.3rem;letter-spacing:.15em;text-transform:uppercase;font-weight:500;color:var(--ink2)}

/* glass: one recipe, frosted from the first frame, its rim lit on the side facing the sun (or the moon) */
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(2.4rem) saturate(1.45) brightness(1.03);backdrop-filter:blur(2.4rem) saturate(1.45) brightness(1.03);
  box-shadow:0 1rem 3rem rgba(0,0,0,.2)}
.glass::after,.tint::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:.1rem;pointer-events:none;
  background:linear-gradient(var(--rimA),rgba(var(--rimC),.05) 15%,rgba(var(--rimC),.05) 45%,rgba(var(--rimC),.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tint{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05))}
.card{border-radius:3rem;padding:2rem 2rem 1.8rem}

/* ---------- the window ---------- */
#sceneW{position:absolute;inset:0;z-index:0;overflow:hidden}
#scene{position:absolute;left:0;top:0;width:43rem;height:93.2rem;display:block;transform-origin:50% 62%;transition:transform 900ms var(--se)}
#phone[data-tab="train"] #scene{transform:scale(1.05)}
#phone[data-tab="fuel"] #scene,#phone[data-tab="health"] #scene,#phone[data-tab="coach"] #scene{transform:scale(1.08)}
/* rain: two sheets of fine streaks behind the glass, moved by the compositor, only while it rains on Today */
#rainW{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .6s ease;
  -webkit-mask-image:linear-gradient(180deg,#000,#000 56%,transparent 79%);mask-image:linear-gradient(180deg,#000,#000 56%,transparent 79%)}
#rain{position:absolute;left:-20%;top:-6%;width:140%;height:112%;transform:rotate(8deg)}
#rain i{position:absolute;left:0;right:0;top:-51.2rem;bottom:0;background-size:30rem 51.2rem;animation:fall .6s linear infinite paused}
#phone.raining #rain i{will-change:transform} /* only a layer while it rains: dry, it costs no memory */
#rain i+i{animation-duration:1.05s}
@keyframes fall{to{transform:translate3d(0,51.2rem,0)}}
#phone.raining[data-tab="today"][data-v="today"] #rainW{opacity:var(--rainA,.6);transition-duration:1.4s}
#phone.raining[data-tab="today"][data-v="today"] #rain i{animation-play-state:running}
@media (prefers-reduced-motion:reduce){#rain i{animation:none}}
.lay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s ease;z-index:1}
#dim{background:linear-gradient(180deg,rgba(4,6,10,.35),rgba(4,6,10,.72));opacity:0;z-index:1;pointer-events:none;position:absolute;inset:0;transition:opacity .5s ease}
#phone:not([data-tab="today"]) #dim{opacity:0!important}
#tTrain{background:radial-gradient(120% 70% at 50% 110%,rgba(255,110,60,.42),rgba(90,26,12,.36) 55%,rgba(10,6,8,.5))}
#tFuel{background:radial-gradient(120% 75% at 50% 105%,rgba(255,170,90,.4),rgba(110,60,20,.38) 55%,rgba(14,10,8,.55))}
#tHealth{background:linear-gradient(180deg,rgba(6,12,24,.45),rgba(6,14,28,.72))}
#tH0{background:radial-gradient(90% 60% at 50% 30%,rgba(110,150,255,.32),transparent 70%)}
#tH1{background:radial-gradient(90% 60% at 50% 30%,rgba(90,220,170,.28),transparent 70%)}
#tH2{background:radial-gradient(90% 60% at 50% 30%,rgba(255,180,90,.3),transparent 70%)}
#tCoach{background:linear-gradient(180deg,rgba(8,8,18,.5),rgba(10,8,22,.78))}
#light{position:absolute;left:-30%;right:-30%;bottom:-40%;height:120%;z-index:1;pointer-events:none;opacity:0;transform:translate3d(0,45%,0);
  background:radial-gradient(50% 45% at 50% 70%,rgba(255,190,170,.55),rgba(190,150,255,.38) 45%,rgba(120,110,255,.12) 70%,transparent 78%);
  transition:transform 1.4s cubic-bezier(.2,.8,.2,1),opacity 1s ease;will-change:transform}
#phone[data-tab="train"] #tTrain,#phone[data-tab="fuel"] #tFuel,#phone[data-tab="health"] #tHealth,#phone[data-tab="coach"] #tCoach{opacity:1}
#phone:not([data-tab="health"]) #tH0,#phone:not([data-tab="health"]) #tH1,#phone:not([data-tab="health"]) #tH2{opacity:0!important}
#phone[data-tab="coach"] #light{opacity:1;transform:none}
#tEmber{background:linear-gradient(180deg,rgba(255,112,64,.22),rgba(150,38,20,.55) 55%,rgba(30,7,7,.94));z-index:2}
#tTeal{background:linear-gradient(180deg,rgba(30,150,150,.42),rgba(8,70,76,.78) 55%,rgba(4,26,30,.96));z-index:2}
#level{position:absolute;left:0;right:0;bottom:0;height:100%;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s ease;
  background:linear-gradient(180deg,rgba(110,235,220,.34),rgba(60,190,180,.16) 8rem,rgba(40,160,150,.10));transform:translate3d(0,100%,0);will-change:transform}
#level::before{content:'';position:absolute;left:0;right:0;top:0;height:.15rem;background:rgba(180,255,245,.7);box-shadow:0 0 1.6rem rgba(120,255,240,.6)}
#phone[data-v="train"] #tEmber,#phone[data-v="rest"] #tTeal,#phone[data-v="rest"] #level,#phone[data-v="done"] #tEmber{opacity:1}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;z-index:3;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;visibility:hidden;pointer-events:none;
  padding:0 1.6rem calc(env(safe-area-inset-bottom,0px) + 13rem)}
.scr::-webkit-scrollbar{display:none}
.scr.on{visibility:visible;pointer-events:auto}
/* between finger-down and finger-up the next screen is drawn once, almost invisibly, so its first frame needs no raster */
.scr.warm:not(.on){visibility:visible;opacity:.004}
#phone:not([data-v="today"]) .scr{pointer-events:none}
/* the cards of a screen rise in by CSS transitions, one after another (--d), and drop away together when it is left */
.scr .rise,.scr .hero>:not(.hdr){opacity:0;transform:translate3d(0,4.4rem,0)}
.scr.in .rise,.scr.in .hero>:not(.hdr){opacity:1;transform:none;transition:opacity .34s ease var(--d,0ms),transform var(--sd) var(--se) var(--d,0ms)}
.scr.in.out .rise,.scr.in.out .hero>:not(.hdr){opacity:0;transform:translate3d(0,2.4rem,0);transition:opacity .17s cubic-bezier(.4,0,1,1),transform .2s cubic-bezier(.4,0,1,1)}
#phone .scr .rise:has(.glass):not(.glass){opacity:1} /* a group that holds glass only moves: a fading parent would turn its frost clear */
.title{padding-top:calc(env(safe-area-inset-top,0px) + 8.6rem)}
.title h1{margin:.6rem 0 0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:6.4rem;line-height:.96;letter-spacing:-.005em}
.title p{margin:1rem 0 0;font-size:1.6rem;line-height:1.4;color:var(--ink2);max-width:36rem}
.sp{height:1.4rem}

/* Today */

/* the hero ends where the first card's header sits just above the dock, so the dock never cuts a row in half */
.hero{position:relative;height:clamp(calc(env(safe-area-inset-top,0px) + 76rem),calc(100dvh - 14.3rem - env(safe-area-inset-bottom,0px)),calc(env(safe-area-inset-top,0px) + 79rem));margin:0 -1.6rem}
.hdr{position:absolute;left:2rem;right:2rem;top:calc(env(safe-area-inset-top,0px) + 1.6rem);height:5.2rem;display:flex;align-items:center;justify-content:space-between}
.circ{width:5.2rem;height:5.2rem;border-radius:50%;display:grid;place-items:center;flex:none}
.circ svg{width:2.2rem;height:2.2rem;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.85rem;font-weight:500;letter-spacing:.36em;padding-left:.36em}
.wxp{height:5.2rem;border-radius:2.6rem;padding:0 1.6rem 0 1.3rem;display:flex;align-items:center;gap:.8rem;font-size:1.45rem}
.wxp svg{width:2rem;height:2rem;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wxp b{font-weight:500}
#arc{position:absolute;left:0;top:calc(env(safe-area-inset-top,0px) + 8.4rem);width:43rem;height:30rem;overflow:visible;touch-action:pan-y;cursor:grab}
#dockFade{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 13rem);z-index:8;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(4,6,10,.5) 55%,rgba(4,6,10,.66));
  -webkit-backdrop-filter:blur(1.4rem);backdrop-filter:blur(1.4rem);-webkit-mask-image:linear-gradient(180deg,transparent,#000 45%);mask-image:linear-gradient(180deg,transparent,#000 45%)}
#phone:not([data-v="today"]) #dockFade,#phone[data-tab="coach"] #dockFade{opacity:0}
#rec .tap{margin-top:2.6rem;font-size:1.25rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
#phone.recOn #toast{transform:translate3d(-50%,24rem,0)!important}
.clock{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 25.4rem);text-align:center;pointer-events:none}
#arcHint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 21.2rem);text-align:center;font-size:1.25rem;font-weight:500;color:rgba(244,241,236,.88);letter-spacing:.02em;pointer-events:none;transition:opacity .6s ease}
.clock::before{content:'';position:absolute;left:50%;top:calc(50% - 2rem);width:34rem;height:21rem;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(4,6,12,var(--cv,.12)),rgba(4,6,12,calc(var(--cv,.12) * .4)) 45%,transparent 75%);z-index:-1}
#kick,#rk,#arcHint{text-shadow:0 0 1rem rgba(0,0,0,.45),0 0 .3rem rgba(0,0,0,.25)}
#big{font-size:4.6rem;line-height:1;font-weight:300;letter-spacing:-.045em;white-space:nowrap}
#big .u{font-size:.4em;letter-spacing:-.01em;margin:0 .1em 0 .04em;opacity:.82;font-weight:300}
#kick{margin-top:.6rem;font-size:1.3rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:rgba(244,241,236,.86)}
/* readiness: one word that fills with light as far as you are ready */
/* readiness, the why, the Coach's line and the button flow as one column, so they can never crowd each other */
.below{position:absolute;left:1.6rem;right:1.6rem;top:calc(env(safe-area-inset-top,0px) + 40.2rem)}
.ready{position:relative;text-align:center}
#rk{position:relative;display:flex;width:max-content;margin:0 auto;align-items:baseline;font-size:1.3rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:rgba(244,241,236,.9)}
/* a local shade under the label, so it reads over the palest far peaks without a box */
#rk::before{content:'';position:absolute;left:50%;top:50%;width:calc(100% + 14rem);height:6rem;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(4,6,12,.2),rgba(4,6,12,.09) 50%,rgba(4,6,12,.03) 75%,transparent);z-index:-1;pointer-events:none}
/* the score and the word read as one lockup: the number first, then what it means; the word lights up from the left when the day opens */
.lock{display:flex;align-items:baseline;justify-content:center;gap:1.3rem;margin-top:.3rem}
#rkN{font-size:7.4rem;font-weight:200;letter-spacing:-.045em;line-height:1;color:var(--ink);text-shadow:0 0 2.4rem rgba(0,0,0,.22)}
#rkN:empty{display:none}
.rw{position:relative;display:inline-block;font-family:var(--serif);font-style:italic;font-size:9.2rem;line-height:1.04;letter-spacing:-.012em;white-space:nowrap;padding:0 .12em}
/* the part of the word not yet lit is an outline, like a glass not yet full, so it reads as a level and never as a fault */
.rw .dim{color:transparent;-webkit-text-stroke:.1rem rgba(244,241,236,.5)}
.ready::before{content:'';position:absolute;left:50%;top:58%;width:44rem;height:24rem;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(4,6,12,var(--rv,0)),rgba(4,6,12,calc(var(--rv,0) * .45)) 50%,transparent 76%);z-index:-1;pointer-events:none}
.ready.moon .lit{color:rgba(222,231,250,.92)}
/* the light fills the letters with a soft edge, like a level of light, never a hard cut through a letter */
@property --f{syntax:'<percentage>';inherits:false;initial-value:0%}
.rw .lit{position:absolute;inset:0;padding:0 .12em;color:color-mix(in srgb,var(--accent) 45%,#fff);--f:0%;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(var(--f) - 2.5%),transparent calc(var(--f) + 2.5%));mask-image:linear-gradient(90deg,#000 calc(var(--f) - 2.5%),transparent calc(var(--f) + 2.5%))}
.rc{display:flex;justify-content:center;gap:1.6rem;flex-wrap:wrap;margin-top:1rem;font-size:1.35rem;color:var(--ink2)}
.rc span{display:inline-flex;align-items:center;gap:.6rem}
.rc i{width:.7rem;height:.7rem;border-radius:50%}
.mom{position:relative;margin:2.2rem .4rem 0;text-align:center}#arc:active{cursor:grabbing}
#arcT{font-size:13px;font-weight:500;letter-spacing:.06em}
/* a faint dark edge painted under the arc's words, so they hold on the brightest noon sky without a box or a blur */
#arc .halo{paint-order:stroke;stroke:rgba(12,10,8,.4);stroke-width:2.6px;stroke-linejoin:round}
/* cards on Today carry a faint dark base, so their small grey text holds over the palest noon photo */
#sToday .card.glass{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04)),rgba(8,10,16,.2)}
#coach{margin:0 auto;max-width:34rem;font-size:2.1rem;line-height:1.2;color:rgba(244,241,236,.78);min-height:5rem;text-wrap:balance}
#coach .chip2,.chip2{display:inline-block;margin-top:.8rem;font-style:normal;font-family:var(--sans);font-size:1.3rem;font-weight:500;letter-spacing:.02em;color:var(--ink);background:rgba(255,255,255,.14);padding:.25rem .9rem .35rem;border-radius:1.2rem;white-space:nowrap}
.swap span{display:inline-block;transition:opacity .26s ease,transform .26s var(--se)}
.swap.out span{opacity:0;transform:translate3d(0,.5rem,0)}
.cta{margin-top:2rem;display:flex;justify-content:center}
.prim{height:5.6rem;padding:0 3rem;border-radius:2.8rem;background:var(--accent);color:var(--accentInk);font-size:1.8rem;font-weight:500;letter-spacing:-.005em;display:inline-flex;align-items:center;gap:1rem;
  transition:transform .18s var(--se),background-color 1.2s ease,opacity .3s ease;box-shadow:0 1.2rem 4rem rgba(0,0,0,.3);position:relative}
.prim:active{transform:scale(.96)}
.prim svg{width:1.5rem;height:1.5rem;fill:currentColor}
.prim small{font-size:1.4rem;font-weight:400;opacity:.6}
.ch3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
.ch3 .serif{font-size:2.4rem}
/* numbers and ranges are data: the sans, tabular; the serif is kept for titles and the Coach's voice */
.ch3 .val{font-size:1.75rem;font-weight:400;letter-spacing:-.01em;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;padding:1.4rem 0;border-top:.06rem solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .n{font-size:1.75rem;letter-spacing:-.01em}
.row .d{font-size:1.35rem;color:var(--ink3);margin-top:.3rem}
.row .r{font-size:1.65rem;text-align:right;font-variant-numeric:tabular-nums}
.row .r small{display:block;font-size:1.2rem;color:var(--ember);margin-top:.3rem}
.lvl{height:.6rem;border-radius:.3rem;background:rgba(244,241,236,.12);overflow:hidden;margin:.6rem 0 0}
.lvl i{display:block;height:100%;width:100%;border-radius:.3rem;transform-origin:0 50%;transition:transform .8s var(--se)}
.chips{display:flex;flex-wrap:wrap;gap:.8rem}
.chip{height:4.4rem;padding:0 1.6rem;border-radius:2.2rem;background:rgba(255,255,255,.1);font-size:1.55rem;display:inline-flex;align-items:center;gap:.7rem;transition:transform .16s var(--se),background-color .2s;white-space:nowrap}
.chip:active{transform:scale(.95);background:rgba(255,255,255,.18)}
.chip small{color:var(--ink2);font-size:1.3rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.6rem;margin-top:1.2rem}
.day{text-align:center;font-size:1.25rem;color:var(--ink3)}
.day .b{height:8rem;margin:.8rem auto 0;width:100%;max-width:3.4rem;border-radius:1.7rem;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.day .b i{position:absolute;left:0;right:0;bottom:0;height:100%;border-radius:1.7rem;transform-origin:50% 100%;transform:scaleY(0)}
.day.now{color:var(--ink)}
.day.now .b{box-shadow:0 0 0 .12rem var(--ember)}
.day .t{margin-top:.7rem;font-size:1.2rem;letter-spacing:.02em;white-space:nowrap}
.mems{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1rem}
.mem{font-size:1.35rem;padding:.7rem 1.2rem;border-radius:1.6rem;background:rgba(255,255,255,.08);color:var(--ink)}

/* dock */
#dock{position:absolute;left:1.8rem;right:1.8rem;bottom:calc(env(safe-area-inset-bottom,0px) + 2.2rem);height:6.6rem;display:flex;gap:1.2rem;z-index:9;transition:transform var(--sd) var(--se)}
.tabs{position:relative;flex:1;border-radius:3.3rem;display:flex;padding:.5rem}
#ind{position:absolute;top:.5rem;bottom:.5rem;left:.5rem;width:calc((100% - 1rem)/4);border-radius:2.8rem;background:rgba(255,255,255,.14);box-shadow:inset 0 .06rem 0 rgba(255,255,255,.22);transition:transform var(--sd) var(--se)}
.tb{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;font-size:1.25rem;color:var(--ink3);transition:color .3s}
.tb svg{width:2.4rem;height:2.4rem;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--ink)}
#askB{width:6.6rem;height:6.6rem;border-radius:50%;display:grid;place-items:center;flex:none}
#askB svg{width:2.6rem;height:2.6rem;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#askB .dot{position:absolute;top:1rem;right:1rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .3rem rgba(6,8,11,.4);transition:background-color 1.2s}
#phone:not([data-v="today"]) #dock{transform:translate3d(0,14rem,0)}
#phone[data-tab="coach"] #dock{transform:translate3d(0,14rem,0)}
#live{position:absolute;left:1.8rem;right:1.8rem;bottom:calc(env(safe-area-inset-bottom,0px) + 10rem);height:5.6rem;border-radius:2.8rem;display:flex;align-items:center;gap:1.2rem;padding:0 2rem 0 1.6rem;z-index:8;text-align:left;
  transform:translate3d(0,24rem,0);transition:transform var(--sd) var(--se)}
#live.on{transform:none}
#phone:not([data-v="today"]) #live,#phone[data-tab="coach"] #live{transform:translate3d(0,24rem,0)}
#live .pd{width:1rem;height:1rem;border-radius:50%;background:var(--ember);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,141,85,.6)}70%{box-shadow:0 0 0 1rem rgba(255,141,85,0)}100%{box-shadow:0 0 0 0 rgba(255,141,85,0)}}
#live .lt{flex:1;font-size:1.5rem}
#live .lt small{display:block;font-size:1.2rem;color:var(--ink2);margin-top:.1rem}
#live .lc{font-size:1.6rem}

/* Train */
.exc{border-radius:2.8rem;padding:1.8rem 2rem;width:100%;text-align:left;display:block;clip-path:inset(0 round 2.8rem)}
.exc .top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.exc .nm{font-family:var(--serif);font-style:italic;font-size:2.8rem;line-height:1.05}
.exc .w{font-size:1.9rem;font-weight:300;letter-spacing:-.02em;white-space:nowrap}
.exc .w small{font-size:1.2rem;color:var(--ink2);margin-left:.2rem}
.exc .meta{margin-top:.6rem;font-size:1.35rem;color:var(--ink2);display:flex;gap:1.4rem}
.exc .dots{display:flex;gap:.5rem;margin-top:1.2rem}
.exc .dots i{width:1rem;height:1rem;border-radius:50%;background:rgba(244,241,236,.22)}
.exc .more{display:none;margin-top:1.4rem;border-top:.06rem solid var(--line);padding-top:1.2rem}
.exc.open .more{display:block}
.exc .sx{display:flex;justify-content:space-between;font-size:1.5rem;padding:.55rem 0;color:var(--ink)}
.exc .sx span:first-child{color:var(--ink3)}
.spark{width:100%;height:6rem;display:block;margin-top:1rem;overflow:visible}
/* Train's own hero: the session as a skyline of its sets, then the time it takes against the light that is left */
.shape{margin-top:2.6rem}
.shape .bars{display:flex;align-items:flex-end;gap:1.4rem;height:9rem}
.shape .grp2{position:relative;flex:var(--n,1);display:flex;align-items:flex-end;gap:.45rem;height:100%}
.shape .grp2 i{flex:1;max-width:1.2rem;border-radius:.6rem;background:linear-gradient(180deg,rgba(255,214,186,.95),rgba(255,141,85,.55));transform-origin:50% 100%;box-shadow:0 0 1.6rem rgba(255,140,80,.25)}
.shape .grp2 i.dn{background:linear-gradient(180deg,#ffe2a8,#f2c46a)}
.shape .grp2 span{position:absolute;left:0;top:100%;margin-top:.8rem;font-size:1.3rem;letter-spacing:.06em;color:var(--ink3);white-space:nowrap}
.shape.mini{margin:1.2rem 0 .4rem;height:3.2rem;overflow:hidden}.shape.mini .bars{height:3.2rem;gap:1.8rem}.shape.mini .grp2{flex:none;gap:.35rem}.shape.mini .grp2 i{flex:none;width:.7rem;box-shadow:none}
.shape .clk{display:flex;align-items:center;gap:.8rem;margin-top:3.4rem;font-size:1.3rem;color:var(--ink2)}
.shape .clk i{flex:1;height:.12rem;background:linear-gradient(90deg,rgba(255,170,120,.7),rgba(255,170,120,.15))}
.shape .clk b{font-weight:500;color:#ffd59a;margin-left:.6rem}
.spark circle{transform-box:fill-box;transform-origin:center}
.exc .cl{margin-top:1rem;font-family:var(--serif);font-style:italic;font-size:1.9rem;line-height:1.2;color:rgba(244,241,236,.86)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;margin-top:1rem}
.wk div{text-align:center;padding:1rem .2rem;border-radius:1.6rem;font-size:1.2rem;color:var(--ink2)}
.wk div b{display:block;font-weight:500;color:var(--ink);font-size:1.3rem;margin-bottom:.4rem}
.wk div.now{background:rgba(255,141,85,.18);color:#ffd2bb}
.wk div.dn b::after{content:' ✓';color:var(--mint)}
.bigb{width:100%;height:6.4rem;border-radius:3.2rem;background:var(--accent);color:var(--accentInk);font-size:2rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:2.2rem;transition:transform .18s var(--se),background-color 1.2s,opacity .3s ease;box-shadow:0 1.4rem 4rem rgba(0,0,0,.3)}
.bigb:active{transform:scale(.97)}
.bigb svg{width:1.6rem;height:1.6rem;fill:currentColor}

/* Fuel */
/* the glass fills as you eat: an amber level rises behind the number */
.jar{position:relative;height:30rem;margin-top:2.2rem;border-radius:3.6rem;overflow:hidden;display:grid;place-items:center;text-align:center}
/* the level moves (never stretches), so its bright surface stays a crisp line; it tilts and settles when food lands */
.jar .lv{position:absolute;left:-10%;right:-10%;bottom:0;height:100%;transform-origin:50% 0;translate:0 100%;background:linear-gradient(180deg,rgba(255,196,120,.5),rgba(255,150,70,.26) 30%,rgba(255,130,60,.14) 70%,rgba(255,130,60,.1));will-change:translate,rotate}
.jar .lv::before{content:'';position:absolute;left:0;right:0;top:0;height:.16rem;background:rgba(255,226,180,.9);box-shadow:0 0 2rem rgba(255,200,130,.8)}
.jar .in{position:relative}
#fNum{font-size:9.6rem;font-weight:200;letter-spacing:-.05em;line-height:1;white-space:nowrap}
.jar .l1{font-size:1.5rem;color:var(--ink2);margin-top:.4rem}
.jar .l2{font-size:1.3rem;color:var(--ink3);margin-top:.9rem}
/* the day's meals are marks on the glass, at the protein each one brings you to; the level rises past them */
.jar .marks{position:absolute;inset:0;pointer-events:none}
.jar .mk{position:absolute;right:0;display:flex;align-items:center;gap:.7rem;transform:translateY(50%);font-size:1.3rem;letter-spacing:.04em;color:rgba(244,241,236,.5);transition:color .6s ease}
.jar .mk i{display:block;width:1.4rem;height:.12rem;background:rgba(255,255,255,.35);transition:background-color .6s ease,width .6s var(--se)}
.jar .mk.on{color:rgba(255,236,214,.95)}.jar .mk.on i{background:rgba(255,226,180,.9);width:2rem}

.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:2.2rem}
.mac>div{border-radius:2rem;padding:1.2rem 1.3rem}
.mac b{display:block;font-size:2rem;font-weight:300;letter-spacing:-.02em}
.mac b small{font-size:1.15rem;color:var(--ink2);margin-left:.2rem}
.mac span{font-size:1.2rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.meal{display:grid;grid-template-columns:5.2rem 1fr auto;gap:1.2rem;align-items:center;padding:1.4rem 0;border-top:.06rem solid var(--line)}
.meal:first-child{border-top:0}
.meal .tm{font-size:1.4rem;color:var(--ink2)}
.meal .n{font-size:1.7rem}
.meal .d{font-size:1.3rem;color:var(--ink3);margin-top:.2rem}
.meal .p{font-size:1.7rem;text-align:right}
.lg{height:4.4rem;padding:0 1.7rem;border-radius:2.2rem;background:rgba(255,255,255,.14);font-size:1.4rem;font-weight:500;display:inline-flex;align-items:center;gap:.6rem;position:relative;overflow:hidden}
.lg.done{background:rgba(127,224,192,.16);color:#c9ffe9}
.lg svg{width:1.4rem;height:1.4rem;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* Health */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:1.4rem -1.6rem 0;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.pgp{flex:0 0 43rem;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;padding:1rem 0 0}
.hpan{position:relative;width:39.8rem;height:28rem;border-radius:3.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.hpan .lb{font-size:1.2rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.hpan .num{font-size:8rem;font-weight:200;letter-spacing:-.05em;line-height:1;margin-top:.6rem}
.hpan .num .u{font-size:.34em;opacity:.8;margin-left:.06em;font-weight:300;letter-spacing:0}
.hpan .rw{font-size:5.2rem;margin-top:.4rem}
.hpan .rw .lit{position:static;display:block;padding:0;color:color-mix(in srgb,var(--pc) 55%,#fff);-webkit-mask-image:none;mask-image:none}.hpan .rw .dim{display:none}
.hpan .sub{font-size:1.35rem;color:var(--ink2);margin-top:.8rem}.pdots{display:flex;justify-content:center;gap:.8rem;margin-top:1.8rem}
.pdots i{width:.7rem;height:.7rem;border-radius:.35rem;background:rgba(244,241,236,.3);transition:width .3s var(--se),background-color .3s}
.pdots i.on{width:2.2rem;background:var(--ink)}
.rib{height:2rem;border-radius:1rem;margin-top:1.4rem;box-shadow:0 0 2.4rem rgba(110,150,255,.18)}
.ribT{display:flex;justify-content:space-between;margin-top:.7rem;font-size:1.3rem;color:var(--ink3)}
/* seven nights as seven moons: the longer the sleep, the fuller and larger */
.moons{display:flex;justify-content:space-between;align-items:center;margin-top:1.4rem}
.moons div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.7rem;height:6.4rem;font-size:1.3rem;color:var(--ink3)}
.moons i{display:block;border-radius:50%;box-shadow:inset 0 0 0 .14rem rgba(156,196,255,.55)}
.mkey{display:flex;gap:1.8rem;margin-top:1.2rem;font-size:1.3rem;color:var(--ink3)}
.mkey span{display:inline-flex;align-items:center;gap:.6rem}
.mkey i{display:block;width:1rem;height:1rem;border-radius:50%;box-shadow:inset 0 0 0 .14rem rgba(156,196,255,.55)}
.mkey i.full,.moons i.full{background:radial-gradient(circle at 35% 35%,#d8e6ff,#9cc4ff 60%,#7fa6f0);box-shadow:0 0 1.4rem rgba(156,196,255,.35)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 1.4rem;margin-top:1.1rem;font-size:1.35rem;color:var(--ink2)}
.legend b{display:inline-block;width:.8rem;height:.8rem;border-radius:.4rem;margin-right:.5rem}
.bars7{display:flex;gap:.8rem;align-items:flex-end;height:9rem;margin-top:1.4rem}
.bars7 div{flex:1;text-align:center;font-size:1.2rem;color:var(--ink3)}
.bars7 i{display:block;width:1.4rem;margin:0 auto .6rem;border-radius:.7rem;transform-origin:50% 100%}
.chart{position:relative;margin-top:1rem;touch-action:pan-y}
.chart svg{width:100%;height:13rem;display:block;overflow:visible}
#hair{position:absolute;top:0;bottom:2rem;width:.1rem;background:rgba(244,241,236,.6);opacity:0;transition:opacity .2s;pointer-events:none}
#bub{position:absolute;top:-3.6rem;transform:translateX(-50%);padding:.5rem 1rem;border-radius:1.2rem;background:rgba(255,255,255,.16);font-size:1.35rem;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.chart.on #hair,.chart.on #bub{opacity:1}
.src{font-size:1.35rem;color:var(--ink3);margin-top:1.2rem;line-height:1.5}

/* Coach */
#sCoach{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12rem)}
.greet{font-family:var(--serif);font-style:italic;font-size:4.8rem;line-height:1.02;margin-top:.6rem}
.thread{display:flex;flex-direction:column;gap:1.4rem;margin-top:2.4rem}
.me{align-self:flex-end;max-width:80%;padding:1.2rem 1.6rem;border-radius:2.2rem 2.2rem .6rem 2.2rem;background:rgba(255,255,255,.16);font-size:1.65rem;line-height:1.35}
.ans{font-family:var(--serif);font-style:italic;font-size:2.4rem;line-height:1.2}
.ans .w{display:inline-block;opacity:0;transform:translate3d(0,.4rem,0);animation:word .42s var(--se) forwards}
@keyframes word{to{opacity:1;transform:none}}
.think{height:4.6rem;border-radius:2.3rem;overflow:hidden;position:relative;background:rgba(255,255,255,.06);width:70%}
.think i{position:absolute;inset:-60% -30%;background:radial-gradient(40% 60% at 30% 50%,rgba(255,200,170,.6),transparent 70%),radial-gradient(40% 60% at 70% 50%,rgba(170,160,255,.55),transparent 70%);animation:drift 2.4s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:translate3d(-14%,0,0)}to{transform:translate3d(14%,0,0)}}
.prop{border-radius:2.4rem;padding:1.6rem 1.8rem;display:flex;flex-direction:column;gap:1.2rem}
.prop p{margin:0;font-size:1.55rem;line-height:1.4}
.prop .r{display:flex;gap:1rem;align-items:center}
.use{height:4.6rem;padding:0 2rem;border-radius:2.3rem;background:var(--teal);color:#032623;font-weight:600;font-size:1.6rem;position:relative;overflow:hidden;white-space:nowrap}
.keep{font-size:1.5rem;color:var(--ink2);padding:1rem}
.mini{width:100%;height:9rem;display:block;margin-top:.4rem}
#askBar{position:absolute;left:1.6rem;right:1.6rem;bottom:calc(env(safe-area-inset-bottom,0px) + 2.2rem);height:6.6rem;z-index:10;display:flex;gap:.8rem;align-items:center;padding:0 .8rem 0 2rem;border-radius:3.3rem;
  transform:translate3d(0,14rem,0);transition:transform var(--sd) var(--se)}
#phone[data-tab="coach"][data-v="today"] #askBar{transform:none}
#askBar input{flex:1;min-width:0;height:5rem;background:none;border:0;color:var(--ink);font:inherit;font-size:1.65rem;outline:0}
#askBar input::placeholder{color:var(--ink3)}
#askBar .go{height:5rem;padding:0 2rem;border-radius:2.5rem;background:var(--accent);color:var(--accentInk);font-weight:500;font-size:1.6rem}
#askX{position:absolute;right:1.6rem;top:calc(env(safe-area-inset-top,0px) + 1.6rem);z-index:10;transform:translate3d(0,-12rem,0);transition:transform var(--sd) var(--se)}
#phone[data-tab="coach"][data-v="today"] #askX{transform:none}
.close svg{width:2rem;height:2rem;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}

/* sheets that grow out of what you touched */
.sheet{position:absolute;left:.8rem;right:.8rem;bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);z-index:30;pointer-events:none;max-height:86%}
.sheet::before{content:'';position:absolute;inset:0;border-radius:3.6rem;background:linear-gradient(180deg,rgba(36,42,54,.42),rgba(12,15,20,.7));
  -webkit-backdrop-filter:blur(3.2rem) saturate(1.6);backdrop-filter:blur(3.2rem) saturate(1.6);clip-path:inset(50% 50% 50% 50% round 3.6rem)}
.sheet.on{pointer-events:auto}
.si{position:relative;padding:2.4rem 2.2rem 2.2rem;opacity:0;transform:translate3d(0,1.4rem,0);max-height:inherit;overflow-y:auto;scrollbar-width:none}
.si h4{margin:0 0 1.2rem;font-family:var(--serif);font-style:italic;font-weight:400;font-size:3.4rem;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;gap:.4rem;background:rgba(255,255,255,.07);border-radius:2.4rem;padding:.4rem;flex-wrap:wrap}
.seg button{flex:1;height:4rem;border-radius:2rem;font-size:1.4rem;color:var(--ink2);padding:0 1rem;transition:background-color .25s,color .25s}
.seg button.on{background:rgba(255,255,255,.16);color:var(--ink)}
.note{font-size:1.25rem;color:var(--ink3);line-height:1.5;margin:2rem 1.6rem 0}
/* settings: grouped rows like the phone's own */
.grp{margin-top:1.2rem;border-radius:2.2rem;background:rgba(255,255,255,.075);overflow:hidden}
.gk{margin:2.4rem 1.6rem 0;font-size:1.1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.srow{display:flex;align-items:center;gap:1.3rem;min-height:5.6rem;padding:.9rem 1.5rem;width:100%;text-align:left;position:relative;color:var(--ink);transition:background-color .2s ease}
.srow+.srow::before{content:'';position:absolute;left:5.8rem;right:0;top:0;height:1px;background:rgba(255,255,255,.08)}
.srow+.srow:not(:has(.ic))::before{left:1.5rem}
button.srow:active{background:rgba(255,255,255,.07);transition-duration:0s}
.srow .ic{flex:none;width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.srow .ic svg{width:1.8rem;height:1.8rem;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.srow .tx{flex:1;min-width:0;font-size:1.55rem;line-height:1.25}
.srow .tx small{display:block;font-size:1.22rem;color:var(--ink3);margin-top:.25rem;line-height:1.3}
.srow .vl{font-size:1.45rem;color:var(--ink2);white-space:nowrap}
.srow .chev{flex:none;width:.8rem;height:1.3rem;stroke:var(--ink3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sw{flex:none;width:5.1rem;height:3.1rem;border-radius:1.55rem;background:rgba(255,255,255,.16);position:relative;transition:background-color .3s ease}
.sw::after{content:'';position:absolute;left:.25rem;top:.25rem;width:2.6rem;height:2.6rem;border-radius:50%;background:#fff;box-shadow:0 .2rem .6rem rgba(0,0,0,.28);transition:transform var(--sd) var(--se)}
.sw.on{background:#45b487}
.sw.on::after{transform:translate3d(2rem,0,0)}
.seg.sm{flex:none;flex-wrap:nowrap;padding:.3rem;border-radius:1.8rem}
.seg.sm button{flex:none;height:3.2rem;padding:0 1.2rem;font-size:1.3rem;border-radius:1.5rem}
.skies{flex:none;display:flex;gap:.5rem}
.skies button{width:3.8rem;height:3.8rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--ink2);transition:background-color .25s,color .25s}
.skies button.on{background:rgba(255,255,255,.22);color:var(--ink)}
.skies svg{width:1.9rem;height:1.9rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.skies .lvt{font-size:1.05rem;font-weight:600;letter-spacing:.04em}
#scrim{position:absolute;inset:0;z-index:29;background:rgba(2,4,6,.34);opacity:0;pointer-events:none;transition:opacity .35s ease}
#scrim.on{opacity:1;pointer-events:auto}
/* under a sheet, the screen's brightest things step back, so they never smear through the frosted glass */
.scr :is(.ready,#coach){transition:opacity .3s ease}
#phone.sheetOn .scr.on :is(.prim,.bigb,#arc,#arcHint,.clock,.ready,#coach){opacity:0}
/* food keypad */
.amt{text-align:center;margin:.4rem 0 .2rem}
#aNum{font-size:6.8rem;font-weight:200;letter-spacing:-.05em;line-height:1;display:inline-flex;justify-content:center;min-height:6.8rem}
#aNum .dg{display:inline-block}
.amt .u{font-size:2.4rem;color:var(--ink2);font-weight:300;margin-left:.4rem}
.amt .pp{font-size:1.45rem;color:var(--ink2);margin-top:.6rem}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-top:1.2rem}
#logIn{padding-top:1.8rem}#logIn h4{margin-bottom:.8rem}
.keys button{height:5.3rem;border-radius:2rem;background:rgba(255,255,255,.08);font-size:2.6rem;font-weight:300;transition:transform .12s var(--se),background-color .2s}
.keys button:active{transform:scale(.94);background:rgba(255,255,255,.16)}
.foods{display:flex;gap:.8rem;overflow-x:auto;scrollbar-width:none;margin:0 -2.2rem;padding:0 2.2rem}
.foods::-webkit-scrollbar{display:none}
.foods .chip.on{background:var(--accent);color:var(--accentInk)}
.foods .chip.on small{color:rgba(21,18,14,.6)}

/* ---------- workout ---------- */
#work{position:absolute;inset:0;z-index:12;pointer-events:none}
#phone:not([data-v="today"]) #work{pointer-events:auto}
#wHd{position:absolute;left:2rem;right:2rem;top:calc(env(safe-area-inset-top,0px) + 5rem);display:flex;justify-content:space-between;align-items:center;transform:translate3d(0,-12rem,0);transition:transform var(--sd) var(--se)}
#phone:not([data-v="today"]) #wHd{transform:none}
.pill{height:4.6rem;border-radius:2.3rem;padding:0 1.8rem;display:flex;align-items:center;gap:.8rem;font-size:1.55rem;font-weight:500}
.pill small{font-size:1.3rem;font-weight:400;color:var(--ink2)}
#wMid{position:absolute;left:2.4rem;right:2.4rem;top:12.4rem}
.fade{opacity:0;transform:translate3d(0,2rem,0);transition:opacity .35s ease,transform var(--sd) var(--se)}
#phone:not([data-v="today"]) .fade.in{opacity:1;transform:none}
#exName{font-size:4rem;line-height:1.02;letter-spacing:-.005em;white-space:nowrap;display:inline-block}
#exSub{margin-top:.7rem;font-size:1.4rem;color:var(--ink2)}
#setB{position:relative;margin-top:2.6rem;transform-origin:0 0}
.wnum{display:flex;align-items:baseline;gap:.8rem}
#wW{font-size:15rem;line-height:.86;font-weight:200;letter-spacing:-.06em;cursor:pointer;white-space:nowrap}
#wR{font-size:7.6rem;line-height:1;font-weight:200;letter-spacing:-.04em;cursor:pointer;white-space:nowrap}
.wnum .u{font-size:2.8rem;color:var(--ink2);font-weight:300;letter-spacing:0}
.wnum .x{font-size:5rem;color:var(--ink2);font-weight:200;margin-right:.4rem}
/* a quiet sign that the numbers can be changed (the steppers open from the number or from this) */
.wnum .adj{align-self:center;flex:none;width:4.8rem;height:4.8rem;border-radius:50%;background:rgba(255,255,255,.16);color:var(--ink2);font-size:1.8rem;line-height:1;margin-left:.4rem;transition:background-color .2s}
.wnum .adj:active{background:rgba(255,255,255,.2)}
.stp{position:absolute;left:0;display:flex;gap:1rem;z-index:3;pointer-events:none}
.stp button{width:9.6rem;height:5.6rem;border-radius:2.8rem;font-size:2rem;font-weight:500;transform:scale(0);transition:transform var(--sd) var(--se);
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.11));box-shadow:0 .8rem 2.4rem rgba(0,0,0,.18)}
.stp.on{pointer-events:auto}
.stp.on button{transform:none}
.stp.on button:nth-child(2){transition-delay:30ms}

  const ei = +j.dataset.j; if (ei === W.e) return closeSess();
  W.e = ei; W.s = Math.min(W.done[ei].filter(Boolean).length, W.ex[ei].sets.length - 1); W.idx = W.ex.slice(0, ei).reduce((a, x) => a + x.sets.length, 0) + W.s;
  closeSess(); renderSet(); go($('#exName'), [{ transform: 'translate3d(6rem,0,0)', opacity: 0 }, { transform: 'none', opacity: 1 }], { key: 'nm' });
});
function bindHold() { // hold to commit: the world goes soft while the button fills, one calm finish
  const b = $('#holdB'), fill = b.querySelector('i'), soft = $('#soft'); let a1 = null, a2 = null, tm = 0; const HOLD = 1100;
  const down = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch {} buzz(6); b.querySelector('span').textContent = t('holding');
    const q = new DOMMatrix(getComputedStyle(fill).transform).a || 0; a1 && a1.cancel(); a2 && a2.cancel();
    a1 = fill.animate([{ transform: `scaleX(${q})` }, { transform: 'scaleX(1)' }], { duration: HOLD * (1 - q), easing: 'linear', fill: 'forwards' });
    a2 = soft.animate([{ opacity: q }, { opacity: 1 }], { duration: HOLD * (1 - q), easing: 'linear', fill: 'forwards' });
    tm = setTimeout(() => { b.removeEventListener('pointerup', up); b.removeEventListener('pointerleave', up); finish(); }, HOLD * (1 - q)); };
  const up = () => { clearTimeout(tm); if (!a1) return; b.querySelector('span').textContent = t('hold');
    const q = new DOMMatrix(getComputedStyle(fill).transform).a; a1.cancel(); a2.cancel();

}
function finish() {

  $$('#cmp .md').forEach(m => m.addEventListener('click', () => { buzz(6); m.animate([{ transform: 'rotateY(0) translate3d(0,0,0)' }, { transform: 'rotateY(180deg) translate3d(0,-.6rem,2rem)', offset: .5 }, { transform: 'rotateY(360deg)' }], { duration: 900, easing: 'cubic-bezier(.3,.7,.3,1)' }); }));
  $('#doneB').addEventListener('click', backToday);

function backToday() {
  const C = $('#cmp'); C.classList.remove('on');

  setTimeout(() => { paintCards(); paintCta(); $('#coach').__h = null; paintHero(nowMin()); built.train = false; if (S.tab === 'train') { BUILD.train(); built.train = true; } }, SP.dur + 60);
  toast(t('savedPush'));
}

/* ================= the morning: the night you slept through runs past ================= */
function morning() {
  const end = nowMin(), start = Math.max(0, Math.min(end - 60, 300)), t0 = performance.now(), ms = 1700; springId++;
  const st = () => { const k = clamp((performance.now() - t0) / ms, 0, 1), e = springAt(k); const m = lerp(start, end, e); placeDot(m); applyLight(m, k === 1); paintHero(k === 1 ? end : Math.round(m / 10) * 10); if (k < 1) requestAnimationFrame(st); };
  requestAnimationFrame(st);
}

/* ================= boot: everything is built and warmed before the first tap ================= */
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (sheetOpen) closeSheet(); else if (sessOpen) closeSess(); else if (S.view === 'train' || S.view === 'rest') minimise(); else if (S.tab !== 'today') show('today'); } });
const nf = () => new Promise(r => requestAnimationFrame(() => r()));
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  findSunTimes();

  ['train', 'fuel', 'health', 'coach'].forEach(k => { BUILD[k](); built[k] = true; });
  try {
    initGL();
    const [ph, mk] = await Promise.all([loadImg('photo.jpg'), loadImg('mask.png')]);
    await Promise.all([ph.decode?.(), mk.decode?.()].filter(Boolean));
    tex(ph, 0); gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE); tex(mk, 1); glReady = true;
  } catch (err) { console.error(err); }

  await warmUp();

  (window.requestIdleCallback || (f => setTimeout(f, 3000)))(() => { if (!rainMade) makeRain(); }, { timeout: 5000 }); // rain tiles ready before any shower
  // the first open: the rings draw, the numbers count, the week grows
  paintReady(nowMin(), 'draw'); growBars(true);
  const mm = nowMin();
  if (mm > 300 && mm < 660 && store.get('morning') !== new Date().toDateString()) { store.set('morning', new Date().toDateString()); setTimeout(morning, 450); }
  setInterval(() => { if (S.scrub === null && springIdle()) { const n = nowMin(); applyLight(n); placeDot(n); paintHero(n); paintWx(n); } }, 20000);
}
const springIdle = () => true;
// warm-up under the veil. The GPU compiles a shader the first time it meets a new kind of picture (a glass layer that is

// screen, sheet and in-between state is drawn here once, and every kind of motion is played once for real.

  const MID = '#phone .scr .rise,#phone .scr .hero>:not(.hdr){opacity:.5;transform:translate3d(0,2rem,0)}.scr{visibility:visible!important}.sheet::before,#sessT::before{clip-path:inset(22% 12% 30% 9% round 2.4rem)!important}#tray::before{clip-path:inset(0 0 45% 0 round 2.6rem)!important}' +
    '.si,.sT,.tr{opacity:.5!important;transform:translate3d(0,1rem,0)!important}#soft{opacity:.45!important}#toast{transform:translate3d(-50%,-1rem,0) scale(.97)!important}' +
    '.stp button{transform:scale(.55)!important}.glass{transform:scale(.97)}.rise{opacity:.5;transform:translate3d(0,2rem,0)}#medal{opacity:.7!important;transform:rotateY(-42deg) scale(.8)!important}#medal .sh{transform:translate3d(-10%,0,0)!important}' +
    '#recBg,#recT{opacity:.5!important}#setB{transform:translate3d(3rem,8rem,0) scale(.3)!important;opacity:.5!important}#logL,.lb{filter:blur(.4rem)!important;opacity:.6!important}' +
    '#level{opacity:.6!important;transform:translate3d(0,40%,0)!important}.lay{opacity:.6!important}#light{opacity:.6!important;transform:translate3d(0,20%,0)!important}#scene{transform:scale(1.04)!important}' +
    '.st{transform:scaleY(.4)}.md{transform:rotateY(70deg) translate3d(0,-.6rem,2rem)}#cmp .c{opacity:.5;transform:translate3d(0,1rem,0)}.exc{clip-path:inset(0 0 30% 0 round 2.8rem)}';
  $$('.sheet').forEach(s => s.classList.add('on')); $('#sessT').classList.add('on'); $('#tray').classList.add('on');
  buildSettings(); buildLog(); if (!rainMade && LIGHT.wx.rain) makeRain(); // raining at load: the rain tiles are drawn here, under the veil
  $$('.jar .lv').forEach(l => l.style.rotate = '1deg');
  $('#trIn').innerHTML = `<div class="k">${t('coachK')}</div><p>${t('coachP')}</p><div class="r"><button class="use"><span class="lb">${t('use85')}</span></button></div>`;
  $('#cmp').innerHTML = `<div class="ring c"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="122" stroke="var(--gold)" stroke-dasharray="766.5" stroke-dashoffset="300"/></svg></div><div class="medals c"><div class="md">85</div></div>`;

window.__aven = { S, get W() { return W; }, startWorkout, show, logSet: () => $('#logB').click(), endRest, finish, minimise, morning, scrubTo: m => { placeDot(m); applyLight(m); paintHero(m); paintWx(m); },

})();
