.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker[data-position="top"] { bottom: auto; top: calc(24px + env(safe-area-inset-top, 0px)); }
</style>

<script>
const I = {
  today: '<svg class="ico" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="4.5"/><path d="M8.5 3v3.5M15.5 3v3.5"/><circle cx="12" cy="13" r="1.7" fill="currentColor" stroke="none"/></svg>',
  train: '<svg class="ico" viewBox="0 0 24 24"><path d="M7 12h10M7 7.5v9M17 7.5v9M3.8 9.8v4.4M20.2 9.8v4.4"/></svg>',
  food: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 11.5h16a8 8 0 0 1-16 0z"/><path d="M9.5 8c0-1.5 1.2-1.5 1.2-3M14 8c0-1.5 1.2-1.5 1.2-3"/></svg>',
  health: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 19.5s-7-4.3-7-9.4A3.9 3.9 0 0 1 12 7.9a3.9 3.9 0 0 1 7 2.2c0 5.1-7 9.4-7 9.4z"/></svg>',
  down: '<svg class="ico" viewBox="0 0 24 24"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg>',
  go: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h13M12.5 6.5L18 12l-5.5 5.5"/></svg>',
  check: '<svg class="ico" viewBox="0 0 24 24"><path d="M5.5 12.5l4.5 4.5 8.5-9.5"/></svg>',
  minus: '<svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12"/></svg>',
  plus: '<svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>',
  mic: '<svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg>',
  sb: '<span class="row" style="gap:6px"><svg viewBox="0 0 18 12"><path d="M1 9.5h2.4V12H1zM5.3 7h2.4v5H5.3zM9.6 4.2H12V12H9.6zM13.9 1h2.4v11h-2.4z" fill="currentColor"/></svg><svg viewBox="0 0 26 12"><rect x=".7" y=".7" width="21.6" height="10.6" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.4" y="2.4" width="14.5" height="7.2" rx="1.8" fill="currentColor"/><rect x="23.6" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".5"/></svg></span>',
};
const dock = (cls = '') => `<div class="dock frost ${cls}">
  <span class="tab on">${I.today}Today</span><span class="tab">${I.train}Train</span><span class="tab">${I.food}Food</span><span class="tab">${I.health}Health</span></div>`;
const seg = '<div class="seg"><i class="on"></i><i class="now"></i><i></i><i></i><i></i></div>';
const cap = (t) => `<p class="cap">${t}</p>`;
const frame = (inner) => `<div class="holder"><div class="frame">${inner}</div></div>`;

function silk() {
  const day = (l, cls, inner = '') => `<span class="${cls === 'today' ? 'now' : ''}">${l}<i class="${cls}">${inner}</i></span>`;
  return cap('Today') + frame(`
  <div class="screen silk">
    <img class="bg" src="img/silk-today.jpg" alt="Folds of deep blue satin">
    <div class="abs veil"></div>
    <div class="sb"><span>16:42</span>${I.sb}</div>
    <div class="abs date">Thursday 12 November</div>
    <div class="abs me frost">O</div>
    <div class="abs week">${day('M', 'did', I.check)}${day('T', 'rest')}${day('W', 'did', I.check)}${day('T', 'today')}${day('F', 'rest')}${day('S', '')}${day('S', 'rest')}</div>
    <div class="abs who"><i class="dot"></i>Coach</div>
    <p class="abs lead">Slept 7 h 40. Bench goes up to 85 kg today.</p>
    <div class="abs chips"><span class="frost">Why 85?</span><span class="frost">Not today</span></div>
    <div class="abs card frost"><small>17:00</small><b>Push</b><em>5 lifts, 55 min</em><div class="start">Start workout</div></div>
    <div class="abs tile frost" style="left:20px"><small>Sleep</small><b>7 h 40</b></div>
    <div class="abs tile frost" style="left:198px"><small>Protein</small><b>96<em>of 180 g</em></b></div>
    <div class="dock frost"><span class="tab on">${I.today}Today</span><span class="tab">${I.train}Train</span><span class="tab">${I.food}Food</span><span class="tab">${I.health}Health</span><span class="tab">${I.mic}Coach</span></div>
  </div>`) + cap('Live workout') + frame(`
  <div class="screen silk plum">
    <img class="bg" src="img/silk-workout.jpg" alt="Folds of plum satin">
    <div class="abs veil"></div>
    <div class="sb"><span>17:04</span>${I.sb}</div>
    ${seg}
    <div class="abs rb frost">${I.down}</div>
    <div class="abs clock frost"><i></i><span>Push</span>22:14</div>
    <div class="abs name"><b>Bench press</b><span>Set 3 of 4</span></div>
    <div class="abs dial frost">
      <small>Weight, kg</small>
      <div class="num">85</div>
      <i class="pm" style="left:18px">${I.minus}</i><i class="pm" style="right:18px">${I.plus}</i>
      <div class="rule"><span style="left:52px">80</span><span style="left:112px">82.5</span><span class="c" style="left:172px">85</span><span style="left:232px">87.5</span><span style="left:292px">90</span></div>
      <i class="mark"></i>
    </div>
    <div class="abs reps"><small>Reps</small><div><i class="frost">4</i><i class="frost">5</i><i class="on">6</i><i class="frost">7</i><i class="frost">8</i></div></div>
    <p class="abs say2"><i class="dot"></i>82.5 moved fast last week. Step up.</p>
    <div class="abs strip frost"><span>Set 1<b>60 × 8</b></span><span>Set 2<b>80 × 6</b></span><span class="now">Now<b>85 × 6</b></span><span>Set 4<b>85 × 6</b></span></div>
    <div class="abs log">Log set 3</div>
    <div class="abs after">Rest starts by itself: 2 min 30</div>
  </div>`);
}

function reed() {
  return cap('Today') + frame(`
  <div class="screen reed">
    <img class="bg" src="img/reed-today.jpg" alt="Morning light through reeded glass">
    <div class="sb" style="color:var(--deep)"><span>16:42</span>${I.sb}</div>
    <div class="abs date">Thursday 12 November</div>
    <div class="abs me">O</div>
    <div class="abs label">Bench press today</div>
    <p class="abs big">85<em>kg</em></p>
    <p class="abs say"><i class="dot"></i>2.5 up on last week. You slept 7 h 40, so today is the day for it.</p>
    <div class="abs day frost">
      <div class="ev past"><time>07:10</time><div><b>Breakfast</b><small>42 g protein</small></div><i class="tick">${I.check}</i></div>
      <div class="ev"><time>17:00</time><div><b>Push</b><small>5 lifts, 55 min</small></div><span class="go">Start</span></div>
      <div class="ev"><time>22:45</time><div><b>Lights out</b><small>8 h before wrestling</small></div></div>
    </div>
    <div class="abs ask frost"><i class="dot"></i>Ask the Coach${I.mic}</div>
    ${dock()}
  </div>`) + cap('Live workout') + frame(`
  <div class="screen reed">
    <img class="bg" src="img/reed-workout.jpg" alt="Green and gold light through reeded glass">
    <div class="abs scrim"></div>
    <div class="sb"><span>17:04</span>${I.sb}</div>
    ${seg}
    <div class="abs rb frost">${I.down}</div>
    <div class="abs clock frost"><i></i><span>Push</span>22:14</div>
    <div class="abs name"><b>Bench press</b><span>Set 3 of 4</span></div>
    <div class="abs drum frost w" style="left:20px;width:214px">
      <span class="n far" style="top:8px">80</span><span class="n up" style="top:42px">82.5</span>
      <span class="band"></span><span class="n cur">85</span>
      <span class="n down" style="top:216px">87.5</span><span class="n far" style="top:268px">90</span>
    </div>
    <div class="abs drum frost r" style="left:244px;width:120px">
      <span class="n far" style="top:8px">4</span><span class="n up" style="top:42px">5</span>
      <span class="band"></span><span class="n cur">6</span>
      <span class="n down" style="top:216px">7</span><span class="n far" style="top:268px">8</span>
    </div>
    <div class="abs unit" style="left:20px;width:214px">kg</div>
    <div class="abs unit" style="left:244px;width:120px">reps</div>
    <p class="abs say2"><i class="dot"></i>82.5 moved fast last week. Step up.</p>
    <div class="abs sets"><span class="frost">Set 1<b>60 × 8</b></span><span class="frost">Set 2<b>80 × 6</b></span><span class="frost now">Now<b>85 × 6</b></span><span class="next">Set 4<b>85 × 6</b></span></div>
    <div class="abs log">Log set 3</div>
    <div class="abs after">Rest starts by itself: 2 min 30</div>
  </div>`);
}

const meta = [
  { name: 'Reed', line: 'Coloured light behind ribbed glass, and one big number that matters right now.', note: '<b>What moves later:</b> the numbers roll like a drum when you drag them, the light behind the glass changes with the time of day and how hard the set is, and the big Today number changes to whatever matters next. Green is one colour it can wear, not the only one.' },
  { name: 'Silk', line: 'Deep colour and soft folds. The Coach speaks first, and the colour changes with what you are doing.', note: '<b>What moves later:</b> the folds drift slowly, the colour warms from blue to plum as the workout gets heavier, and the weight ruler slides under your thumb with a tick for every half kilo.' },
];
const variants = [reed, silk];

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;

function fit() {
  const w = document.documentElement.clientWidth;
  document.documentElement.style.setProperty('--z', Math.min(1.1, Math.min(w, 460) / 384).toFixed(4));
}
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = variants[i]();
  document.getElementById('dir-name').textContent = meta[i].name;
  document.getElementById('dir-line').textContent = meta[i].line;
  document.getElementById('dir-note').innerHTML = meta[i].note;
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
  moveHighlight();
  try { history.replaceState(null, '', '#' + meta[i].name.toLowerCase()); } catch (e) {}
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', () => { fit(); moveHighlight(); });
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
});
fit();
setActive(Math.max(0, meta.findIndex((m) => '#' + m.name.toLowerCase() === location.hash)));
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
