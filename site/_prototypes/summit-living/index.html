<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aven Living Wallpaper</title>
<meta name="theme-color" content="#2a2b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<style>
/* Summit A, "living wallpaper". One real photograph fills the screen; which photograph, and how it is lit, follows the
   real Aarhus sky: the sun's height right now, the weather (Open-Meteo, no key) and the season. Glass, text and the
   white button take their colour from the picture, so a snowy morning gets dark ink and a night gets deep blue glass.
   Everything that moves on its own is transform or opacity (compositor). Fingers drive the sheet and the day scrubber. */
:root {
  --hk: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --disp: "Bricolage Grotesque", var(--hk);
  --s: 1; --H: 832px;
}
html, body { margin: 0; height: 100%; background: #1d1e21; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--hk); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; }
button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
p, h1, h2 { margin: 0; }

/* the phone: 384 css px wide, as tall as the viewport allows; scaled to fit */
.app { position: absolute; left: 0; top: 0; width: 384px; height: var(--H); transform-origin: 0 0; overflow: hidden;
  isolation: isolate; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; -webkit-user-select: none; user-select: none;
  --ink: #fff; --ink2: rgba(255,255,255,.9); --ink3: rgba(255,255,255,.74); --hair: rgba(255,255,255,.2);
  --tint: 38, 34, 32; --ga: .3; --btn: #fff; --btn-ink: #2a2420; --acc: #ffd7a8; --scrim: 20, 16, 14; --sa: .32;
  --ts: 0 1px 12px rgba(var(--scrim), .45); --spring: cubic-bezier(.2,.9,.25,1); --soft: cubic-bezier(.3,.7,.2,1); }
.app.desk { border-radius: 44px; box-shadow: 0 40px 90px -30px rgba(0,0,0,.6); }
.app, .app * { transition-property: color, background-color, box-shadow, border-color; transition-duration: .9s; transition-timing-function: ease; }

/* scene palettes: ink, glass tint, button, accent, scrim */
.app[data-scene=fog]    { --tint: 46,40,38;  --ga: .26; --btn-ink: #2c2420; --acc: #f3c79c; --scrim: 30,22,18; }
.app[data-scene=sun]    { --tint: 54,32,18;  --ga: .26; --btn-ink: #3b1f0b; --acc: #ffbe6e; --scrim: 30,18,10; }
.app[data-scene=dusk]   { --tint: 30,28,52;  --ga: .3;  --btn-ink: #24203f; --acc: #ffb489; --scrim: 20,16,36; }
.app[data-scene=night]  { --tint: 8,30,66;   --ga: .32; --btn-ink: #0b2348; --acc: #9fd0ff; --scrim: 2,16,40; }
.app[data-scene=rain]   { --tint: 10,22,40;  --ga: .32; --btn-ink: #10233d; --acc: #ffb07a; --scrim: 4,10,22; }
.app[data-scene=summer] { --tint: 22,40,62;  --ga: .26; --btn-ink: #13304f; --acc: #ff9ec3; --scrim: 10,24,44; }
.app[data-scene=dawn]   { --ink: #1f2440; --ink2: rgba(31,36,64,.92); --ink3: rgba(31,36,64,.8); --hair: rgba(31,36,64,.16);
  --tint: 255,248,244; --ga: .5; --btn: #1f2440; --btn-ink: #fff; --acc: #e06a7a; --scrim: 255,246,240; --sa: .4; --ts: none; }
.app[data-scene=snow]   { --ink: #1b2342; --ink2: rgba(27,35,66,.92); --ink3: rgba(27,35,66,.8); --hair: rgba(27,35,66,.16);
  --tint: 250,250,255; --ga: .5; --btn: #1b2342; --btn-ink: #fff; --acc: #5872d6; --scrim: 240,242,252; --sa: .45; --ts: none; }

/* wallpaper */
.zoom { position: absolute; inset: -2%; transform: scale(1); }
.wall { position: absolute; inset: 0; animation: drift 46s ease-in-out infinite alternate; }
.wall img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; visibility: hidden;
  transition: opacity 1.4s ease, visibility 0s 1.4s; }
.wall img.on { opacity: 1; visibility: visible; transition: opacity 1.4s ease, visibility 0s; }
@keyframes drift { from { transform: scale(1.03) translate3d(-5px, -3px, 0); } to { transform: scale(1.06) translate3d(5px, 4px, 0); } }
.paused .wall, .paused .wx i, .paused .dot::after { animation-play-state: paused !important; }
.tint { position: absolute; inset: 0; opacity: 0; background: rgb(var(--tc, 4,12,34)); transition: opacity 1.4s ease, background-color 1.4s ease; }
.wx { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.6s ease; }
.wx.on { opacity: 1; }
.wx.fog i { position: absolute; left: 0; top: 30%; width: 200%; height: 46%; background: url(img/fog-veil.png) 0 0 / 50% 100% repeat-x;
  animation: fogmove 90s linear infinite; opacity: .55; }
.wx.fog i + i { top: 52%; animation-duration: 140s; animation-direction: reverse; opacity: .4; }
@keyframes fogmove { to { transform: translate3d(-50%, 0, 0); } }
.wx.snow i { position: absolute; left: 0; top: -100%; width: 100%; height: 200%; background: url(img/snow.png) 0 0 / 400px 800px repeat;
  animation: fall 26s linear infinite; }
.wx.snow i + i { background-size: 280px 560px; animation-duration: 38s; opacity: .7; }
@keyframes fall { to { transform: translate3d(-30px, 50%, 0); } }
.scrim { position: absolute; left: 0; right: 0; pointer-events: none; }
.scrim.top { top: 0; height: 240px; background: linear-gradient(rgba(var(--scrim), var(--sa)), rgba(var(--scrim), 0)); }
.scrim.bot { bottom: 0; height: 330px; background: linear-gradient(rgba(var(--scrim), 0), rgba(var(--scrim), calc(var(--sa) + .08))); }
.sweep { position: absolute; inset: -20% -60%; opacity: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 38%, rgba(255,246,220,.0) 40%, rgba(255,246,220,.38) 50%, rgba(255,246,220,0) 60%, transparent 62%); }

/* glass, recipe A: plain live blur, tint from the picture, a top edge highlight */
.frost { -webkit-backdrop-filter: blur(40px) saturate(1.45); backdrop-filter: blur(40px) saturate(1.45);
  background: linear-gradient(rgba(255,255,255,.07), rgba(255,255,255,.04)), rgba(var(--tint), var(--ga));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 0 0 1px rgba(255,255,255,.08), 0 24px 44px -26px rgba(0,0,0,.55); }
.app[data-scene=dawn] .frost, .app[data-scene=snow] .frost { box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(31,36,64,.12), 0 20px 40px -26px rgba(31,36,64,.4); }
.abs { position: absolute; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
.sbar { position: absolute; top: 12px; left: 26px; right: 24px; height: 20px; display: flex; justify-content: space-between; align-items: center;
  font-size: 14px; font-weight: 600; z-index: 30; text-shadow: var(--ts); pointer-events: none; }
.sbar svg { height: 11px; width: auto; display: block; }

/* views */
.view { position: absolute; inset: 0; }
.view[hidden] { display: block; visibility: hidden; pointer-events: none; }

/* ---------- Today ---------- */
.top { position: absolute; top: 46px; left: 20px; right: 16px; height: 44px; display: flex; align-items: center; gap: 8px; }
.date { flex: 1; font-size: 15px; font-weight: 600; color: var(--ink2); text-shadow: var(--ts); padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 13px; font-size: 15px; font-weight: 600; white-space: nowrap; }
.chip b { font-weight: 700; }
.chip .ico { width: 20px; height: 20px; }
.me { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.me .ico { width: 20px; height: 20px; }
.dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); flex: none; }
.dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: var(--acc); opacity: .35; animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.55); opacity: .45; } 50% { transform: scale(1); opacity: .12; } }

.hero { position: absolute; z-index: 1; left: 22px; right: 22px; top: max(112px, calc((var(--H) - 540px) * .42 + 52px)); text-align: center; text-shadow: var(--ts); }
.hero::before { content: ""; position: absolute; z-index: -1; inset: -40px -50px -20px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(var(--scrim), var(--hs, .3)), rgba(var(--scrim), 0)); }
.app[data-scene=dawn], .app[data-scene=snow] { --hs: .55; }
.app[data-scene=sun], .app[data-scene=rain] { --hs: .5; }
.hero { transition: transform .6s var(--spring); }
.app.coach-on .hero { transform: translate3d(0, 26px, 0); }
.hero .lab { font-size: 15px; font-weight: 600; color: var(--ink2); letter-spacing: .005em; }
.hero .num { font-family: var(--disp); font-size: 124px; line-height: 1; font-weight: 500; letter-spacing: -0.05em; margin-top: 6px; height: 126px;
  display: flex; justify-content: center; align-items: baseline; }
.hero .num u { text-decoration: none; font-family: var(--hk); font-size: 24px; font-weight: 600; letter-spacing: 0; color: var(--ink2); margin-left: 6px; }
.hero h1 { font-family: var(--disp); font-size: 29px; line-height: 34px; font-weight: 600; letter-spacing: -0.025em; margin-top: 10px; text-wrap: balance; }
.hero p { font-size: 16.5px; line-height: 24px; font-weight: 500; color: var(--ink2); margin: 8px auto 0; max-width: 316px; text-wrap: balance; }
.start { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; height: 58px; padding: 0 26px 0 28px; border-radius: 29px; background: var(--btn); color: var(--btn-ink);
  font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-shadow: none; box-shadow: 0 16px 30px -16px rgba(0,0,0,.55);
  transition: transform .18s var(--spring), background-color .9s, color .9s; }
.start small { font-size: 14px; font-weight: 600; opacity: .62; }
.start:active, .log:active, .pm:active, .tile:active, .rbtn:active, .pill:active { transform: scale(.955); transition-duration: .08s; }

.day { position: absolute; left: 12px; right: 12px; bottom: 96px; height: 116px; border-radius: 34px; display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px; gap: 4px; }
.tile { border-radius: 26px; padding: 14px 0 0 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; position: relative;
  transition: transform .2s var(--spring), background-color .2s; }
.tile:hover { background: rgba(255,255,255,.06); }
.tile > span { font-size: 13.5px; font-weight: 600; color: var(--ink3); }
.tile b { font-family: var(--disp); font-size: 25px; line-height: 30px; font-weight: 600; letter-spacing: -0.03em; display: flex; align-items: baseline; }
.tile b u { text-decoration: none; font-family: var(--hk); font-size: 13.5px; font-weight: 600; letter-spacing: 0; margin-left: 3px; color: var(--ink2); }
.tile svg { position: absolute; left: 14px; right: 14px; bottom: 14px; width: calc(100% - 28px); height: 18px; overflow: visible; }
.tile + .tile::before { content: ""; position: absolute; left: -2px; top: 18px; bottom: 18px; width: 1px; background: var(--hair); }

.dock { position: absolute; left: 20px; right: 20px; bottom: 20px; height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(4, 1fr);
  align-items: center; padding: 0 7px; z-index: 5; }
.tab { height: 50px; border-radius: 25px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink2); }
.tab.on { background: rgba(255,255,255,.2); color: var(--ink); }
.app[data-scene=dawn] .tab.on, .app[data-scene=snow] .tab.on { background: rgba(31,36,64,.1); }

/* ---------- Workout ---------- */
.seg { position: absolute; top: 44px; left: 20px; right: 20px; display: grid; gap: 5px; }
.seg i { height: 3px; border-radius: 2px; background: var(--hair); overflow: hidden; position: relative; }
.seg i::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); transition: transform .7s var(--soft); }
.name { position: absolute; top: 62px; left: 24px; right: 80px; text-shadow: var(--ts); }
.name b { display: block; font-family: var(--disp); font-size: 33px; line-height: 38px; font-weight: 600; letter-spacing: -0.035em; white-space: nowrap; }
.name span { display: block; margin-top: 3px; font-size: 15px; font-weight: 600; color: var(--ink2); }
.rb { position: absolute; top: 64px; right: 20px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; }
.pane { position: absolute; top: 146px; left: 12px; right: 12px; height: 288px; border-radius: 40px; overflow: hidden; }
.pane .clear { position: absolute; inset: 0; background: rgba(var(--tint), .5); opacity: 0; pointer-events: none; }
.pane .bar { position: absolute; left: 26px; right: 26px; bottom: 0; height: 3px; border-radius: 2px; background: var(--ink); transform-origin: 0 50%; transform: scaleX(0); opacity: 0; }
.face { position: absolute; inset: 0; transition: opacity .3s ease .1s, transform .5s var(--spring); }
.face.off { opacity: 0; transform: scale(.96); pointer-events: none; transition: opacity .16s ease, transform .4s ease; }
.pane small { position: absolute; top: 21px; left: 26px; font-size: 14.5px; font-weight: 700; }
.pane em { position: absolute; top: 21px; right: 26px; font-style: normal; font-size: 14.5px; font-weight: 600; color: var(--ink2); }
.big { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: baseline; font-family: var(--disp); font-weight: 500; white-space: nowrap; }
.big u { text-decoration: none; font-family: var(--hk); font-weight: 600; letter-spacing: 0; color: var(--ink2); margin-left: 6px; }
.big.kg { top: 44px; font-size: 96px; line-height: 1; letter-spacing: -0.05em; }
.big.kg u { font-size: 21px; }
.big.reps { top: 156px; font-size: 52px; line-height: 1; letter-spacing: -0.04em; }
.big.reps u { font-size: 17px; }
.pm { position: absolute; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.34); transition: transform .18s var(--spring), background-color .2s; }
.app[data-scene=dawn] .pm, .app[data-scene=snow] .pm { background: rgba(31,36,64,.07); box-shadow: inset 0 0 0 1px rgba(31,36,64,.2); }
.pm .ico { width: 20px; height: 20px; stroke-width: 2.2; }
.cline { position: absolute; left: 26px; right: 26px; bottom: 18px; padding-top: 13px; box-shadow: inset 0 1px 0 var(--hair); font-size: 15px; line-height: 21px; font-weight: 500; color: var(--ink2);
  display: flex; gap: 9px; align-items: baseline; }
.cline .dot { transform: translateY(-1px); }
.rest .lab2 { position: absolute; top: 21px; left: 0; right: 0; text-align: center; font-size: 14.5px; font-weight: 700; }
.big.clock { top: 52px; font-size: 104px; line-height: 1; letter-spacing: -0.05em; }
.rest .next { position: absolute; top: 172px; left: 0; right: 0; text-align: center; font-size: 15.5px; font-weight: 600; color: var(--ink2); }
.rest .row3 { position: absolute; left: 22px; right: 22px; bottom: 22px; display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
.rbtn { height: 50px; border-radius: 25px; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); font-size: 15.5px; font-weight: 700;
  transition: transform .18s var(--spring); }
.app[data-scene=dawn] .rbtn, .app[data-scene=snow] .rbtn { background: rgba(31,36,64,.07); box-shadow: inset 0 0 0 1px rgba(31,36,64,.2); }
.rbtn.skip { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
.strip { position: absolute; top: 446px; left: 12px; right: 12px; height: 68px; border-radius: 34px; display: grid; padding: 0 6px; overflow: hidden; }
.strip span { padding: 12px 0 12px 14px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--ink3); position: relative; }
.strip span + span::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 1px; background: var(--hair); }
.strip b { font-size: 15.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.strip b .ico { width: 15px; height: 15px; stroke-width: 2.6; color: var(--acc); }
.strip .now { color: var(--ink); }
.strip .hl { position: absolute; top: 6px; bottom: 6px; border-radius: 28px; background: rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
  transition: transform .55s var(--spring), width .55s var(--spring); }
.app[data-scene=dawn] .strip .hl, .app[data-scene=snow] .strip .hl { background: rgba(31,36,64,.1); }
.log { position: absolute; left: 20px; right: 20px; bottom: 58px; height: 74px; border-radius: 37px; background: var(--btn); color: var(--btn-ink);
  display: grid; place-items: center; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; box-shadow: 0 22px 40px -20px rgba(0,0,0,.6);
  transition: transform .18s var(--spring), background-color .9s, color .9s, opacity .3s; }
.log[disabled] { opacity: .5; }
.after { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font-size: 14.5px; font-weight: 600; color: var(--ink2); text-shadow: var(--ts); }

/* digit roller: numbers roll, they are never swapped */
.roll { display: inline-flex; align-items: flex-start; }
.roll > span { display: inline-grid; }
.roll > span > i { grid-area: 1 / 1; font-style: normal; }

/* ---------- pop-ups ---------- */
.coach { position: absolute; top: 40px; left: 10px; right: 10px; min-height: 70px; border-radius: 30px; z-index: 20; padding: 14px 18px 14px 16px;
  display: flex; gap: 12px; align-items: flex-start; transform: translate3d(0, calc(-100% - 60px), 0); touch-action: none; cursor: grab; }
.coach .dot { margin-top: 7px; }
.coach .tx { flex: 1; }
.coach .who { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; justify-content: space-between; }
.coach p { font-size: 16px; line-height: 22px; font-weight: 600; margin-top: 2px; text-wrap: pretty; }
.coach .acts { display: flex; gap: 8px; margin-top: 10px; }
.coach .pill { height: 36px; }
.pill { height: 40px; padding: 0 16px; border-radius: 20px; font-size: 15px; font-weight: 700; background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
  transition: transform .18s var(--spring); }
.app[data-scene=dawn] .pill, .app[data-scene=snow] .pill { background: rgba(31,36,64,.07); box-shadow: inset 0 0 0 1px rgba(31,36,64,.2); }
.pill.main { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
.float { position: absolute; z-index: 25; pointer-events: none; height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 700; white-space: nowrap; opacity: 0; }
.veil { position: absolute; inset: 0; z-index: 14; background: rgba(var(--scrim), .2); opacity: 0; pointer-events: none; transition: opacity .35s ease; }
.veil.on { opacity: 1; pointer-events: auto; }
.veil.strong { background: rgba(var(--scrim), .55); }
.card { position: absolute; left: 12px; right: 12px; z-index: 16; border-radius: 34px; padding: 22px 22px 20px; opacity: 0; pointer-events: none; transform-origin: 50% 100%; }
.card.on { pointer-events: auto; }
.card h2 { font-family: var(--disp); font-size: 25px; line-height: 30px; font-weight: 600; letter-spacing: -0.025em; }
.card .sub { font-size: 14.5px; line-height: 21px; font-weight: 500; color: var(--ink2); margin-top: 6px; text-wrap: pretty; }
.card .x { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); }
.app[data-scene=dawn] .card .x, .app[data-scene=snow] .card .x { background: rgba(31,36,64,.07); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; margin-top: 18px; }
.bars i { display: block; border-radius: 8px; background: rgba(255,255,255,.3); transform-origin: 50% 100%; position: relative; }
.app[data-scene=dawn] .bars i, .app[data-scene=snow] .bars i { background: rgba(31,36,64,.18); }
.bars i.hi { background: var(--ink); }
.bars i::after { content: attr(data-d); position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink3); }
.meals { margin-top: 14px; display: grid; gap: 2px; }
.meal { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; box-shadow: inset 0 -1px 0 var(--hair); font-size: 15.5px; font-weight: 600; }
.meal span { color: var(--ink3); font-weight: 600; font-size: 14px; }
.card .acts { display: flex; gap: 8px; margin-top: 16px; }
.medal { width: 104px; height: 104px; margin: 4px auto 14px; perspective: 600px; }
.medal div { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-family: var(--disp); font-size: 34px; font-weight: 700; letter-spacing: -0.03em;
  color: #4a3208; background: radial-gradient(circle at 34% 28%, #fff6d6, #f1c766 38%, #c8902c 72%, #9b6a1c);
  box-shadow: inset 0 0 0 5px rgba(255,255,255,.35), inset 0 -6px 14px rgba(120,70,10,.45), 0 18px 34px -14px rgba(0,0,0,.6); }
.rec { text-align: center; }

/* sky sheet */

/* ---------------- springs (sampled into CSS linear()) ---------------- */
function spring(k, c, steps = 64) {
  let x = 0, v = 0; const dt = 1 / 120, pts = []; let t = 0;

  return { e: `linear(0, ${s.join(', ')})`, d: Math.round(t * 1000) };

/* ---------------- sun position for Aarhus (NOAA approximation) ---------------- */
const LAT = 56.157, LON = 10.211;
function sunAlt(date) {
  const rad = Math.PI / 180, d = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const g = (357.529 + 0.98560028 * d) * rad, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24, ha = ((gmst * 15 + LON) * rad - ra);
  return Math.asin(Math.sin(LAT * rad) * Math.sin(dec) + Math.cos(LAT * rad) * Math.cos(dec) * Math.cos(ha)) / rad;

  if (wxClass(W.code) === 'rain') for (let k = i + 1; k < i + 14 && k < SNAP.code.length; k++)
    if (wxClass(SNAP.code[k]) !== 'rain') { const hh = new Date(t0 + k * 3600000).toISOString().slice(11, 16); W.dry = lang === 'da' ? hh.replace(':', '.') : hh; break; }

    const nowH = j.current.time.slice(0, 13); const i0 = j.hourly.time.findIndex((t) => t.slice(0, 13) === nowH);

}

/* ---------------- digit roller ---------------- */
function roll(el, text, instant) {
  // a changed digit travels: the old one moves away and fades, the new one arrives from the side the number moves to.
  // Every frame is transform and opacity only, and nothing is clipped, so no frame can show a cut digit.
  text = String(text); const old = el._t; el._t = text;
  const slot = (ch) => `<span><i>${ch}</i></span>`;
  if (!el.classList.contains('roll') || instant || old == null || old.length !== text.length) {
    el.classList.add('roll'); el.innerHTML = [...text].map(slot).join('');
    if (!instant && old != null && old !== text) el.animate([{ opacity: 0, transform: 'translate3d(0,.18em,0)' }, { opacity: 1, transform: 'none' }], { duration: SP.pop.d, easing: SP.pop.e });
    return;
  }
  const num = (t) => parseFloat(t.replace(/[^0-9.]/g, '')) || 0, dir = num(text) >= num(old) ? 1 : -1;
  [...el.children].forEach((sp, i) => {
    if (old[i] === text[i]) return;
    [...sp.children].slice(0, -1).forEach((x) => x.remove());
    const was = sp.lastElementChild, now = document.createElement('i'); now.textContent = text[i]; sp.appendChild(now);
    was.animate([{ transform: 'none', opacity: 1 }, { transform: `translate3d(0,${-dir * .42}em,0)`, opacity: 0 }], { duration: 190, easing: 'cubic-bezier(.4,0,.8,.6)', fill: 'forwards' }).onfinish = () => was.remove();
    now.animate([{ transform: `translate3d(0,${dir * .42}em,0)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: SP.pop.d, easing: SP.pop.e, delay: i * 18, fill: 'backwards' });
  });
}

addEventListener('resize', fit); fit();

/* ---------------- run ---------------- */
function renderAll() { renderToday(true); if (S.view === 'workout') renderWorkout(true); if (sheetOpen) drawArc(); document.documentElement.lang = lang; }
function clockTick() { $('clock').textContent = hm24(new Date()); if (S.active) { if (S.view === 'today') renderToday(true); if (S.view === 'workout') $('liftSub').textContent = T('setOf', S.si + 1, lift().sets.length, elapsed()); }
  if (sky.live) { sky.t = Date.now(); if (!W.ok) fromSnap(); applySky(); } }
// live weather is fetched again every 30 minutes; the saved forecast follows the hour on each tick
setInterval(() => loadWeather().then(() => { if (sky.live) applySky(); }), 30 * 60000);
document.addEventListener('visibilitychange', () => app.classList.toggle('paused', document.hidden));
if (params.get('scene')) { sky.live = false; const sc = params.get('scene'); sky.wx = ({ night: 'clear', dawn: 'clear', dusk: 'clear', sun: 'clear', summer: 'clear', fog: 'cloudy', rain: 'rain', snow: 'snow' })[sc];
  const st = sunTimes(new Date()); const at = { night: 23, dawn: (st.rise - st.start) / 3600000 + .3, dusk: (st.set - st.start) / 3600000 + .3, sun: 12, summer: 13, fog: 11, rain: 11, snow: 10 }[sc];
  sky.t = st.start + at * 3600000; if (sc === 'summer') sky.season = 7; }
applySky(true); renderAll(); clockTick(); setInterval(clockTick, 15000);
// morning open: the picture settles, the words arrive one by one, then the Coach speaks first
anim($('zoom'), [{ transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { s: 'soft', duration: 1600 });
[...$('hero').children, $('day'), $('dock'), document.querySelector('.top')].forEach((el, i) =>
  anim(el, [{ opacity: 0, transform: 'translate3d(0,18px,0)' }, { opacity: 1, transform: 'none' }], { s: 'pop', delay: 180 + i * 55, fill: 'backwards' }));
loadWeather().then(() => { applySky(); renderAll(); if (params.get('quiet') == null) showCoach(coachLine(), [[T('startNow'), 'start'], [T('later'), 'later']], 900); });
if (params.get('screen') === 'workout') startWorkout();
</script>
</body>
