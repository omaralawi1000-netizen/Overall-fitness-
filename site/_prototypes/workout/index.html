<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Aven 2 · Workout</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="pic" aria-hidden="true"></canvas>
<div class="shade"></div>

<header class="top">
  <button class="pill glass" id="wkBtn" aria-label="Whole workout"><span class="wk">Push</span><span class="clock" id="clock">18:42</span></button>
  <button class="pill glass" id="finishBtn">Finish</button>
</header>

<main class="hero" id="hero">
  <button class="name" id="nameBtn" aria-label="Exercise details"><span id="name">Bench press</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>
  <div class="setline"><span class="lbl" id="label">Set 3 of 4</span><span class="segs" id="segs"></span></div>
  <div class="stage">
    <div class="figures" id="figures">
      <button class="fig" id="kgBtn" aria-label="Change weight"><span class="num" id="kg"></span><span class="unit">kg</span></button>
      <span class="times" aria-hidden="true">×</span>
      <button class="fig" id="repsBtn" aria-label="Change reps"><span class="num" id="reps"></span><span class="unit">reps</span></button>
    </div>
    <div class="timer" id="timer" hidden><span class="num" id="time"></span><span class="unit" id="then"></span></div>
  </div>
  <button class="coach" id="coachBtn" aria-label="What the Coach thinks"><span class="cl"><span class="dot"></span><span id="coach"></span></span></button>
  <p class="meta" id="meta"></p>
</main>

<div class="actions">
  <button class="round glass" id="minus" hidden aria-label="15 seconds less">−15</button>
  <button class="go" id="go"><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="goText">Done</span></button>
  <button class="round glass" id="plus" hidden aria-label="15 seconds more">+15</button>
</div>

<button class="peek glass" id="peek" aria-label="Whole workout">
  <span class="th" id="peekTh"></span>
  <span class="txt"><span class="k" id="peekK">Up next</span><span class="n" id="peekN"></span></span>
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>
</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab" id="grab"></div><div class="sheet-body" id="sheetBody"></div></section>
<div class="toast glass" id="toast" role="status"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<script type="module" src="app.js"></script>
</body>
</html>
