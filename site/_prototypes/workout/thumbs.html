<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aven 2 · Workout thumbnails</title>
<!-- Draws the small exercise pictures in thumbs/ from the same 3D scene as the screen. A headless browser saves window.out. -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
@font-face { font-family: Geist; src: url(../slice/fonts/geist.woff2) format('woff2'); font-weight: 100 900; }
body { margin: 0; background: #000; color: #f5f1ea; font: 14px Geist, system-ui; }
canvas { width: 96px; height: 96px; display: block; }
img { width: 84px; height: 84px; border-radius: 18px; margin: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="all"></div>
<script type="module">
import { createStage } from './stage.js';
import { LOOK, ALTS, EX } from './data.js';
const stage = await createStage(document.getElementById('c'), { thumb: true });
window.out = {};
for (const x of [...EX, ...Object.values(ALTS).flat()]) {
  await stage.show(x.kind, x.sets ? x.sets[0].kg : x.kg, LOOK[x.kind]);
  window.out[x.id] = stage.snapshot();
  document.getElementById('all').append(Object.assign(new Image(), { src: window.out[x.id], title: x.name }));
}
window.ready = true;
</script>
</body>
</html>
