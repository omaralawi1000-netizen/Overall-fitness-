<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Tide: workout screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
<style>
  :root { color-scheme: dark; --ink: #f5f7fa; --ink2: rgba(245, 247, 250, .62); --ink3: rgba(245, 247, 250, .36);
    --now: #7dffe8; --gold: #ffd98a; --pad: 24px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { font-family: Geist, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--now); outline-offset: 3px; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #pool { display: none; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 18px) var(--pad) calc(env(safe-area-inset-bottom) + 18px); }
  .layer { will-change: transform, opacity; }
  .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 500; color: var(--ink2); }
  .clock { font-variant-numeric: tabular-nums; }

  .ex { margin-top: 30px; }
  h1 { margin: 0; font-size: 34px; line-height: 1.04; font-weight: 600; letter-spacing: -.028em; text-wrap: balance; }
  .last { margin: 9px 0 0; font-size: 15px; color: var(--ink2); font-variant-numeric: tabular-nums; }

  .sets { list-style: none; margin: 26px 0 0; padding: 0 0 12px; display: grid; position: relative; }
  .set .lab { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; color: var(--ink3); }
  .set .val { display: block; margin-top: 5px; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink3); }
  .set.done .val { color: var(--ink2); }
  .set.now .val, .set.now .lab { color: var(--ink); }
  .set.best .val { color: var(--gold); }
  .tick { width: 12px; height: 12px; fill: none; stroke: var(--ink2); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 12; stroke-dashoffset: 12; }
  .set.done .tick { stroke-dashoffset: 0; }
  .set.best .tick { stroke: var(--gold); }
  .cursor { position: absolute; left: 0; bottom: 0; width: 26px; height: 2px; border-radius: 1px; background: var(--now);
    box-shadow: 0 0 10px var(--now); }

  .stage { flex: 1; display: grid; min-height: 0; position: relative; }
  .stage > * { grid-area: 1 / 1; }
  .editor { display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-bottom: 6%; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .num { display: flex; align-items: baseline; touch-action: none; cursor: ns-resize; min-width: 0; }
  .roll { display: inline-flex; font-size: 96px; line-height: 1; font-weight: 250; letter-spacing: -.05em;
    font-variant-numeric: tabular-nums; position: relative; }
  .c { display: inline-block; position: relative; }
  .g { display: inline-block; }
  .unit { font-size: 19px; font-weight: 500; color: var(--ink2); margin-left: 10px; white-space: nowrap; }
  .steps { display: flex; gap: 10px; flex: none; }
  .step { width: 56px; height: 56px; border-radius: 50%; position: relative; background: rgba(255, 255, 255, .075);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1), inset 0 -12px 16px -14px rgba(125, 255, 232, .55); transition: transform 180ms cubic-bezier(.2, .8, .2, 1), background-color 180ms; }
  .step:active { transform: scale(.9); background: rgba(255, 255, 255, .14); }
  .step i::before, .step i::after { content: ''; position: absolute; left: 50%; top: 50%; width: 18px; height: 2px;
    margin: -1px 0 0 -9px; border-radius: 1px; background: var(--ink); }
  .step i.plus::after { transform: rotate(90deg); }
  .step i.minus::after { display: none; }

  .rest { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 14%; pointer-events: none; }
  #digits { width: 100%; color: transparent; text-align: center; font-weight: 220; font-variant-numeric: tabular-nums; line-height: 1.18; }
  .note { margin: 14px 0 0; font-size: 17px; font-weight: 450; color: var(--ink2); text-align: center; text-wrap: balance; }
  .rec { margin: 10px 0 0; text-align: center; }
  .rec b { display: block; font-size: 18px; font-weight: 600; color: var(--gold); letter-spacing: -.01em; }
  .rec span { display: block; margin-top: 4px; font-size: 15px; color: var(--ink2); }

  .dock { display: flex; flex-direction: column; gap: 12px; }
  .restBtns { display: flex; gap: 12px; }
  .restBtns button { flex: 1; height: 50px; border-radius: 25px; font-size: 16px; font-weight: 550; }
  #done { height: 66px; border-radius: 33px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; color: rgba(0, 0, 0, .86); }

  .finish { position: absolute; left: var(--pad); right: var(--pad); top: calc(env(safe-area-inset-top) + 78px); pointer-events: none; }
  .finish h2 { margin: 0; font-size: 40px; line-height: 1.02; font-weight: 600; letter-spacing: -.03em; }
  .stats { margin: 34px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 26px 16px; }
  .stats div { display: flex; flex-direction: column-reverse; }
  .stats dd { margin: 0; font-size: 52px; line-height: 1; font-weight: 250; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .stats dt { margin-top: 6px; font-size: 15px; color: var(--ink2); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Without WebGL2 the liquid is a flat pool and the glass is plain fill. */
  html.nogl #gl { display: none; }
  html.nogl #pool { display: block; position: fixed; left: 0; right: 0; bottom: 0; height: 0; background: var(--now); opacity: .55; }
  html.nogl #digits { color: var(--ink); }
  html.nogl #done { background: #eef0f3; }
  html.nogl .restBtns button { background: rgba(255, 255, 255, .14); }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="pool" aria-hidden="true"></div>
<div id="app">
  <header class="top layer" id="top">
    <span id="wkName"></span>
    <span class="clock" id="clock" aria-label=""></span>
  </header>
  <section class="ex layer" id="ex">
    <h1 id="exName"></h1>
    <p class="last" id="exLast"></p>
  </section>
  <ol class="sets layer" id="sets"></ol>
  <div class="stage">
    <section class="editor layer" id="editor">
      <div class="row">
        <div class="num" data-f="w"><span class="roll" id="valW"></span><span class="unit" id="unitW"></span></div>
        <div class="steps">
          <button class="step" data-f="w" data-d="-1" id="lessW"><i class="minus"></i></button>
          <button class="step" data-f="w" data-d="1" id="moreW"><i class="plus"></i></button>
        </div>
      </div>
      <div class="row">
        <div class="num" data-f="r"><span class="roll" id="valR"></span><span class="unit" id="unitR"></span></div>
        <div class="steps">
          <button class="step" data-f="r" data-d="-1" id="lessR"><i class="minus"></i></button>
          <button class="step" data-f="r" data-d="1" id="moreR"><i class="plus"></i></button>
        </div>
      </div>
    </section>
    <section class="rest layer" id="rest">
      <div id="digits" role="timer"></div>
      <div class="rec" id="rec" aria-live="polite"></div>
      <p class="note" id="note"></p>
    </section>
  </div>
  <footer class="dock">
    <div class="restBtns layer" id="restBtns">
      <button id="add"></button>
      <button id="skip"></button>
    </div>
    <button id="done" class="layer"></button>
  </footer>
  <section class="finish layer" id="finish" aria-live="polite">
    <h2 id="finTitle"></h2>
    <dl class="stats">
      <div><dt id="fMinL"></dt><dd id="fMin"></dd></div>
      <div><dt id="fSetsL"></dt><dd id="fSets"></dd></div>
      <div><dt id="fKgL"></dt><dd id="fKg"></dd></div>
      <div><dt id="fBestL"></dt><dd id="fBest"></dd></div>
    </dl>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
