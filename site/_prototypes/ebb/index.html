<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aven Ebb</title>
<meta name="theme-color" content="#7fd2cc">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&display=swap">
<style>
/* Ebb: everything you log is water.
   Today looks down into sunlit shallows (caustic light on sand). The workout dives under the surface:
   a deeper side view with light shafts, where each set is a glass tube that fills, the rest timer is a
   water clock (a clepsydra) that drips empty, and a new best turns the water gold and still.
   One drawn background (WebGL), small 2D canvases for the glass, DOM for everything you read and tap. */
:root {
  --ink: #04313a;
  --ink-2: rgba(4, 49, 58, .78);
  --ink-3: rgba(4, 49, 58, .48);
  --frost: rgba(255, 255, 255, .44);
  --frost-hi: rgba(255, 255, 255, .55);
  --rim: rgba(255, 255, 255, .78);
  --press: #053f4c;
  --on-press: #eafffb;
  --w-ink: #ffffff;
  --w-ink-2: rgba(255, 255, 255, .74);
  --w-ink-3: rgba(255, 255, 255, .54);
  --w-frost: rgba(255, 255, 255, .13);
  --w-rim: rgba(255, 255, 255, .34);
  --liq: #39c6d6;
  --gold: #f2c45a;
  --font: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --spring: cubic-bezier(.2, 1.18, .32, 1);
  --ease: cubic-bezier(.22, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: #6fc9c6;
  font-family: var(--font);
  font-optical-sizing: auto;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
canvas { display: block; }
#sea, #fx { position: fixed; inset: 0; width: 100%; height: 100%; }
#fx { pointer-events: none; z-index: 30; }
.screen {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  padding: max(18px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
  opacity: 0; transform: translateY(26px); visibility: hidden; pointer-events: none;
  transition: opacity .42s var(--ease), transform .6s var(--ease), visibility 0s .6s;
  will-change: transform, opacity;
}
.screen.on { opacity: 1; transform: none; visibility: visible; pointer-events: auto; transition: opacity .5s var(--ease) .18s, transform .7s var(--spring) .18s, visibility 0s; }
.screen.up { transform: translateY(-30px); }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.pane {
  background: var(--frost);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  backdrop-filter: blur(22px) saturate(1.5);
  border-radius: 26px;
  box-shadow: inset 0 1px 0 var(--rim), inset 0 0 0 1px rgba(255,255,255,.22), 0 10px 30px -18px rgba(0, 40, 50, .45);
}
.press { transition: transform .16s var(--ease); }
.press:active, .press.down { transform: scale(.96); transition-duration: .06s; }

/* ---------- rolling digits ---------- */
.roll { display: inline-flex; white-space: nowrap; line-height: 1; }
.roll .s { display: inline-block; height: 1em; overflow: hidden; position: relative; }
.roll .c { display: block; transition: transform .62s var(--spring); }
.roll .c span { display: block; height: 1em; text-align: center; }
.roll .p { display: inline-block; }

/* ---------- Today ---------- */
#today .top { display: flex; align-items: center; justify-content: space-between; height: 40px; }
.date { font-size: 15px; font-weight: 500; color: var(--ink-2); letter-spacing: .005em; }
.themes { display: flex; gap: 6px; }
.themes button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.themes i {
  width: 16px; height: 19px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: radial-gradient(circle at 36% 30%, rgba(255,255,255,.9) 0 12%, transparent 32%), var(--c);
  box-shadow: inset 0 -2px 4px rgba(0,0,0,.18), 0 2px 5px -2px rgba(0,30,40,.4);
  transform: rotate(180deg) scale(.82); transition: transform .4s var(--spring);
}
.themes button[aria-checked="true"] i { transform: rotate(180deg) scale(1.08); box-shadow: inset 0 -2px 4px rgba(0,0,0,.18), 0 0 0 2px rgba(255,255,255,.9), 0 2px 6px -2px rgba(0,30,40,.5); }
.hero { margin-top: clamp(36px, 10vh, 100px); }
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.session { font-size: 118px; font-weight: 560; letter-spacing: -.055em; line-height: .86; margin: 10px 0 0 -6px; font-variation-settings: "opsz" 96; }
.plan { margin-top: 14px; font-size: 17px; font-weight: 450; color: var(--ink-2); line-height: 1.35; }
.plan b { font-weight: 600; color: var(--ink); }
.coach {
  margin-top: 22px; display: flex; gap: 12px; align-items: flex-start; text-align: left;
  padding: 15px 18px 16px; font-size: 16.5px; line-height: 1.38; font-weight: 450; width: 100%;
}
.dot { flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--press); position: relative; }
.dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid currentColor; opacity: 0; animation: breathe 3.2s var(--ease) infinite; color: var(--press); }
@keyframes breathe { 0% { transform: scale(.5); opacity: .55; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
.body { margin-top: 12px; padding: 16px 16px 14px; display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 6px 10px; align-items: end; }
.water { display: flex; align-items: flex-end; gap: 10px; text-align: left; border-radius: 18px; margin: -6px; padding: 6px; }
#glass { width: 46px; height: 64px; flex: none; }
.stat b, .water b { white-space: nowrap; display: block; font-size: 25px; font-weight: 560; letter-spacing: -.03em; line-height: 1; }
.stat small, .water small { font-size: 15px; font-weight: 500; letter-spacing: 0; }
.lbl { display: block; margin-top: 5px; font-size: 13px; font-weight: 500; color: var(--ink-2); line-height: 1.2; }
.bar { display: block; margin-top: 7px; height: 6px; border-radius: 4px; background: rgba(4,49,58,.12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; border-radius: 4px; transform-origin: left; transform: scaleX(var(--v)); background: linear-gradient(90deg, var(--liq), var(--press)); }
.week { grid-column: 1 / -1; display: flex; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(4,49,58,.1); }
.week div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); width: 34px; }
.week i { width: 12px; height: 15px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(180deg); border: 1.5px solid rgba(4,49,58,.28); }
.week .done i { border: 0; background: radial-gradient(circle at 40% 70%, rgba(255,255,255,.75) 0 10%, transparent 30%), linear-gradient(0deg, var(--liq), var(--press)); }
.week .now { color: var(--ink); }
.week .now i { border-color: var(--press); border-style: dashed; }
.cta {
  margin-top: auto; height: 66px; border-radius: 33px; width: 100%;
  background: var(--press); color: var(--on-press); font-size: 19px; font-weight: 600; letter-spacing: -.01em;
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 14px 30px -14px rgba(0, 40, 50, .7);
}
.cta::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(60% 120% at 50% 130%, rgba(120, 240, 240, .35), transparent 70%);
}
.cta .shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.16) 50%, transparent 65%); transform: translateX(-100%); animation: shine 5.5s var(--ease) 1.2s infinite; }
@keyframes shine { 0%, 62% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.cta span { position: relative; }
.cta .live { font-weight: 450; opacity: .8; }

/* ---------- Workout ---------- */
#work { color: var(--w-ink); }
.wtop { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.wtop button, .chip { height: 40px; padding: 0 16px; border-radius: 20px; font-size: 15px; font-weight: 550; background: var(--w-frost); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 var(--w-rim); }
#clock { font-size: 15px; font-weight: 500; color: var(--w-ink-2); }
.ex { margin-top: 18px; }
.ex h2 { font-size: 34px; font-weight: 560; letter-spacing: -.035em; line-height: 1; transition: opacity .25s, filter .25s, transform .4s var(--spring); }
.ex h2.swap { opacity: 0; filter: blur(6px); transform: translateY(6px); }
.ex p { margin-top: 8px; font-size: 15.5px; color: var(--w-ink-2); font-weight: 450; }
.ex p b { color: var(--w-ink); font-weight: 600; }
.stage { position: relative; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(40px); pointer-events: none; transition: opacity .3s var(--ease), transform .5s var(--ease); }
.view.on { opacity: 1; transform: none; pointer-events: auto; transition: opacity .45s var(--ease) .12s, transform .7s var(--spring) .12s; }
.view.gone { transform: translateY(-40px); }
.big { margin-top: 3.5vh; display: flex; align-items: baseline; justify-content: center; gap: 6px; width: 100%; }
.big .kg { font-size: 112px; font-weight: 520; letter-spacing: -.05em; }
.big .unit { font-size: 22px; font-weight: 500; color: var(--w-ink-2); margin-right: 10px; }
.big .x { font-size: 34px; font-weight: 400; color: var(--w-ink-3); }
.big .reps { font-size: 64px; font-weight: 520; letter-spacing: -.04em; }
#rack { width: 100%; height: 168px; margin-top: auto; margin-bottom: 62px; }
.bubble { position: absolute; top: calc(3.5vh + 124px); left: 0; right: 0; margin: 0 auto; width: max-content; display: flex; gap: 10px; align-items: center; height: 42px; padding: 0 16px 0 14px; border-radius: 21px; font-size: 15px; font-weight: 550; white-space: nowrap; background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 var(--w-rim); animation: bob 4s ease-in-out infinite; transition: opacity .3s, scale .35s var(--spring); }
.bubble .dot { margin: 0; width: 8px; height: 8px; background: #fff; }
.bubble .dot::after { color: #fff; }
.bubble.hide { opacity: 0; scale: .7; pointer-events: none; }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
.rest .eyebrow { margin-top: 1.5vh; color: var(--w-ink-3); }
.countdown { font-size: 92px; font-weight: 500; letter-spacing: -.04em; margin-top: 6px; }
#clep { width: 170px; height: 300px; margin-top: 4px; }
.next { margin-top: auto; margin-bottom: 64px; font-size: 16px; color: var(--w-ink-2); font-weight: 450; }
.next b { color: var(--w-ink); font-weight: 600; }
.dock { position: relative; padding: 14px; border-radius: 30px; background: var(--w-frost); box-shadow: inset 0 1px 0 var(--w-rim), inset 0 0 0 1px rgba(255,255,255,.08); height: 186px; }
.ctl { position: absolute; inset: 14px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: translateY(14px) scale(.98); pointer-events: none; transition: opacity .2s, transform .3s var(--ease); }
.ctl.on { opacity: 1; transform: none; pointer-events: auto; transition: opacity .3s .1s, transform .5s var(--spring) .1s; }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.step { display: flex; align-items: center; justify-content: space-between; height: 66px; border-radius: 22px; background: rgba(255,255,255,.1); padding: 0 4px; }
.step button { width: 54px; height: 58px; border-radius: 18px; font-size: 28px; font-weight: 400; display: grid; place-items: center; color: var(--w-ink); }
.step button:active { background: rgba(255,255,255,.14); }
.step div { text-align: center; }
.step b { display: block; font-size: 23px; font-weight: 560; letter-spacing: -.02em; }
.step .u { display: block; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--w-ink-3); margin-top: 3px; }
.log { flex: 1; border-radius: 26px; background: #fff; color: var(--press); font-size: 20px; font-weight: 620; letter-spacing: -.01em; position: relative; overflow: hidden; box-shadow: 0 12px 26px -14px rgba(0,0,0,.5); }
.log span { position: relative; }
.log::after { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: var(--liq); opacity: 0; transform: scale(0); }
.log.pour::after { animation: pour .5s var(--ease); }
@keyframes pour { 0% { opacity: .55; transform: scale(.2); } 100% { opacity: 0; transform: scale(9); } }
.restbtns { flex-direction: row; align-items: stretch; }
.restbtns button { border-radius: 26px; font-size: 17px; font-weight: 600; }
.restbtns .side { width: 88px; background: rgba(255,255,255,.1); }
.restbtns .log { flex: 1; }
.resthint { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 13px; color: var(--w-ink-3); }

/* ---------- tray, toast, sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 30, 40, .28); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
.scrim.on { opacity: 1; pointer-events: auto; }
.screen.dim { opacity: .3 !important; transition: opacity .35s var(--ease) !important; }
.pop {
  position: fixed; left: 12px; right: 12px; top: 0; z-index: 41; visibility: hidden;
  padding: 22px 20px 16px; border-radius: 32px; color: var(--ink);
  background: rgba(255,255,255,.8);
}
.pop.on { visibility: visible; }
.tray .who { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.tray .who .dot { margin: 0; }
.tray p { margin-top: 12px; font-size: 21px; line-height: 1.32; font-weight: 480; letter-spacing: -.012em; }
.tray p b { font-weight: 620; }
.tray .row { display: flex; gap: 10px; margin-top: 20px; }
.tray .row button { height: 58px; border-radius: 29px; font-size: 17px; font-weight: 600; padding: 0 20px; }
.tray .yes { flex: 1; background: var(--press); color: var(--on-press); }
.tray .no { background: rgba(4,49,58,.08); }
.toast {
  position: fixed; left: 50%; z-index: 35; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 200px);
  display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 6px 0 18px; border-radius: 24px;
  font-size: 15px; font-weight: 550; color: #fff; white-space: nowrap;
  background: rgba(3, 40, 50, .5);
  transform: translate(-50%, 16px) scale(.94); opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .35s var(--ease);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; transition: opacity .3s, transform .5s var(--spring); }
.toast.today { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 84px); }
.toast button { height: 38px; padding: 0 14px; border-radius: 19px; background: rgba(255,255,255,.18); font-weight: 650; }
.toast button[disabled] { opacity: .5; }

.sheet { padding: 26px 20px 18px; border-radius: 34px; }
.sheet h3 { font-size: 34px; font-weight: 580; letter-spacing: -.035em; line-height: 1; }
.sheet .sub { margin-top: 8px; font-size: 16px; color: var(--ink-2); }
.hold { margin-top: 26px; width: 100%; height: 70px; border-radius: 35px; position: relative; overflow: hidden; background: rgba(4,49,58,.1); font-size: 19px; font-weight: 620; color: var(--ink); }
.hold .fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--liq), var(--press)); transition: transform .45s var(--ease); }
.hold.held .fill { transform: scaleX(1); transition: transform 1.05s cubic-bezier(.4, .1, .6, 1); }
.hold span { position: relative; transition: color .3s; }
.hold.held span { color: #fff; transition-delay: .4s; }
.hold small { display: block; font-size: 13px; font-weight: 500; opacity: .7; }
.sheet .total { margin-top: 18px; font-size: 76px; font-weight: 540; letter-spacing: -.05em; display: flex; align-items: baseline; gap: 8px; }
.sheet .total small { font-size: 22px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }
.sumrows { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.sumrow { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; padding: 12px 0; border-top: 1px solid rgba(4,49,58,.1); }
.sumrow b { font-weight: 600; }
.sumrow span { color: var(--ink-2); text-align: right; }
.sumrow .skip { font-style: normal; opacity: .6; }
.sumrow .star { color: #b07b0d; font-weight: 650; }
.sheet .done { margin-top: 16px; width: 100%; height: 62px; border-radius: 31px; background: var(--press); color: var(--on-press); font-size: 18px; font-weight: 600; }
.sheet .cancel { margin-top: 10px; width: 100%; height: 50px; font-size: 16px; font-weight: 550; color: var(--ink-2); }
.face { transition: opacity .3s var(--ease); }
.face[hidden] { display: none; }

/* ---------- new best ---------- */
.pr { position: fixed; inset: 0; z-index: 38; padding-bottom: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; pointer-events: none; }
.pearl {
  width: 168px; height: 168px; border-radius: 50%;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,0) 22%),
    radial-gradient(circle at 62% 78%, rgba(255,245,210,.55) 0 10%, rgba(255,255,255,0) 36%),
    radial-gradient(circle at 50% 50%, #ffe6a0 0%, #f2c45a 46%, #c58a1d 100%);
  box-shadow: inset -10px -16px 30px rgba(120, 70, 0, .35), inset 8px 10px 22px rgba(255,255,255,.35), 0 26px 60px -20px rgba(80, 50, 0, .6);
  display: grid; place-items: center; color: #5a3a00; font-size: 70px; font-weight: 560; letter-spacing: -.04em;
  opacity: 0; transform: scale(.1);
}
.pr { text-shadow: 0 1px 14px rgba(90, 50, 0, .5); }
.pr .t1 { margin-top: 30px; font-size: 14px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; opacity: 0; transform: translateY(12px); }
.pr .t2 { margin-top: 8px; font-size: 44px; font-weight: 560; letter-spacing: -.035em; opacity: 0; transform: translateY(14px); }
.pr .t3 { margin-top: 8px; font-size: 16px; font-weight: 500; color: #fff; opacity: 0; transform: translateY(14px); }
.pr.on { pointer-events: auto; }
.pr.on .pearl { animation: swell 1.1s var(--spring) forwards, jiggle 2.6s ease-in-out 1.1s infinite; }
.pr.on .t1, .pr.on .t2, .pr.on .t3 { opacity: 1; transform: none; transition: opacity .5s var(--ease), transform .7s var(--spring); }
.pr.on .t1 { transition-delay: .45s; } .pr.on .t2 { transition-delay: .55s; } .pr.on .t3 { transition-delay: .65s; }
.pr.off .pearl { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(.16); transition: transform .62s cubic-bezier(.5, 0, .75, .4), opacity .2s .5s; animation: none; }
.pr.off .pearl.gone { opacity: 0; }
.pr.off .t1, .pr.off .t2, .pr.off .t3 { opacity: 0; transition: opacity .2s; }
@keyframes swell { 0% { opacity: 0; transform: scale(.1); } 30% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
@keyframes jiggle { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(1.025, .975); } 50% { transform: scale(.985, 1.015); } 75% { transform: scale(1.01, .99); } }

@media (max-height: 760px) {
  .session { font-size: 96px; }
  .hero { margin-top: 4vh; }
  .big .kg { font-size: 92px; }
  .big .reps { font-size: 54px; }
  .bubble { top: calc(3.5vh + 104px); }
  #rack { height: 150px; margin-bottom: 56px; }
  .countdown { font-size: 76px; }
  #clep { height: 250px; width: 150px; }
  .dock { height: 176px; }
}
@media (prefers-reduced-motion: reduce) {
  .cta .shine, .dot::after, .bubble { animation: none; }
  .pr.on .pearl { animation: none; opacity: 1; transform: none; }
}
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>

<main id="today" class="screen on" aria-label="Today">
  <header class="top">
    <div class="date" id="tDate"></div>
    <div class="themes" role="radiogroup" id="themes"></div>
  </header>
  <section class="hero">
    <div class="eyebrow" id="tEyebrow"></div>
    <h1 class="session" id="tSession"></h1>
    <p class="plan" id="tPlan"></p>
  </section>
  <button class="pane coach press" id="tCoach"><span class="dot"></span><span id="tCoachTxt"></span></button>
  <section class="pane body">
    <button class="water press" id="water" aria-label="Add water">
      <canvas id="glass"></canvas>
      <div><b><span class="num" id="waterNum"></span><small> L</small></b><span class="lbl" id="waterLbl"></span></div>
    </button>
    <div class="stat"><b class="num">7<small> h </small>40</b><span class="lbl" id="sleepLbl"></span></div>
    <div class="stat"><b><span class="num" id="protNum"></span><small> g</small></b><span class="lbl" id="protLbl"></span><i class="bar"><i id="protBar" style="--v:.6"></i></i></div>
    <div class="week" id="week"></div>
  </section>
  <button class="cta press" id="start"><span class="shine"></span><span id="startTxt"></span></button>
</main>

<main id="work" class="screen" aria-label="Workout">
  <header class="wtop">
    <button class="press" id="back"></button>
    <span class="num" id="clock">0:00</span>

class Surf {

  slosh(amt) { for (let i = 0; i < this.n; i++) this.v[i] += amt * (i / (this.n - 1) - 0.5) * 2; }

    const { h, v, n } = this; let e = 0;

    }

function setupCanvas(cv) {

          const start = old[di] ?? 0; c.dataset.d = start; c.style.transition = 'none'; c.style.transform = `translateY(${-start}em)`;
          s.appendChild(c); el.appendChild(s); di++;

}

/* The water clock: the top chamber holds the rest, it drips into the bottom one, a bead swells at the neck. */
const clep = (() => {
  const o = { top: new Surf(12), bot: new Surf(12), shown: 0, drops: [], bead: 0, last: false, active: false };
  let c, G;
  o.layout = () => {
    c = setupCanvas($('clep')); const w = c.w, h = c.h;
    const cw = Math.min(124, w - 30), x = (w - cw) / 2, ch = (h - 60) / 2;
    G = { top: { x, y: 20, w: cw, h: ch }, neckY: 20 + ch, neckH: 22, bot: { x, y: 20 + ch + 22, w: cw, h: ch + 10 } };
  };

  o.draw = () => {
    if (!c) return; const { ctx, w, h } = c; ctx.clearRect(0, 0, w, h);
    const T = G.top, B = G.bot, cx = w / 2;
    const pouring = o.target > o.shown + 0.01;
    if (pouring) { ctx.fillStyle = theme.liq[0]; ctx.globalAlpha = .9; rr(ctx, cx - 2, 0, 4, T.y + T.h * (1 - o.shown) + 4, 2); ctx.fill(); ctx.globalAlpha = 1; }
    vessel(ctx, () => { ctx.beginPath(); ctx.roundRect(T.x, T.y, T.w, T.h, [40, 40, 22, 22]); }, T, o.shown * 0.9, o.top, theme.liq, {});
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(cx - 5, G.neckY); ctx.lineTo(cx - 5, G.neckY + G.neckH); ctx.moveTo(cx + 5, G.neckY); ctx.lineTo(cx + 5, G.neckY + G.neckH); ctx.stroke(); ctx.restore();
    const bl = (1 - o.shown) * (W.phase === 'rest' || W.phase === 'pr' ? 1 : 0);
    vessel(ctx, () => { ctx.beginPath(); ctx.roundRect(B.x, B.y, B.w, B.h, [22, 22, 40, 40]); }, B, bl * 0.86, o.bot, theme.liq, {});
    if (o.shown > 0.003 && o.bead > 0) {
      const r = 1.5 + o.bead * 3.6, by = G.neckY + G.neckH + r * .8;
      const g = ctx.createRadialGradient(cx - r * .3, by - r * .3, 0, cx, by, r); g.addColorStop(0, '#fff'); g.addColorStop(.35, theme.liq[0]); g.addColorStop(1, theme.liq[1]);
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, by, r * .9, r * 1.08, 0, 0, Math.PI * 2); ctx.fill();
    }
    o.drops.forEach((d) => {
      const g = ctx.createRadialGradient(cx - 1, d.y - 1, 0, cx, d.y, 4); g.addColorStop(0, '#fff'); g.addColorStop(.4, theme.liq[0]); g.addColorStop(1, theme.liq[1]);
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, d.y, 3, 3 + Math.min(4, d.v / 160), 0, 0, Math.PI * 2); ctx.fill();

/* ---------- drops that fly (the logged set pours into its tube) ---------- */
const fx = (() => {
  const cv = $('fx'); let ctx, w, h, drops = [];
  const size = () => { cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; ctx = cv.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); w = innerWidth; h = innerHeight; };
  size(); addEventListener('resize', size);
  const o = {};
  o.launch = (from, to, cols, done) => {
    const T = 0.46, g = 2400;
    drops.push({ x: from.x, y: from.y, vx: (to.x - from.x) / T, vy: (to.y - from.y - 0.5 * g * T * T) / T, g, t: 0, T, cols, done, r: 11 });

  };
  o.step = (dt) => {
    ctx.clearRect(0, 0, w, h);
    drops = drops.filter((d) => {
      d.t += dt; if (d.t >= d.T) { d.done(); return false; }
      d.vy += d.g * dt; d.x += d.vx * dt; d.y += d.vy * dt;
      const sp = Math.hypot(d.vx, d.vy), a = Math.atan2(d.vy, d.vx), st = 1 + Math.min(.6, sp / 3000);

      const gr = ctx.createRadialGradient(-r * .2, -r * .35, 0, 0, 0, r); gr.addColorStop(0, '#fff'); gr.addColorStop(.3, d.cols[0]); gr.addColorStop(1, d.cols[1]);
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      return true;

  };

})();

  nextLine();
  cd(mmss(REST), true);
  swapView($('vLift'), $('vRest')); $('cLift').classList.remove('on'); $('cRest').classList.add('on');
  clep.start(); tickRest(); rack.draw();
}
function nextLine() {
  const e = ex();
  if (e.done.length < e.sets) $('nextLine').innerHTML = `${S.next} · <b>${fmt(e.kg)} kg × ${e.reps}</b>`;
  else if (W.ex[W.i + 1]) { const n = W.ex[W.i + 1]; $('nextLine').innerHTML = `${S.nextEx} · <b>${S[n.key]}</b>`; }
  else $('nextLine').innerHTML = S.finishNow;
}
let restTimer;
function tickRest() {
  clearTimeout(restTimer);
  if (W.phase !== 'rest' && W.phase !== 'pr') return;
  const left = (W.restEnd - performance.now()) / 1000;
  if (left <= 0) return endRest();
  cd(mmss(Math.ceil(left)));
  if (!$('work').classList.contains('on')) renderToday();
  restTimer = setTimeout(tickRest, (left % 1) * 1000 + 20);
}
function endRest(silent) {
  clearTimeout(restTimer); clep.stop();
  W.phase = 'lift';
  swapView($('vRest'), $('vLift')); $('cRest').classList.remove('on'); $('cLift').classList.add('on');
  if (silent) return;
  const r = $('clep').getBoundingClientRect(); sea.ripple(r.left + r.width / 2, r.top + r.height * .8, 1); haptic([10, 40, 10]);
  const e = ex();
  if (e.done.length >= e.sets && W.ex[W.i + 1]) { W.i++; renderEx(true); }
  else { renderSet(); rack.draw(); if (e.done.length >= e.sets && !W.ex[W.i + 1]) setTimeout(openHold, 500); }
  if (!$('work').classList.contains('on')) renderToday();
}
$('plus').onclick = () => { W.restEnd += 15000; W.restTotal += 15; haptic(6); tickRest(); wake(clep); };
$('minus').onclick = () => { W.restEnd = Math.max(performance.now() + 1000, W.restEnd - 15000); haptic(6); tickRest(); };
$('skip').onclick = () => { W.restEnd = Math.min(W.restEnd, performance.now() + 650); haptic(6); tickRest(); };

function showPR(set, idx) {
  W.phase = 'pr'; W.restTotal = REST; W.restEnd = performance.now() + REST * 1000 + 2600;
  const e = ex(), d = e.bestE - set.prevBest;
  $('pearl').textContent = set.reps; $('prT1').textContent = S.newBest;
  $('prT2').textContent = `${fmt(set.kg)} × ${set.reps}`; $('prT3').textContent = S.est(fmt(e.bestE), fmt(d));
  sea.goldTo = 1; sea.speedTo = 0.12; sea.ripple(innerWidth / 2, innerHeight * .36, .9);
  const pr = $('pr'); pr.classList.remove('off'); $('pearl').classList.remove('gone'); pr.offsetWidth; pr.classList.add('on');
  $('work').style.opacity = '.0'; $('work').style.transition = 'opacity .45s';
  prTimer = setTimeout(() => hidePR(false, idx), 2900);
}
let prTimer;
function hidePR(cancel, idx) {
  clearTimeout(prTimer);
  const pr = $('pr'); sea.goldTo = 0; sea.speedTo = 1; $('work').style.opacity = '';
  if (cancel) { pr.classList.remove('on', 'off'); return; }
  const p = $('pearl').getBoundingClientRect(), t = rack.tubePoint(idx);
  pr.style.setProperty('--dx', `${t.x - (p.left + p.width / 2)}px`); pr.style.setProperty('--dy', `${t.y + 20 - (p.top + p.height / 2)}px`);
  pr.classList.remove('on'); pr.classList.add('off');
  setTimeout(() => { $('pearl').classList.add('gone'); rack.tubes[idx] && rack.tubes[idx].surf.kick(.5, 50); wake(rack); haptic(8); }, 560);
  setTimeout(() => { pr.classList.remove('off'); if (W.phase === 'pr') { W.phase = 'lift'; startRest(); } }, 800);
}
$('pr').addEventListener('click', () => W.phase === 'pr' && hidePR(false, ex().done.length - 1));

/* ---------- pop-ups that morph out of what you tapped ----------
   The panel is placed around the element you touched, then its clip grows from that element's exact
   shape to the full card (no fade-in from nowhere). Closing shrinks it back into the same element. */
const MORPH_IN = RM ? 1 : 540, MORPH_OUT = RM ? 1 : 360;
const insetOf = (s, p, r) => `inset(${s.top - p.top}px ${p.right - s.right}px ${p.bottom - s.bottom}px ${s.left - p.left}px round ${r}px)`;
function placeAt(panel, src) {
  panel.style.top = '0px'; const h = panel.offsetHeight, s = src.getBoundingClientRect();
  const top = clamp(s.top + s.height / 2 - h / 2, 14, innerHeight - h - 14);
  panel.style.top = `${top}px`;
}
function morphOpen(panel, src, opt = {}) {
  panel.getAnimations().forEach((x) => x.cancel());
  panel.classList.add('on');
  if (!opt.keepTop) placeAt(panel, src);
  const p = panel.getBoundingClientRect(), s = opt.fromRect || src.getBoundingClientRect();
  const sr = opt.fromR ?? (parseFloat(getComputedStyle(src).borderRadius) || 20), R = parseFloat(getComputedStyle(panel).borderRadius) || 32;
  panel._src = src;
  panel.animate([{ clipPath: insetOf(s, p, Math.min(sr, s.height / 2)), opacity: opt.fromOp ?? .55 }, { clipPath: `inset(0px 0px 0px 0px round ${R}px)`, opacity: 1 }],
    { duration: MORPH_IN, easing: 'cubic-bezier(.18,1.08,.3,1)' });
  panel.querySelectorAll('.face:not([hidden]) > *, .tray > *').forEach((el, i) => el.animate(
    [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
    { duration: RM ? 1 : 380, delay: RM ? 0 : 120 + i * 35, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'backwards' }));
  if (src && !opt.keepSrc) src.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: 'forwards' });
  $('scrim').classList.add('on'); document.querySelector('.screen.on')?.classList.add('dim');
}
function morphClose(panel, done) {
  if (!panel.classList.contains('on')) return done && done();
  const src = panel._src, p = panel.getBoundingClientRect();
  const visible = src && src.offsetParent !== null && src.getBoundingClientRect().width > 0;
  const s = visible ? src.getBoundingClientRect() : { top: p.bottom - 60, bottom: p.bottom, left: p.left + 40, right: p.right - 40, height: 60 };
  const sr = visible ? (parseFloat(getComputedStyle(src).borderRadius) || 20) : 30;
  panel.getAnimations().forEach((x) => x.cancel());
  const an = panel.animate([{ clipPath: `inset(0px 0px 0px 0px round 32px)`, opacity: 1 }, { clipPath: insetOf(s, p, Math.min(sr, s.height / 2)), opacity: .4 }],
    { duration: MORPH_OUT, easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' });
  if (src) setTimeout(() => { src.getAnimations().forEach((x) => x.cancel()); src.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160 }); }, MORPH_OUT - 120);
  $('scrim').classList.remove('on'); document.querySelectorAll('.screen.dim').forEach((x) => x.classList.remove('dim'));
  an.onfinish = () => { panel.classList.remove('on'); an.cancel(); done && done(); };
}
/* Grow an open panel in place when its content changes (hold card -> summary). */
function morphGrow(panel, change) {
  const before = panel.getBoundingClientRect(); change();
  const after = panel.getBoundingClientRect();
  panel.getAnimations().forEach((x) => x.cancel());
  panel.animate([{ clipPath: insetOf(before, after, 34) }, { clipPath: 'inset(0px 0px 0px 0px round 34px)' }], { duration: RM ? 1 : 620, easing: 'cubic-bezier(.18,1.06,.3,1)' });
  panel.querySelectorAll('.face:not([hidden]) > *').forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }],
    { duration: RM ? 1 : 420, delay: RM ? 0 : 140 + i * 45, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'backwards' }));
}
const anyPop = () => $('tray').classList.contains('on') || $('sheet').classList.contains('on');
function closePops(done) { if ($('tray').classList.contains('on')) morphClose($('tray'), done); else if ($('sheet').classList.contains('on')) morphClose($('sheet'), done); else done && done(); }

/* ---------- the Coach ---------- */
let trayMode = '';
function openTray(mode, src) {
  trayMode = mode;
  $('trayWho').textContent = S.coach; $('trayTxt').innerHTML = mode === 'today' ? S.trayT : S.trayW;
  $('trayYes').textContent = mode === 'today' ? S.startWith : S.use; $('trayNo').textContent = S.notNow;
  morphOpen($('tray'), src); haptic(5);
}
$('tCoach').onclick = () => openTray('today', $('tCoach'));
$('wCoach').onclick = () => openTray('work', $('wCoach'));
$('trayNo').onclick = () => morphClose($('tray'), () => { if (trayMode === 'work') { W.coachUsed = true; renderSet(); } });
$('scrim').onclick = () => { if (!W.finished || !$('sheet').classList.contains('on')) closePops(); else $('sDone').click(); };
$('trayYes').onclick = () => {
  const e = W.ex[0], prev = e.kg; e.kg = 82.5; W.coachUsed = true;
  const apply = () => { renderSet(); rack.preview(); toast(S.setTo, () => { e.kg = prev; W.coachUsed = false; renderSet(); rack.preview(); }); };
  if (trayMode === 'today') { morphClose($('tray')); goWork($('tCoach')); setTimeout(apply, 700); }
  else { $('wCoach').classList.add('hide'); morphClose($('tray'), apply); }
};

/* ---------- finish: hold to commit, then the summary ---------- */
function openHold() {
  if (anyPop()) return;
  $('fHold').hidden = false; $('fSum').hidden = true;
  const mins = Math.max(1, Math.round((performance.now() - W.started) / 60000));
  $('hTitle').textContent = S.hTitle; $('hSub').textContent = S.hSub(doneSets(), totalSets(), mins);
  $('holdTxt').innerHTML = S.hold; $('hCancel').textContent = S.keep;
  morphOpen($('sheet'), $('finish'));
}
$('finish').onclick = openHold;
$('hCancel').onclick = () => morphClose($('sheet'));
let holdT;
const hold = $('hold');
hold.addEventListener('pointerdown', (ev) => { ev.preventDefault(); hold.classList.add('held'); haptic(6); holdT = setTimeout(finishWorkout, 1050); });
['pointerup', 'pointerleave', 'pointercancel'].forEach((n) => hold.addEventListener(n, () => { if (!W.finished) { clearTimeout(holdT); hold.classList.remove('held'); } }));
hold.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); hold.classList.add('held'); holdT = setTimeout(finishWorkout, 1050); } });
let totalRoll;
function finishWorkout() {
  W.finished = true; W.endedAt = performance.now(); clearTimeout(restTimer); clep.stop(); W.phase = 'done'; haptic([12, 40, 20]);
  const r = hold.getBoundingClientRect(); sea.ripple(r.left + r.width / 2, r.top, 1.2);
  setTimeout(() => { morphGrow($('sheet'), () => { hold.classList.remove('held'); fillSummary(); }); rollTotal(380); }, 220);
}
function fillSummary() {
  $('fHold').hidden = true; $('fSum').hidden = false;
  const mins = Math.max(1, Math.round((W.endedAt - W.started) / 60000));
  $('sTitle').textContent = S.sTitle; $('sSub').textContent = S.sSub(mins, doneSets(), prCount());
  $('sRows').innerHTML = W.ex.map((e) => `<div class="sumrow"><b>${S[e.key]}</b><span>${e.done.length ? e.done.map((s) => s.pr ? `<span class="star">${fmt(s.kg)}×${s.reps} ★</span>` : `${fmt(s.kg)}×${s.reps}`).join(' · ') : `<i class="skip">${S.skipped}</i>`}</span></div>`).join('');
  $('sDone').textContent = S.toToday;
  if (!totalRoll) totalRoll = roller($('sTotal'));
  totalRoll(fmtInt(volume()).replace(/\d/g, '0'));
}
const rollTotal = (ms) => setTimeout(() => totalRoll(fmtInt(volume())), RM ? 0 : ms);
function openSummary() { fillSummary(); morphOpen($('sheet'), $('start')); rollTotal(320); }
$('sDone').onclick = () => morphClose($('sheet'), () => { if ($('work').classList.contains('on')) goToday(); });

/* ---------- workout clock ---------- */
setInterval(() => { if (W.phase !== 'off' && !W.finished && $('work').classList.contains('on')) $('clock').textContent = mmss((performance.now() - W.started) / 1000); }, 1000);

/* ---------- Back button and keyboard ---------- */
addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (anyPop()) closePops(); else if ($('work').classList.contains('on')) goToday(); } });

/* ---------- start ---------- */
setTheme(theme);
renderToday();
document.fonts && document.fonts.ready.then(() => { glass.draw(); });
requestAnimationFrame((t) => { lastT = t; glass.draw(); frame(t); });
if (Q.get('screen') === 'workout') { W.phase = 'lift'; W.started = performance.now(); renderEx(false); sea.mode = sea.modeTo = 1; sea.modeT = 1; show('work'); setTimeout(() => rack.build(), 50); }
</script>
</body>
