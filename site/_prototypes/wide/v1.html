<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aven 2 · workout · Dial</title>
<link rel="preload" href="../slice/fonts/newsreader-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../slice/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="v1.css">
</head>
<body data-m="set">
<div class="stage">
  <div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
  <div class="app" id="app">
    <header class="head">
      <button class="title" id="open" aria-label="Where am I in the workout">
        <small>Push · exercise 2 of 6</small>
        <em>Bench press</em>
      </button>
      <button class="coach" aria-label="Coach"><span></span></button>
    </header>
    <p class="last" id="last"><em>Last time 82.5 × 5.</em> Beat it.</p>

    <section class="drums" id="drums" aria-label="Weight and reps">
      <div class="band" aria-hidden="true"></div>
      <div class="drum" id="dKg" role="listbox" aria-label="Weight in kilograms"></div>
      <span class="u u1">kg</span>
      <div class="drum" id="dReps" role="listbox" aria-label="Reps"></div>
      <span class="u u2">reps</span>
    </section>

    <section class="rest" id="rest" aria-label="Rest">
      <div class="ring">
        <svg viewBox="0 0 280 280" aria-hidden="true">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2704a"/><stop offset="1" stop-color="#f0b45a"/></linearGradient></defs>
          <circle class="rtrack" cx="140" cy="140" r="124"/>
          <circle class="rarc" id="arc" cx="140" cy="140" r="124"/>
        </svg>
        <div class="clock"><small>Rest</small><span class="big num" id="clock">1:30</span><em id="doneLine">Set 3 · 82.5 × 6</em></div>
      </div>
      <p class="next" id="next">Next · <b>85 kg × 6</b></p>
      <div class="chips"><button id="plus">+15 s</button><button id="minus">−15 s</button></div>
    </section>

    <section class="record" id="rec" aria-label="New best">
      <div class="medal" id="medal">
        <div class="coin"><div class="face"><small>New best</small><span class="big num">85</span><em>kg × 6</em></div><i class="shine"></i></div>
      </div>
      <h2>Heaviest six you've ever done.</h2>
      <p>Up from 82.5 × 6 on 26 Oct · est. 1RM 102 kg</p>
    </section>

    <div class="pearls" id="pearls" aria-label="Sets"></div>
    <footer class="dock"><button class="go" id="go"><span class="pearl"></span><span class="lab" id="lab">Set done</span></button></footer>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="where" id="where" aria-label="The workout so far">
    <div class="w-head"><div><small>Push · 41:12</small><h2>About 24 min left</h2></div><button id="close" aria-label="Close"><i></i></button></div>
    <ol id="wlist"></ol>
    <p class="w-coach"><span></span><em>Short on time? Swapping lateral raise for a superset saves 6 min.</em><button>Apply</button></p>
  </aside>
  <div class="grain"></div>
</div>
<script type="module" src="v1.js"></script>
</body>
</html>
