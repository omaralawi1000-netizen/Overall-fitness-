<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thermo</title>
<link rel="stylesheet" href="common.css">
<style>
/* Thermo: the weight is a column of light in a frosted tube. Drag it to change the weight; the closer you get to
   your record, the hotter the whole room glows (colour follows the value). At the record line it turns gold.
   During rest the tube drains as the time runs out. */
.boost { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--heat, .5);
  background: radial-gradient(80% 60% at 78% 96%, var(--hot), var(--g2) 35%, transparent 75%); }
.ui { position: fixed; inset: 0; z-index: 2; display: grid; grid-template-columns: 1fr 104px; grid-template-rows: auto 1fr auto; column-gap: 14px; padding: calc(env(safe-area-inset-top) + 18px) 16px 22px 20px; }
.top { grid-column: 1 / -1; display: flex; justify-content: space-between; }
.left { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; padding-top: 18px; min-width: 0; }
h1 { font-size: 38px; line-height: 1; }
.sub { color: var(--soft); font-size: 14px; margin-top: 6px; }
.sub .num { font-size: 12px; }
.w { font-size: 92px; font-weight: 700; line-height: 1; letter-spacing: -0.05em; margin-top: auto; transition: color .4s; }
.hotrec .w { color: var(--gold); }
.unit { display: block; font-family: "Archivo", sans-serif; font-size: 17px; letter-spacing: 0; color: var(--soft); font-weight: 600; margin-top: 4px; }
.r { font-size: 48px; font-weight: 600; margin-top: 10px; }
.r small { font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0; color: var(--soft); margin-left: 8px; }
.badge { margin-top: 14px; min-height: 26px; color: var(--soft); font-size: 15px; }
.hotrec .badge { color: var(--gold); }
.hint { color: var(--dim); font-size: 13px; margin: 14px 0 22px; }
.restv { margin-top: auto; margin-bottom: 22px; }
.restv .t { font-size: 92px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; }
.restv p { color: var(--soft); margin-top: 10px; }
.restv p b { color: var(--ink); }
.restv .recline { color: var(--gold); font-size: 24px; margin: 0 0 6px; }
.tube { position: relative; grid-column: 2; grid-row: 2; border-radius: 52px; margin: 14px 0 22px; touch-action: none; cursor: ns-resize; --veil: 9%; --blur: 26px; overflow: clip; }
.fill { position: absolute; inset: 0; border-radius: inherit; will-change: transform; transform: translateY(calc((1 - var(--p, .5)) * 100%));
  background: linear-gradient(to top, var(--g1), var(--g2) 60%, var(--hot)); box-shadow: 0 -2px 0 color-mix(in srgb, #fff 70%, transparent) inset; }
.fill::before { content: ''; position: absolute; left: 10px; right: 10px; top: 6px; height: 24px; border-radius: 12px; background: color-mix(in srgb, #fff 55%, transparent); filter: blur(8px); }
.hotrec .fill { background: linear-gradient(to top, var(--g1), var(--gold) 70%, #FFF6DA); }
.marks { position: absolute; inset: 22px 0; pointer-events: none; }
.marks i { position: absolute; right: 0; width: 12px; height: 1.5px; background: color-mix(in srgb, var(--ink) 50%, transparent); transform: translateY(-50%); }
.marks i.major { width: 22px; }
.marks b { position: absolute; left: 14px; transform: translateY(-50%); font: 600 11px 'Unbounded', sans-serif; color: color-mix(in srgb, var(--ink) 70%, transparent); }
.marks .best { left: 0; right: 0; width: auto; height: 2px; background: var(--gold); }
.marks .bestl { left: auto; right: 10px; color: var(--gold); font-size: 9px; letter-spacing: .1em; transform: translateY(-140%); }
.acts { grid-column: 1 / -1; display: flex; gap: 10px; }
.acts .go.ghost { width: auto; padding: 0 22px; font-size: 14px; }
</style>
</head>
<body>
<div class="light"></div>
<div class="boost"></div>
<main class="ui">
  <div class="top"><span class="cap">Push · 41 min</span><span class="cap setof"></span></div>
  <div class="left">
    <h1 class="serif">Bench press</h1>
    <p class="sub">Last time <span class="num">82.5 × 5</span></p>
    <div class="work" style="display:contents">
      <div class="w num"><span class="wv"></span><span class="unit">kg</span></div>
      <div class="r num">× <span class="rv"></span><small>reps</small></div>
      <p class="badge"></p>
      <p class="hint">Drag the tube to change the weight</p>
    </div>
    <div class="restv" hidden aria-live="polite"><p class="recline serif" hidden>New record</p><div class="t num">1:30</div><p>Next <b class="num nx"></b></p></div>
  </div>
  <div class="tube frost" role="slider" aria-label="Weight" aria-valuemin="60" aria-valuemax="100" tabindex="0"><i class="fill"></i><div class="marks"></div></div>
  <div class="acts">
    <button type="button" class="go" data-a="tick"><span>Done</span><small class="gl"></small></button>
    <button type="button" class="go ghost" data-a="undo" hidden>Undo</button>
    <button type="button" class="go" data-a="skip" hidden><span>Go</span><small>skip rest</small></button>
  </div>
</main>
<div class="medal-flash"></div>
<div class="grain"></div>
<script type="module">
import { session, roll, press, play, SPRINGS, fmtKg, mmss, $, EX, REST } from './common.js';
const LO = 60, HI = 100, tube = $('.tube'), fill = $('.fill'), root = document.documentElement;
const pct = (kg) => (kg - LO) / (HI - LO);
let S = null, drain = null;
{ // Tick marks every 2.5 kg, labels every 10, a gold line at the record.
  const m = $('.marks'); let h = '';
  for (let kg = LO; kg <= HI; kg += 2.5) { const y = (1 - pct(kg)) * 100; h += `<i class="${kg % 10 === 0 ? 'major' : ''}" style="top:${y}%"></i>`; if (kg % 10 === 0) h += `<b style="top:${y}%">${kg}</b>`; }
  const by = (1 - pct(EX.best.kg)) * 100;
  h += `<i class="best" style="top:${by}%"></i><b class="bestl" style="top:${by}%">BEST</b>`;
  m.innerHTML = h;
}
// The tube's inner area (marks inset 22px) maps to the range, so the fill top lines up with the marks.
function setP(p) {
  const H = tube.clientHeight, pad = 22, y = pad + (1 - p) * (H - 2 * pad);
  fill.style.transform = `translateY(${y}px)`;
  root.style.setProperty('--heat', (0.15 + 0.85 * Math.max(0, (p - 0.2) / 0.8)).toFixed(3));
}
function show(s, dir = 1) {
  const p = s.plan[s.cur];
  roll($('.wv'), fmtKg(p.kg), dir); roll($('.rv'), p.r);
  const rec = p.kg > EX.best.kg || (p.kg === EX.best.kg && p.r > EX.best.r);
  document.body.classList.toggle('hotrec', rec);
  $('.badge').textContent = rec ? 'Over your best: a record if you make it' : p.kg === EX.best.kg ? 'At your best weight' : `${fmtKg(EX.best.kg - p.kg)} kg under your best`;
  $('.setof').textContent = `Set ${s.cur + 1} / ${s.plan.length}`;
  $('.gl').textContent = `Set ${s.cur + 1} of ${s.plan.length}`;
  tube.setAttribute('aria-valuenow', p.kg);
}
const btns = (ph) => { $('[data-a=tick]').hidden = ph !== 'set'; $('[data-a=undo]').hidden = $('[data-a=skip]').hidden = ph !== 'rest'; };
function rise(to) {
  // The light rises or falls to a weight on a spring, from wherever it is now.
  const from = getComputedStyle(fill).transform;
  fill.getAnimations().forEach((a) => a.cancel()); drain = null;
  setP(to);
  play(fill, [{ transform: from }, { transform: fill.style.transform }], SPRINGS.lift);
}
function faces(ph) { $('.work').hidden = false; $('.work').style.display = ph === 'set' ? 'contents' : 'none'; $('.restv').hidden = ph !== 'rest'; }
const api = session({
  render(s) { S = s; fill.getAnimations().forEach((a) => a.cancel()); show(s, 0); setP(pct(s.plan[s.cur].kg)); faces('set'); btns('set'); tube.style.pointerEvents = ''; },
  tick(s) {
    btns('rest'); this.second(s); tube.style.pointerEvents = 'none';
    const n = s.plan[s.cur + 1];
    $('.nx').textContent = n ? `${fmtKg(n.kg)} × ${n.r}` : 'Incline dumbbell';
    $('.recline').hidden = !s.record;
    if (s.record) play($('.medal-flash'), [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { damping: 1, response: 1.4 });
    faces('rest'); play($('.restv'), [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], SPRINGS.set);
    // The tube drains across the rest; the room cools with it.
    const H = tube.clientHeight, from = fill.style.transform, wait = s.record ? 1400 : 300;
    fill.style.transform = `translateY(${H}px)`;
    drain = fill.animate([{ transform: from }, { transform: from, offset: wait / (REST * 1000) }, { transform: `translateY(${H - 22}px)` }], { duration: REST * 1000, easing: 'linear' });
    root.style.setProperty('--heat', '0.15');
  },
  second(s) { $('.t').textContent = mmss(s.left); },
  next(s) {
    tube.style.pointerEvents = ''; document.body.classList.remove('hotrec');
    show(s); rise(pct(s.plan[s.cur].kg)); faces('set'); btns('set');
    play($('.w'), [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], SPRINGS.set);
  },
  undo(s) { this.render(s); },
});
// Direct tracking: the light follows the finger; the weight snaps to 2.5 kg and rolls.
function fromY(y) { const r = tube.getBoundingClientRect(), pad = 22; const p = 1 - (y - r.top - pad) / (r.height - 2 * pad); return Math.max(0, Math.min(1, p)); }
let dragging = false;
tube.addEventListener('pointerdown', (e) => { if (S.phase !== 'set') return; dragging = true; tube.setPointerCapture(e.pointerId); move(e); });
tube.addEventListener('pointermove', (e) => dragging && move(e));
const end = () => { if (!dragging) return; dragging = false; rise(pct(S.plan[S.cur].kg)); };
tube.addEventListener('pointerup', end); tube.addEventListener('pointercancel', end);
function move(e) {
  const p = fromY(e.clientY); fill.getAnimations().forEach((a) => a.cancel()); setP(p);
  const kg = Math.round((LO + p * (HI - LO)) / 2.5) * 2.5, cur = S.plan[S.cur];
  if (kg !== cur.kg) { const dir = kg > cur.kg ? 1 : -1; cur.kg = kg; show(S, dir); navigator.vibrate?.(4); }
}
tube.addEventListener('keydown', (e) => { if (S.phase !== 'set') return; const d = e.key === 'ArrowUp' ? 2.5 : e.key === 'ArrowDown' ? -2.5 : 0; if (!d) return; const c = S.plan[S.cur]; c.kg = Math.max(LO, Math.min(HI, c.kg + d)); show(S, Math.sign(d)); rise(pct(c.kg)); e.preventDefault(); });
addEventListener('resize', () => S && S.phase === 'set' && setP(pct(S.plan[S.cur].kg)));
['tick', 'skip', 'undo'].forEach((a) => press($(`[data-a=${a}]`)));
$('[data-a=tick]').onclick = () => api.tick();
$('[data-a=skip]').onclick = () => api.next();
$('[data-a=undo]').onclick = () => api.undo();
</script>
</body>
</html>
