<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poster</title>
<link rel="stylesheet" href="common.css">
<style>
/* Poster: giant lit type behind frosted slats, like a poster seen through blinds. The thin gaps between slats show
   the type sharp. Rest turns the slats open, and the giant countdown behind them takes the screen. */
.giant { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: clip; }
.gw { position: absolute; left: 0; right: 0; display: grid; place-items: center; font-weight: 800; line-height: 1; letter-spacing: -0.06em; color: var(--hot); }
.gw > span { grid-area: 1 / 1; transform: scaleY(1.6); transition: opacity .6s, color .6s; filter: drop-shadow(0 0 34px color-mix(in srgb, var(--g2) 80%, transparent)); }
.word { font-size: 150px; }
.clock { font-size: 150px; opacity: 0; }
:root[data-phase='rest'] .word { opacity: 0; }
:root[data-phase='record'] .word { color: var(--gold); }
:root[data-phase='rest'] .clock { opacity: 1; }
.rec .word { color: var(--gold); }
.ui { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 12px) 0 22px; perspective: 900px; }
.slats { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.slat { --veil: 12%; --blur: 26px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; transform-origin: 50% 50%; will-change: transform; }
.slat::before { border-radius: 0; }
.s1 { height: 54px; }
.s2 { height: 100px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; }
.s2 h1 { font-size: 38px; line-height: 1; }
.s2 p { color: var(--soft); font-size: 14px; } .s2 .num { font-size: 12px; }
.window { flex: 1; min-height: 170px; position: relative; }
.window small { position: absolute; right: 20px; bottom: 10px; color: var(--ink); }
:root[data-phase='rest'] .window small { opacity: 0; }
:root[data-phase='rest'] :is(.s2, .s5) > * { opacity: 0; }
.s2 > *, .s5 > * { transition: opacity .3s; }
.s4 small { font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0; color: var(--soft); }
.s4 { height: 90px; }
.r { font-size: 52px; font-weight: 600; letter-spacing: -0.04em; }
.s4 .best { text-align: right; color: var(--soft); font-size: 14px; } .s4 .best b { display: block; color: var(--ink); font: 600 15px 'Unbounded', sans-serif; }
.rec .s4 .best, .rec .s4 .best b { color: var(--gold); }
.s5 { height: 58px; gap: 8px; justify-content: flex-start; }
.s5 i { flex: 1; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 22%, transparent); }
.s5 i.d { background: var(--ink); }
.s5 i.c { background: color-mix(in srgb, var(--ink) 22%, transparent); box-shadow: inset 0 0 0 1.5px var(--ink); }
.s5 i.rc { background: var(--gold); }
.restnote { display: none; }
:root:is([data-phase='rest'], [data-phase='record']) .restnote { display: block; }
:root:is([data-phase='rest'], [data-phase='record']) .worknote { display: none; }
.restnote { font-size: 17px; } .restnote b { font-family: 'Unbounded', sans-serif; font-weight: 600; }
.acts { display: flex; gap: 10px; padding: 0 16px; margin-top: 14px; }
.acts .go.ghost { width: auto; padding: 0 22px; font-size: 14px; }
</style>
</head>
<body>
<div class="light"></div>
<div class="giant" aria-hidden="true"><div class="gw num"><span class="word"></span><span class="clock">1:30</span></div></div>
<main class="ui">
  <div class="slats">
    <div class="slat frost s1"><span class="cap">Push · 41 min</span><span class="cap setof"></span></div>
    <div class="slat frost s2"><h1 class="serif">Bench press</h1><p>Last time <span class="num">82.5 × 5</span></p></div>
    <div class="window"><small class="cap">kg</small></div>
    <div class="slat frost s4"><div class="worknote"><span class="r num">× <span class="rv"></span></span> <small>reps</small></div><div class="restnote" aria-live="polite"><span class="rn"></span> <b class="nx"></b></div><div class="best">Best<b>82.5 × 6</b></div></div>
    <div class="slat frost s5"></div>
  </div>
  <div class="acts">
    <button type="button" class="go" data-a="tick"><span>Done</span><small class="gl"></small></button>
    <button type="button" class="go ghost" data-a="undo" hidden>Undo</button>
    <button type="button" class="go" data-a="skip" hidden><span>Go</span><small>skip rest</small></button>
  </div>
</main>
<div class="medal-flash"></div>
<div class="grain"></div>
<script type="module">
import { session, roll, press, play, SPRINGS, fmtKg, mmss, $, $$, reduced } from './common.js';
const turn = [$('.s2'), $('.s5')]; // the slats that open in rest; the top and the "next" slat stay shut
function show(s, dir) {
  const p = s.plan[s.cur];
  roll($('.word'), fmtKg(p.kg), dir); roll($('.rv'), p.r, dir);
  $('.setof').textContent = `Set ${s.cur + 1} / ${s.plan.length}`;
  $('.gl').textContent = `Set ${s.cur + 1} of ${s.plan.length}`;
  $('.s5').innerHTML = s.plan.map((_, i) => `<i class="${i < s.cur || (i === s.cur && s.phase === 'rest') ? (s.record && i === s.cur ? 'rc' : 'd') : i === s.cur ? 'c' : ''}"></i>`).join('');
}
function fit() { const r = $('.window').getBoundingClientRect(); Object.assign($('.gw').style, { top: r.top + 'px', height: r.height + 'px' }); }
addEventListener('resize', fit); requestAnimationFrame(fit); document.fonts.ready.then(fit);
const btns = (ph) => { $('[data-a=tick]').hidden = ph !== 'set'; $('[data-a=undo]').hidden = $('[data-a=skip]').hidden = ph !== 'rest'; };
function blinds(open) {
  // Each slat turns on its own axis, one after another from the top, like a blind's cord being pulled.
  turn.forEach((el, i) => {
    const from = getComputedStyle(el).transform;
    el.getAnimations().forEach((a) => a.cancel());
    el.style.transform = open ? 'rotateX(78deg)' : '';
    if (!reduced()) play(el, [{ transform: from === 'none' ? 'rotateX(0deg)' : from }, { transform: open ? 'rotateX(78deg)' : 'rotateX(0deg)' }], SPRINGS.lift, { delay: i * 60 });
  });
}
const api = session({
  render(s) { document.body.classList.remove('rec'); turn.forEach((el) => { el.getAnimations().forEach((a) => a.cancel()); el.style.transform = ''; }); show(s, 0); btns('set'); },
  tick(s) {
    btns('rest'); show(s, 0); this.second(s);
    const n = s.plan[s.cur + 1];
    $('.rn').textContent = s.record ? 'Record. Next' : 'Next';
    $('.nx').textContent = n ? `${fmtKg(n.kg)} × ${n.r}` : 'Incline DB';
    if (s.record) {
      document.body.classList.add('rec');
      play($('.medal-flash'), [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { damping: 1, response: 1.4 });
      setTimeout(() => { if (s.phase === 'rest') blinds(true); }, 1500); // the gold weight holds a moment, then the blinds open
    } else blinds(true);
  },
  second(s) { $('.clock').textContent = mmss(s.left); },
  next(s) { document.body.classList.remove('rec'); blinds(false); show(s, 1); btns('set'); },
  undo(s) { blinds(false); document.body.classList.remove('rec'); show(s, -1); btns('set'); },
});
['tick', 'skip', 'undo'].forEach((a) => press($(`[data-a=${a}]`)));
$('[data-a=tick]').onclick = () => api.tick();
$('[data-a=skip]').onclick = () => api.next();
$('[data-a=undo]').onclick = () => api.undo();
</script>
</body>
</html>
