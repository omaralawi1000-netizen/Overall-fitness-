<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deck</title>
<link rel="stylesheet" href="common.css">
<style>
/* Deck: every set is its own pane of glass. What's still to come is stacked behind, so you see the glass layer on
   glass. A tick files the front pane away into the row of finished sets; the next pane steps forward. */
.discs { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.discs i { position: absolute; border-radius: 50%; animation: float 14s ease-in-out infinite alternate; }
.discs i:nth-child(1) { width: 260px; height: 260px; left: -70px; top: 46%; background: radial-gradient(closest-side, var(--hot), var(--g2) 45%, transparent); }
.discs i:nth-child(2) { width: 180px; height: 180px; right: -40px; top: 18%; background: radial-gradient(closest-side, var(--g2), var(--g1) 55%, transparent); animation-duration: 18s; animation-direction: alternate-reverse; }
@keyframes float { to { transform: translate(40px, -60px); } }
.ui { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 18px) 16px 22px; }
.top { display: flex; justify-content: space-between; padding: 0 4px; }
.filed { display: flex; gap: 6px; min-height: 40px; margin-top: 14px; }
.pill { height: 40px; padding: 0 11px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; --veil: 16%; --blur: 20px; }
.pill svg { width: 14px; height: 14px; }
.pill.rec { color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold); border-radius: 20px; }
.stack { position: relative; flex: 1; margin: 22px 0 18px; }
.card { position: absolute; left: 0; right: 0; bottom: 0; height: min(420px, 100%); border-radius: 40px; padding: 22px 24px; display: flex; flex-direction: column; transform-origin: 50% 0;
  --veil: 12%; --blur: 30px; }
.card .k { display: flex; justify-content: space-between; }
.card h2 { font-size: 34px; line-height: 1; margin-top: 12px; }
.card .w { font-size: 104px; font-weight: 700; line-height: 1; letter-spacing: -0.05em; margin-top: auto; }
.card .w small, .card .rr small { font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0; color: var(--soft); margin-left: 8px; }
.card .rr { font-size: 46px; font-weight: 600; margin-top: 4px; }
.card .foot { color: var(--soft); font-size: 14px; margin-top: 14px; }
.card .foot .num { font-size: 12px; }
.card .restface { position: absolute; inset: 0; border-radius: inherit; display: grid; place-content: center; text-align: center; opacity: 0; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 30%, transparent); }
.card .restface .t { font-size: 104px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; }
.card .restface p { color: var(--soft); margin-top: 10px; }
.card .restface p b { color: var(--ink); }
.card.resting .restface { opacity: 1; }
.card.resting .setface { opacity: .1; filter: blur(8px); }
.card .setface { display: flex; flex-direction: column; flex: 1; transition: opacity .45s, filter .45s; }
.card.rec::before { box-shadow: inset 0 0 0 2px var(--gold), 0 0 60px -10px var(--gold); }
.recline { color: var(--gold); font-size: 22px; }
.acts { display: flex; gap: 10px; }
.acts .go.ghost { width: auto; padding: 0 22px; font-size: 14px; }
</style>
</head>
<body>
<div class="light"></div>
<div class="discs" aria-hidden="true"><i></i><i></i></div>
<main class="ui">
  <div class="top"><span class="cap">Push · 41 min</span><span class="cap setof"></span></div>
  <div class="filed" aria-label="Finished sets"></div>
  <div class="stack"></div>
  <div class="acts">
    <button type="button" class="go" data-a="tick"><span>Done</span><small class="gl"></small></button>
    <button type="button" class="go ghost" data-a="undo" hidden>Undo</button>
    <button type="button" class="go" data-a="skip" hidden><span>Go</span><small>skip rest</small></button>
  </div>
</main>
<div class="medal-flash"></div>
<div class="grain"></div>
<script type="module">
import { session, press, play, SPRINGS, fmtKg, mmss, $, $$ } from './common.js';
import { curve } from '../../round/motion.js';
const stack = $('.stack'), filed = $('.filed');
const AFTER = [{ name: 'Incline dumbbell', kg: 30, r: 10, of: 'Next · Incline DB' }, { name: 'Cable fly', kg: 15, r: 12, of: 'Then · Cable fly' }];
const CHECK = '<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const sp = curve(SPRINGS.set);
const place = (el, k) => { el.style.transform = `translateY(${-30 * k}px) scale(${1 - 0.07 * k})`; el.style.zIndex = 10 - k; el.style.opacity = k > 2 ? 0 : 1; };
function cardHTML(c) {
  return `<div class="setface"><div class="k"><span class="cap">${c.of}</span><span class="cap num">${fmtKg(c.kg)} × ${c.r}</span></div>
    <h2 class="serif">${c.name}</h2>
    <div class="w num">${fmtKg(c.kg)}<small>kg</small></div><div class="rr num">× ${c.r}<small>reps</small></div>
    <p class="foot">${c.foot || '&nbsp;'}</p></div>
    <div class="restface" aria-live="polite"><p class="recline serif" hidden>New record</p><div class="t num">1:30</div><p>Then <b class="num">${fmtKg(c.kg)} × ${c.r}</b></p></div>`;
}
function deckFor(s) {
  const sets = s.plan.slice(s.cur).map((p, j) => ({ name: 'Bench press', kg: p.kg, r: p.r, of: `Bench · set ${s.cur + j + 1} of ${s.plan.length}`, foot: 'Last time <span class="num">82.5 × 5</span> · best <span class="num">82.5 × 6</span>' }));
  return [...sets, ...AFTER];
}
function build(s) {
  stack.innerHTML = '';
  deckFor(s).slice(0, 4).forEach((c, k) => {
    const el = document.createElement('section'); el.className = 'card frost'; el.innerHTML = cardHTML(c);
    place(el, k); stack.append(el);
  });
  filed.innerHTML = s.plan.slice(0, s.cur).map((p) => `<span class="pill frost num">${CHECK}${fmtKg(p.kg)}×${p.r}</span>`).join('');
  $('.setof').textContent = `Set ${s.cur + 1} / ${s.plan.length}`;
  $('.gl').textContent = `Set ${s.cur + 1} of ${s.plan.length}`;
}
const btns = (ph) => { $('[data-a=tick]').hidden = ph !== 'set'; $('[data-a=undo]').hidden = $('[data-a=skip]').hidden = ph !== 'rest'; };
const cards = () => $$('.card', stack);
const api = session({
  render(s) { build(s); btns('set'); },
  tick(s) {
    btns('rest');
    const [front, ...rest] = cards();
    const p = s.plan[s.cur];
    // The pane files itself into the row of finished sets: it travels up and shrinks into the new pill.
    const pill = document.createElement('span'); pill.className = `pill frost num${s.record ? ' rec' : ''}`; pill.innerHTML = `${CHECK}${fmtKg(p.kg)}×${p.r}`;
    pill.style.opacity = 0; filed.append(pill);
    const a = front.getBoundingClientRect(), b = pill.getBoundingClientRect();
    const sx = b.width / a.width, sy = b.height / a.height;
    if (s.record) front.classList.add('rec');
    const go = () => {
      front.style.zIndex = 20;
      play(front, [{ transform: 'none', opacity: 1 }, { opacity: 0.6, offset: 0.25 }, { transform: `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(${sx}, ${sy})`, opacity: 0 }], SPRINGS.set, { fill: 'forwards' })
        .finished.then(() => front.remove(), () => {});
      play(pill, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], SPRINGS.press, { delay: 160, fill: 'backwards' });
      pill.style.opacity = '';
      // The rest step forward, each from where it was.
      rest.forEach((el, k) => { const from = el.style.transform; place(el, k); el.animate([{ transform: from }, { transform: el.style.transform }], { duration: sp.duration, easing: sp.easing }); });
      const nf = rest[0];
      if (nf) { nf.classList.add('resting'); nf.querySelector('.recline').hidden = !s.record; }
      this.second(s);
    };
    if (s.record) { play($('.medal-flash'), [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { damping: 1, response: 1.4 }); play(front, [{ transform: 'none' }, { transform: 'scale(1.04)' }, { transform: 'none' }], SPRINGS.press); setTimeout(go, 700); }
    else go();
    // Keep a fourth pane coming in at the back.
    const next = deckFor({ ...s, cur: s.cur + 1 })[3];
    if (next) { const el = document.createElement('section'); el.className = 'card frost'; el.innerHTML = cardHTML(next); place(el, 3); stack.prepend(el); }
  },
  second(s) { const t = $('.card.resting .t'); if (t) t.textContent = mmss(s.left); },
  next(s) {
    const f = $('.card.resting');
    if (f) { f.classList.remove('resting'); play(f, [{ transform: 'scale(.98)' }, { transform: 'none' }], SPRINGS.press); }
    $('.setof').textContent = `Set ${s.cur + 1} / ${s.plan.length}`;
    $('.gl').textContent = `Set ${s.cur + 1} of ${s.plan.length}`;
    btns('set');
  },
  undo(s) { build(s); btns('set'); },
});
['tick', 'skip', 'undo'].forEach((a) => press($(`[data-a=${a}]`)));
$('[data-a=tick]').onclick = () => api.tick();
$('[data-a=skip]').onclick = () => api.next();
$('[data-a=undo]').onclick = () => api.undo();
</script>
</body>
</html>
