<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lava</title>
<link rel="stylesheet" href="common.css">
<style>
/* Lava: the exercise is a frosted capsule with molten light drifting inside, like a lava lamp. Every set you finish
   drops into the pool at the bottom, so the capsule fills as the exercise goes. Rest slows and cools the lava. */
.ui { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top) + 18px) 16px 22px; }
.top { align-self: stretch; display: flex; justify-content: space-between; padding: 0 4px; }
h1 { font-size: 36px; line-height: 1; margin-top: 14px; }
.capsule { position: relative; flex: 1; width: 236px; margin: 16px 0 12px; border-radius: 120px; overflow: clip; isolation: isolate; }
.lava { position: absolute; inset: 0; z-index: -2; }
.lava i { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, var(--hot), var(--g2) 45%, var(--g1) 82%, transparent 92%); animation: rise 13s ease-in-out infinite alternate; will-change: transform; }
.lava i:nth-child(1) { width: 150px; height: 150px; left: -20px; bottom: 6%; }
.lava i:nth-child(2) { width: 110px; height: 110px; right: -16px; bottom: 30%; animation-duration: 17s; animation-delay: -6s; }
.lava i:nth-child(3) { width: 90px; height: 90px; left: 60px; bottom: 52%; animation-duration: 11s; animation-delay: -3s; }
.lava i:nth-child(4) { width: 130px; height: 130px; left: 30px; bottom: -10%; animation-duration: 19s; animation-delay: -9s; }
@keyframes rise { 0% { transform: translateY(0) scale(1); } 50% { transform: translateY(-120px) scale(1.12, .92); } 100% { transform: translateY(-260px) scale(.9, 1.08); } }
.pool { position: absolute; left: -10%; right: -10%; bottom: 0; height: 100%; z-index: -2; border-radius: 50% 50% 0 0 / 28px 28px 0 0; will-change: transform;
  background: linear-gradient(to top, color-mix(in srgb, var(--g1) 70%, var(--bg)), var(--g1) 50%, var(--g2)); transform: translateY(calc((1 - var(--lv, 0)) * 100%)); }
.rec .pool { background: linear-gradient(to top, var(--g1), var(--gold) 70%, #FFF6DA); }
.glass { position: absolute; inset: 0; z-index: -1; border-radius: inherit; --veil: 9%; --blur: 14px; }
.glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(90deg, rgb(255 255 255 / .22), transparent 18%, transparent 78%, rgb(255 255 255 / .1)); }
.inside { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 30%; text-align: center; text-shadow: 0 2px 22px rgb(0 0 0 / .4); }
.w { font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -0.05em; }
.lbl { font-size: 15px; color: var(--soft); font-weight: 600; margin-top: 4px; }
.r { font-size: 44px; font-weight: 600; margin-top: 12px; }
.t { font-size: 70px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; }
.rest p { color: var(--soft); margin-top: 8px; font-size: 15px; }
.rest p b { color: var(--ink); }
.recline { color: var(--gold); font-size: 22px; margin-bottom: 6px; }
.drop { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; z-index: -2; background: radial-gradient(closest-side, var(--hot), var(--g2) 60%, var(--g1)); }
.rec .drop { background: radial-gradient(closest-side, #FFF6DA, var(--gold) 60%, #E08A1E); }
.sub { color: var(--soft); font-size: 14px; margin-bottom: 14px; }
.sub .num { font-size: 12px; }
.acts { align-self: stretch; display: flex; gap: 10px; }
.acts .go.ghost { width: auto; padding: 0 22px; font-size: 14px; }
</style>
</head>
<body>
<div class="light"></div>
<main class="ui">
  <div class="top"><span class="cap">Push · 41 min</span><span class="cap setof"></span></div>
  <h1 class="serif">Bench press</h1>
  <div class="capsule">
    <div class="lava" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="pool" aria-hidden="true"></div>
    <div class="glass frost" aria-hidden="true"></div>
    <div class="inside work"><div class="w num"></div><div class="lbl">kg</div><div class="r num">× <span class="rv"></span></div><div class="lbl">reps</div></div>
    <div class="inside rest" hidden aria-live="polite"><p class="recline serif" hidden>New record</p><div class="t num">1:30</div><p>Next <b class="num nx"></b></p></div>
  </div>
  <p class="sub">Last time <span class="num">82.5 × 5</span> · best <span class="num">82.5 × 6</span></p>
  <div class="acts">
    <button type="button" class="go" data-a="tick"><span>Done</span><small class="gl"></small></button>
    <button type="button" class="go ghost" data-a="undo" hidden>Undo</button>
    <button type="button" class="go" data-a="skip" hidden><span>Go</span><small>skip rest</small></button>
  </div>
</main>
<div class="medal-flash"></div>
<div class="grain"></div>
<script type="module">
import { session, roll, press, play, SPRINGS, fmtKg, mmss, $, $$ } from './common.js';
const pool = $('.pool'), cap = $('.capsule');
const pace = (r) => $$('.lava i').forEach((b) => b.getAnimations().forEach((a) => a.updatePlaybackRate(r)));
const level = (n) => 0.05 + 0.1 * n; // share of the capsule the pool fills after n sets
function setLevel(n, animate) {
  const from = getComputedStyle(pool).transform;
  pool.style.setProperty('--lv', level(n));
  if (animate) play(pool, [{ transform: from }, { transform: getComputedStyle(pool).transform }], SPRINGS.press);
}
function show(s, dir) {
  const p = s.plan[s.cur];
  roll($('.w'), fmtKg(p.kg), dir); roll($('.rv'), p.r, dir);
  $('.setof').textContent = `Set ${s.cur + 1} / ${s.plan.length}`;
  $('.gl').textContent = `Set ${s.cur + 1} of ${s.plan.length}`;
}
const btns = (ph) => { $('[data-a=tick]').hidden = ph !== 'set'; $('[data-a=undo]').hidden = $('[data-a=skip]').hidden = ph !== 'rest'; };
const faces = (ph) => { $('.work').hidden = ph !== 'set'; $('.rest').hidden = ph !== 'rest'; };
const api = session({
  render(s) { pace(1); document.body.classList.remove('rec'); show(s, 0); setLevel(s.cur); faces('set'); btns('set'); },
  tick(s) {
    btns('rest'); this.second(s); pace(0.35); // rest slows the lava
    document.body.classList.toggle('rec', s.record);
    const n = s.plan[s.cur + 1];
    $('.nx').textContent = n ? `${fmtKg(n.kg)} × ${n.r}` : 'Incline dumbbell';
    $('.recline').hidden = !s.record;
    // One drop forms where the number was and falls into the pool; the pool takes it with a small swell.
    const d = document.createElement('i'); d.className = 'drop'; cap.append(d);
    const H = cap.clientHeight, fall = H * 0.5 - H * level(s.cur + 1) + 10;
    d.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.25)', offset: 0.22 }, { transform: 'scale(1)', offset: 0.32 }, { transform: `translateY(${fall}px) scale(.8, 1.2)` }],
      { duration: 900, easing: 'cubic-bezier(.5,0,.9,.4)' }).finished.then(() => { d.remove(); setLevel(s.cur + 1, true); });
    if (s.record) play($('.medal-flash'), [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { damping: 1, response: 1.4 });
    faces('rest'); play($('.rest'), [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], SPRINGS.set, { delay: 300 });
  },
  second(s) { $('.t').textContent = mmss(s.left); },
  next(s) { pace(1); document.body.classList.remove('rec'); show(s, 1); faces('set'); btns('set'); play($('.work'), [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], SPRINGS.set); },
  undo(s) { cap.querySelectorAll('.drop').forEach((d) => d.remove()); this.render(s); },
});
['tick', 'skip', 'undo'].forEach((a) => press($(`[data-a=${a}]`)));
$('[data-a=tick]').onclick = () => api.tick();
$('[data-a=skip]').onclick = () => api.next();
$('[data-a=undo]').onclick = () => api.undo();
</script>
</body>
</html>
