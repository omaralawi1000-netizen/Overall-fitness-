<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Steam</title>
<link rel="stylesheet" href="common.css">
<style>
/* Steam: the whole screen is a fogged window. The set you're on is wiped clear with one stroke of a hand, so its
   number is the only sharp thing; everything else glows through the frost. Rest fogs the window over, and it slowly
   clears again as you recover, until the next weight is sharp. */
:root { --hole-y: 168px; }
.behind { position: fixed; left: 0; right: 0; top: var(--hole-y); height: 300px; z-index: 1; display: grid; place-items: center; pointer-events: none; }
.behind::before { content: ''; position: absolute; inset: -18% -14%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--g2) 85%, transparent), color-mix(in srgb, var(--g1) 70%, transparent) 55%, transparent); }
.big { position: relative; display: grid; justify-items: center; line-height: 1; font-weight: 800; color: var(--hot); filter: drop-shadow(0 0 26px color-mix(in srgb, var(--hot) 60%, transparent)); transition: color .6s, opacity .9s; }
.big .w { font-size: 112px; }
.big .x { font-size: 52px; font-weight: 600; margin-top: 10px; }
.big small { font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0; margin-left: 8px; opacity: .8; }
:root[data-phase='rest'] .big { opacity: .4; }
:root[data-phase='rest'] .behind::before { opacity: .35; }
.behind::before { transition: opacity .9s; }
.rec .big { color: var(--gold); }
.fog { position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: color-mix(in srgb, var(--ink) 13%, transparent) var(--grain); background-size: 128px;
  -webkit-backdrop-filter: blur(26px) saturate(1.6); backdrop-filter: blur(26px) saturate(1.6); }
.fog.wiped {
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 460 320'><filter id='b' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='6'/></filter><path filter='url(%23b)' d='M92 84 C170 52 290 60 372 96 M74 166 C170 136 300 150 388 178 M104 246 C180 222 270 228 352 254' fill='none' stroke='black' stroke-width='80' stroke-linecap='round'/></svg>") 50% calc(var(--hole-y) - 10px) / 460px 320px no-repeat, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; }
.fog.all { opacity: 0; }
.ui { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 18px) 20px 22px; }
.top { display: flex; justify-content: space-between; }
h1 { font-size: 40px; line-height: 1; margin-top: 18px; }
.sub { color: var(--soft); font-size: 15px; margin-top: 6px; }
.sub .num { font-size: 13px; }
.rest { position: absolute; left: 0; right: 0; top: calc(var(--hole-y) + 40px); text-align: center; }
.rest { text-shadow: 0 2px 30px rgb(0 0 0 / .35); }
.rest .t { font-size: 108px; font-weight: 700; line-height: 1; letter-spacing: -0.05em; }
.rest .n { margin-top: 12px; color: var(--soft); }
.rest .n b { color: var(--ink); font-weight: 600; }
.marks { margin-top: auto; display: flex; justify-content: center; gap: 30px; margin-bottom: 22px; }
.mark { display: grid; justify-items: center; gap: 6px; width: 62px; }
.mark svg { width: 20px; height: 48px; overflow: visible; }
.mark path { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 52; stroke-dashoffset: 52; opacity: .9; }
.mark.done path { stroke-dashoffset: 0; }
.mark.cur path { stroke-dashoffset: 0; stroke-dasharray: 2 9; opacity: .55; }
.mark.rec path { stroke: var(--gold); }
.mark span { font-size: 13px; color: var(--dim); white-space: nowrap; }
.mark.done span { color: var(--soft); }
.acts { display: flex; gap: 10px; }
.acts .go.ghost { flex: 0 0 auto; width: auto; padding: 0 22px; font-size: 14px; }
.recline { position: absolute; left: 0; right: 0; top: calc(var(--hole-y) - 6px); text-align: center; font-size: 22px; color: var(--gold); opacity: 0; }
</style>
</head>
<body>
<div class="light"></div>
<div class="behind" aria-hidden="true"><div class="big num"><div><span class="w"></span><small>kg</small></div><div class="x">× <span class="r"></span><small>reps</small></div></div></div>
<div class="fog wiped" aria-hidden="true"></div>
<div class="fog all" aria-hidden="true"></div>
<main class="ui">
  <div class="top"><span class="cap">Push · 41 min</span><span class="cap setof"></span></div>
  <h1 class="serif">Bench press</h1>
  <p class="sub">Last time <span class="num">82.5 × 5</span> · best <span class="num">82.5 × 6</span></p>
  <p class="recline serif">New record</p>
  <div class="rest" hidden aria-live="polite"><div class="t num">1:30</div><p class="n">Next <b class="num nx"></b></p></div>
  <div class="marks"></div>
  <div class="acts">
    <button type="button" class="go" data-a="tick"><span>Done</span><small class="gl"></small></button>
    <button type="button" class="go ghost" data-a="undo" hidden>Undo</button>
    <button type="button" class="go" data-a="skip" hidden><span>Go</span><small>skip rest</small></button>
  </div>
</main>
<div class="medal-flash"></div>
<div class="grain"></div>
<script type="module">
import { session, roll, press, play, SPRINGS, fmtKg, mmss, $, $$, REST } from './common.js';
const fogAll = $('.fog.all'), rest = $('.rest'), marks = $('.marks');
let clear = null;
const label = (p) => `${fmtKg(p.kg)} × ${p.r}`;
function drawMarks(s) {
  marks.innerHTML = s.plan.map((p, i) => `<div class="mark ${i < s.cur || (i === s.cur && s.phase === 'rest') ? 'done' : i === s.cur ? 'cur' : ''}"><svg viewBox="0 0 20 48"><path d="M11 2 C8 16 12 32 9 46"/></svg><span class="num">${label(p)}</span></div>`).join('');
}
function setFace(s, animate) {
  const p = s.plan[s.cur];
  roll($('.w'), fmtKg(p.kg), animate ? 1 : 0); roll($('.r'), p.r);
  $('.setof').textContent = `Set ${s.cur + 1} / ${s.plan.length}`;
  $('.gl').textContent = `Set ${s.cur + 1} of ${s.plan.length}`;
}
function buttons(phase) {
  $('[data-a=tick]').hidden = phase !== 'set';
  $('[data-a=undo]').hidden = $('[data-a=skip]').hidden = phase !== 'rest';
}
const api = session({
  render(s) {
    clear?.cancel(); fogAll.getAnimations().forEach((a) => a.cancel()); fogAll.style.opacity = 0;
    document.body.classList.remove('rec'); $('.recline').style.opacity = 0;
    setFace(s); drawMarks(s); rest.hidden = true; buttons('set');
  },
  tick(s) {
    // The stroke for this set is drawn, like a finger on the glass.
    drawMarks(s);
    const m = marks.children[s.cur]; m.classList.toggle('rec', s.record);
    play(m.querySelector('path'), [{ strokeDashoffset: 52, strokeDasharray: 52 }, { strokeDashoffset: 0, strokeDasharray: 52 }], SPRINGS.set);
    if (s.record) {
      document.body.classList.add('rec');
      play($('.medal-flash'), [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { damping: 1, response: 1.4 });
      play($('.recline'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], SPRINGS.press, { fill: 'forwards' });
    }
    // The window fogs over (a record keeps its gold a moment first), then clears across the whole rest.
    const wait = s.record ? 1600 : 250;
    fogAll.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: wait, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
    clear = fogAll.animate([{ opacity: 1 }, { opacity: 0.08, offset: 0.85 }, { opacity: 0 }], { duration: REST * 1000 - wait - 900, delay: wait + 900, easing: 'linear', fill: 'forwards' });
    setTimeout(() => {
      if (s.phase !== 'rest') return;
      document.body.classList.remove('rec'); $('.recline').style.opacity = 0;
      const n = s.plan[s.cur + 1];
      $('.nx').textContent = n ? label(n) : 'Incline dumbbell';
      if (n) { roll($('.w'), fmtKg(n.kg)); roll($('.r'), n.r); }
      rest.hidden = false;
      play(rest, [{ opacity: 0, transform: 'scale(.96)' }, { opacity: 1, transform: 'none' }], SPRINGS.set);
    }, wait + 500);
    buttons('rest'); this.second(s);
  },
  second(s) { $('.t').textContent = mmss(s.left); },
  next(s) {
    clear?.cancel(); fogAll.getAnimations().forEach((a) => a.cancel());
    // Whatever fog is left wipes away now.
    const o = getComputedStyle(fogAll).opacity; fogAll.style.opacity = 0;
    fogAll.animate([{ opacity: o }, { opacity: 0 }], { duration: 380, easing: 'ease-out' });
    play(rest, [{ opacity: 1 }, { opacity: 0 }], { damping: 1, response: 0.2 }).finished.then(() => { rest.hidden = true; });
    setFace(s, true); drawMarks(s); buttons('set');
  },
  undo(s) { this.render(s); },
});
press($('[data-a=tick]')); press($('[data-a=skip]')); press($('[data-a=undo]'));
$('[data-a=tick]').onclick = () => api.tick();
$('[data-a=skip]').onclick = () => api.next();
$('[data-a=undo]').onclick = () => api.undo();
</script>
</body>
</html>
